# Used for: the injection architecture itself (common/jepa_injection_model.py),
# all training/eval scripts that load Qwen3-VL-2B-Thinking (train/eval in
# egodex_probe/ and vans_qa/*), Node.js is NOT needed here (that's the
# thinkjepa env, for yt-dlp).
name: qwen3vl
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch==2.10.0
      - torchvision==0.25.0  # qwen_vl_utils imports this; wasn't declared and pulled in an unpinned torch upgrade
      - transformers==5.1.0
      - qwen-vl-utils==0.0.14
      - accelerate
      - numpy
      - huggingface_hub==1.20.1
      - decord  # every train/eval script here sets FORCE_QWENVL_VIDEO_READER=decord (some import it directly); wasn't declared
      - opencv-python-headless  # vans_qa/full_scale/train_qa_full.py's clamp_frame_count() imports cv2 directly; wasn't declared -- 100% of items were skipped with ModuleNotFoundError until this was added
