# Step 19: same config as job-15-train-latent-world-model-crossattn.yaml
# (--guidance crossattn), but with --warmstart_alignment -- the
# reverse-direction half of the warm-start cross-modal coupling ablation
# (idea 2 from the earlier research planning). job-15's already-completed
# run (test pred_loss=7.4503, beating job-16's no-guidance control's 7.4691
# on all three metrics) is this ablation's random-init baseline --
# --out_dir differs so this doesn't clobber it. See
# vans_qa/full_scale/fit_warmstart_alignment.py's module docstring for the
# full rationale and job-17 for how the alignment file gets produced (must
# run and complete before this job).
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-train-latent-world-model-crossattn-warmstart
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-fiona-001.sdmz.amnh.org
                      - hcc-chase-shor-c4705.unl.edu
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
                      - hcc-nrp-shor-c6009.unl.edu
                      - k8s-chase-ci-07.calit2.optiputer.net
                      - k8s-3090-01.usd.edu
                      - k8s-haosu-15.sdsc.optiputer.net
                      - hcc-nrp-shor-c5909.unl.edu
                      - hcc-nrp-shor-c5925.unl.edu
      containers:
        - name: train-latent-world-model-crossattn-warmstart
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              # See job-14: cache_train.thinker_train unconditionally imports
              # EgoDex's h5py-dependent dataloader even though this script
              # never touches EgoDex.
              "$PY" -m pip install --quiet h5py

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/train_latent_world_model_full.py \
                --guidance crossattn \
                --epochs 1 \
                --val_every_steps 500 \
                --save_every_steps 1000 \
                --max_val_items 200 \
                --warmstart_alignment /data/raw_data/warmstart_alignment.pt \
                --out_dir /data/raw_data/latent_world_model_runs_warmstart
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4.8"
              memory: "19200Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-19-train-latent-world-model-crossattn-warmstart.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-train-latent-world-model-crossattn-warmstart -n williamli-scvl
# Clean up when done:
#   kubectl delete job ruixin-train-latent-world-model-crossattn-warmstart -n williamli-scvl
#
# Output: /data/raw_data/latent_world_model_runs_warmstart/crossattn/
# {train_log.jsonl, best.pt, step_<N>.pt, test_metrics.json}. Compare
# against job-15's latent_world_model_runs/crossattn/ (random-init baseline).
