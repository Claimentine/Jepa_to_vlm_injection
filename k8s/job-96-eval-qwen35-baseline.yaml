# Step 96: A2 -- Qwen3.5-9B (https://huggingface.co/Qwen/Qwen3.5-9B),
# zero-shot frozen-VLM baseline (no JEPA injection at all, same
# --checkpoint label=NONE path the project's own zeroshot_none row uses),
# on the two lightest of our four benchmarks by item count -- CrossTask
# (n=1558) and COIN full-test (n=2846) -- per the user's explicit decision
# (2026-10-22) to run each new A2 baseline on only these two, not all four.
# First of four planned A2 models (Qwen3.5-VL -> LLaVA-Next-Video ->
# Gemini 2.5 Flash -> InternVL), chosen first for being closest to our
# existing harness (same vendor/family as the project's own Qwen3-VL-2B-
# Thinking, so --model_id is likely a drop-in swap -- confirmed the HF repo
# is a genuine image-text-to-text multimodal model, not text-only, and that
# our installed transformers (5.1.0) has both AutoModelForImageTextToText
# and AutoModelForMultimodalLM available, before committing to this run).
#
# Runs on the newly-cloned ruixin-conda-vol-baselines (RBD clone of
# ruixin-conda-vol, ~15s to provision) instead of the three existing
# conda-vols, all of which are tied up for a long time right now
# (job-83: mid-training; job-90: running unusually slowly today, still on
# its own final benchmark; job-95: expected to run for days) -- confirmed
# no PVC-count/storage-total quota blocks this (namespace ResourceQuota
# has no such entry) and GPU quota has headroom (4/10 used).
#
# UPDATED 2026-10-26: this job never produced output -- root cause found:
# the CrossTask stage's --precompute_cache_dir below pointed at
# eval_input_cache_crosstask (the shared/own-model cache, job-63), NOT
# job-97's own eval_input_cache_crosstask_qwen35 -- wrong processor's
# tensors entirely, likely crashed or silently corrupted every item. Fixed
# to point at the correct, qwen35-suffixed cache dir. COIN stage REMOVED
# for this round -- per explicit user decision, test CrossTask first
# against job-97's current cache coverage (1328/1558, 85% -- the remaining
# ~230 items fall back to live decode automatically, same mechanism as any
# other uncached item); COIN stage will come back once job-97's
# newly-added COIN precompute stage has real coverage to test against.
#
# Also moved off ruixin-conda-vol-baselines onto its own clone
# (ruixin-conda-vol-baselines2, see pvc-conda-rbd-baselines2.yaml): job-96
# and job-97 both touch Qwen3.5-9B baseline data but need to run
# concurrently, and sharing the original RWO PVC caused a real
# Multi-Attach failure the first time this was tried.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-eval-qwen35-baseline
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - k8s-chase-ci-01.calit2.optiputer.net
                      - nrp-g1.nysernet.org
                      - hcc-nrp-shor-c6017.unl.edu
      containers:
        - name: eval-qwen35-baseline
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              MODEL_ID="Qwen/Qwen3.5-9B"
              cd "$REPO"

              # First attempt hit: ValueError: model type `qwen3_5` not
              # recognized -- our env's transformers (5.1.0, cloned from
              # ruixin-conda-vol) predates Qwen3.5's architecture support.
              # This PVC (ruixin-conda-vol-baselines) is a fully independent
              # RBD clone used by no other job, so upgrading transformers
              # here is isolated -- it cannot affect job-83/90/95's own
              # copies on the other three conda-vols.
              "$PY" -m pip install --quiet --upgrade transformers accelerate

              echo "=== CrossTask (Qwen3.5-9B zero-shot) ==="
              export VANS_WORK_ROOT=/data/vans_work_crosstask
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --model_id "$MODEL_ID" \
                --qa_split /data/raw_data/qa_split_crosstask.json \
                --split_part test \
                --precompute_cache_dir /data/vans_work_crosstask/eval_input_cache_crosstask_qwen35 \
                --checkpoint zeroshot_qwen35=NONE \
                --resume \
                --out_path /data/raw_data/a2_baseline_qwen35_crosstask.json

              echo "A2_QWEN35_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "4"
              memory: "20Gi"
              ephemeral-storage: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4.8"
              memory: "20Gi"
              ephemeral-storage: "4800Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-baselines2
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-96-eval-qwen35-baseline.yaml -n williamli-scvl
