# Step 46: rerun of the job-13/22/34/42 full-test comparison (job-44 only
# covered job-42 alone; this repeats all four together) to check whether
# job-42's surprisingly low full-test result (0.6629, below both job-22
# 0.6830 and job-34 0.6720 despite a much higher 100-item snapshot of 0.83)
# holds up on a second independent pass, or was partly an artifact of which
# items happened to hit the 60s decode timeout this run (the concurrent
# depth-4 decode queue means timeout-item selection can differ slightly
# run-to-run under different CPU contention, unlike the old serial loop).
# job-13/22/34 have also been run before (job-32/37/41/44) but are included
# again here for a real apples-to-apples same-run comparison against job-42,
# not a cross-run one.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-eval-job42-rerun-fulltest
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-fiona-001.sdmz.amnh.org
                      - hcc-chase-shor-c4705.unl.edu
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
                      - hcc-nrp-shor-c6009.unl.edu
                      - k8s-chase-ci-07.calit2.optiputer.net
                      - k8s-3090-01.usd.edu
                      - k8s-haosu-15.sdsc.optiputer.net
                      - hcc-nrp-shor-c5909.unl.edu
                      - hcc-nrp-shor-c5925.unl.edu
                      - hpc-nrp-g1.nmsu.edu
                      - nautilus-ext-gpu01.fullerton.edu
                      - k8s-chase-ci-02.calit2.optiputer.net
                      - ry-gpu-15.sdsc.optiputer.net
                      - hcc-nrp-shor-c5809.unl.edu
      containers:
        - name: eval-job42-rerun-fulltest
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --checkpoint "job13_independent=/data/raw_data/qa_full_runs_temporal_crossattn/jepa/best.pt" \
                --checkpoint "job22_joint_vans_only=/data/raw_data/joint_coupled_runs/best_forward.pt" \
                --checkpoint "job34_joint_normalized=/data/raw_data/joint_coupled_normalized_runs/best_forward.pt" \
                --checkpoint "job42_bridge_mlp2048=/data/raw_data/joint_coupled_bridge_mlp_runs/best_forward.pt" \
                --split_part test \
                --out_path /data/raw_data/forward_fulltest_comparison_job42_rerun.json
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4.8"
              memory: "19200Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-46-eval-job42-rerun-fulltest.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-eval-job42-rerun-fulltest -n williamli-scvl
# Clean up when done:
#   kubectl delete job ruixin-eval-job42-rerun-fulltest -n williamli-scvl
