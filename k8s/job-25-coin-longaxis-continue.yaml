# Step 25: continue vans_qa/full_scale/extract_coin_longaxis.py past job-24's
# first batch, now that the data PVC has been expanded 1Ti -> 2Ti (see
# pvc-data-cephfs.yaml's header comment) -- job-24's 2000-video batch alone
# used ~50GB (15GB raw video cache + 35GB .npz outputs, since each .npz keeps
# the raw past/future frame images alongside the V-JEPA2 features), which
# left only 43GB free on the old 1Ti claim -- nowhere near enough for the
# remaining ~8000 of the full 10014-candidate pool.
#
# --limit 10014 covers the entire candidate pool (select_longaxis_pairs
# sorts by video_id and truncates to --limit, so this reuses job-24's exact
# same first-2000 ordering) -- the script's own is_valid_output skip check
# means the 1610 already-saved videos are skipped near-instantly, and it
# picks up from video #2001 onward. Same --output_dir/--video_cache_dir as
# job-24 so nothing is re-downloaded or re-encoded.
#
# backoffLimit changed to 0 (job-24 used 1): job-24's own retry attempt only
# recovered 19 of its 409 failures (~4.6%) at the cost of ~1.7 extra hours
# re-attempting the rest, which failed again identically -- at full-corpus
# scale (~20% permanent failure rate observed so far), an automatic retry
# pass would burn many extra hours re-downloading videos that are going to
# fail the same way again. A manual resubmit (this same file) is cheap if a
# genuinely worthwhile retry is ever wanted later.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-coin-longaxis-continue
spec:
  backoffLimit: 0
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-fiona-001.sdmz.amnh.org
                      - hcc-chase-shor-c4705.unl.edu
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
                      - hcc-nrp-shor-c6009.unl.edu
                      - k8s-chase-ci-07.calit2.optiputer.net
                      - k8s-3090-01.usd.edu
                      - k8s-haosu-15.sdsc.optiputer.net
                      - hcc-nrp-shor-c5909.unl.edu
                      - hcc-nrp-shor-c5925.unl.edu
      containers:
        - name: coin-longaxis-continue
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              "$PY" -m pip install --quiet timm yt-dlp
              export PATH="$(dirname "$PY"):$PATH"
              which yt-dlp

              echo "=== installing deno (yt-dlp JS runtime) ==="
              cd /tmp
              curl -sL https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip -o deno.zip
              unzip -q deno.zip
              ./deno --version

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/extract_coin_longaxis.py \
                --limit 10014 \
                --min_span_seconds 30 \
                --output_dir /data/raw_data/coin_longaxis \
                --video_cache_dir /data/raw_data/coin_longaxis_videos
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: VJEPA2_CKPT
              value: /data/checkpoints/vjepa2/vitl.pt
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              ephemeral-storage: "6Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4.8"
              memory: "19200Mi"
              ephemeral-storage: "7200Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-25-coin-longaxis-continue.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-coin-longaxis-continue -n williamli-scvl
# Clean up when done:
#   kubectl delete job ruixin-coin-longaxis-continue -n williamli-scvl
#
# This is a long-running job (job-24's first 2000 took ~7.4h) -- expect this
# one covering the remaining ~8000 candidates to take on the order of a day
# or more. Check progress with:
#   kubectl logs job/ruixin-coin-longaxis-continue -n williamli-scvl | grep -cE "^\[SAVED"
#   kubectl logs job/ruixin-coin-longaxis-continue -n williamli-scvl | grep -cE "^\[FAIL"
