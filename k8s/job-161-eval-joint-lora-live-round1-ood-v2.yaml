# Step 161: retry of job-159 (OOD eval of job-155's checkpoint), after
# job-159 was killed mid-run for two problems:
#
# 1. MVBench decode was failing on a growing fraction of items (2647+ skips
#    across 7+ categories by the time it was killed: EOFError, MemoryError,
#    "libgomp: Thread creation failed: Resource temporarily unavailable").
#    Pattern matches a known anti-pattern: when decord fails on a clip
#    (seen here as ffmpeg "mmco: unref short failure" / "no frame!" on
#    corrupted segments) qwen-vl-utils falls back to torchvision's own CPU
#    decoder, which spins up a FRESH OpenMP/thread-pool per call that is
#    never torn down -- over thousands of fallback calls in a single long
#    process this exhausts thread-creation headroom even though total RSS
#    stayed well under the pod's memory limit (13.7GB/28Gi when checked).
#    Fix: OMP_NUM_THREADS=1 / MKL_NUM_THREADS=1 caps how much each fallback
#    decode call can spin up, so leaked pools stay small; memory limit also
#    raised to this cluster's enforced 32Gi per-pod ceiling for headroom on
#    the large (720x1280) clips that were triggering "Unable to allocate
#    84.4 MiB" failures.
# 2. step_3000.pt got n_total=0 on TempCompass (every single item failed)
#    while best_forward.pt completed 3673/3673 on the identical split --
#    the actual per-item error is unknown because kubectl's container log
#    buffer rotated out everything before MVBench started, by the time this
#    was noticed. Fix: tee the full run to a file on the data PVC (same
#    pattern as job-155's training run), so nothing is lost to log rotation
#    even if this run is long.
#
# Fresh output filenames (_v2 suffix) rather than --resume-ing job-159's own
# out_path files -- the step_3000/TempCompass n_total=0 entry and MVBench's
# partial, failure-storm-contaminated entries are not something we want a
# --resume to silently treat as "already done."
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-eval-joint-lora-live-round1-ood-v2
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values:
                      - "16000"
      containers:
        - name: eval-joint-lora-live-round1-ood-v2
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              RUN=/data/raw_data/joint_lora_live_round1_runs
              CKPT_FINAL="round1_step3000=${RUN}/step_3000.pt"
              CKPT_BESTFWD="round1_best_forward=${RUN}/best_forward.pt"
              LOG=/data/raw_data/round1_lora_live_eval_v2_full_run.log

              cd "$REPO"

              {
              echo "=== TempCompass OOD ==="
              export VANS_WORK_ROOT=/data/vans_work_tempcompass
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --checkpoint "$CKPT_FINAL" --checkpoint "$CKPT_BESTFWD" \
                --lora_vlm --lora_vlm_r 8 --lora_vlm_alpha 16 \
                --qa_split /data/raw_data/qa_split_tempcompass.json \
                --split_part test \
                --resume \
                --out_path /data/raw_data/round1_lora_live_eval_v2_tempcompass.json

              echo "=== MVBench OOD ==="
              export VANS_WORK_ROOT=/data/vans_work_mvbench
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --checkpoint "$CKPT_FINAL" --checkpoint "$CKPT_BESTFWD" \
                --lora_vlm --lora_vlm_r 8 --lora_vlm_alpha 16 \
                --qa_split /data/raw_data/qa_split_mvbench.json \
                --split_part test \
                --resume \
                --out_path /data/raw_data/round1_lora_live_eval_v2_mvbench.json

              echo "=== CrossTask OOD (live decode) ==="
              export VANS_WORK_ROOT=/data/vans_work_crosstask
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --checkpoint "$CKPT_FINAL" --checkpoint "$CKPT_BESTFWD" \
                --lora_vlm --lora_vlm_r 8 --lora_vlm_alpha 16 \
                --qa_split /data/raw_data/qa_split_crosstask.json \
                --split_part test \
                --resume \
                --out_path /data/raw_data/round1_lora_live_eval_v2_crosstask.json

              echo "=== Ego4D GoalStep OOD (live decode) ==="
              export VANS_WORK_ROOT=/data/vans_work_ego4d_qa
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --checkpoint "$CKPT_FINAL" --checkpoint "$CKPT_BESTFWD" \
                --lora_vlm --lora_vlm_r 8 --lora_vlm_alpha 16 \
                --qa_split /data/raw_data/qa_split_ego4d.json \
                --split_part test \
                --resume \
                --out_path /data/raw_data/round1_lora_live_eval_v2_ego4d.json

              echo "=== YouCook2 easy-scheme OOD (live decode) ==="
              export VANS_WORK_ROOT=/data/vans_work_youcook
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --checkpoint "$CKPT_FINAL" --checkpoint "$CKPT_BESTFWD" \
                --lora_vlm --lora_vlm_r 8 --lora_vlm_alpha 16 \
                --qa_split /data/raw_data/qa_split_youcook2.json \
                --split_part test \
                --resume \
                --out_path /data/raw_data/round1_lora_live_eval_v2_youcook2.json

              echo "=== YouCook2 hard-scheme OOD (live decode, job-158's new split) ==="
              export VANS_WORK_ROOT=/data/vans_work_youcook
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --checkpoint "$CKPT_FINAL" --checkpoint "$CKPT_BESTFWD" \
                --lora_vlm --lora_vlm_r 8 --lora_vlm_alpha 16 \
                --qa_split /data/raw_data/qa_split_youcook2_temporal.json \
                --split_part test \
                --resume \
                --out_path /data/raw_data/round1_lora_live_eval_v2_youcook2_temporal.json
              echo "SCRIPT_DONE"
              } 2>&1 | tee "$LOG"
          env:
            - name: VANS_ROOT
              value: /data
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
            - name: OMP_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "4"
              memory: "28Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4.8"
              memory: "32Gi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-youcook
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-161-eval-joint-lora-live-round1-ood-v2.yaml -n williamli-scvl
