# Step 169: replaces job-165 (which had two silent bugs -- see job-f229283
# and job-168's own headers). Full-scale run of the stability-fixed recipe
# (grad_clip_norm + vlm_lr + warmup_cosine, validated at medium scale by
# job-163, and OOD-validated by job-164) on:
#   - forward: qa_split_merged_v2_hard.json (10150 train, hard-only --
#     qa_split_temporal.json's COIN/VANS rows + job-158's hard-scheme
#     YouCook2, rebuilt with the correct VANS_WORK_ROOT so has_features()
#     actually finds YouCook2's cached V-JEPA2 features -- job-165 silently
#     trained on only 6688/10150 of this because of that path mismatch).
#   - reverse: PLAIN qa_split_full.json (EgoDex-only, 8422 train) + plain
#     vlm_guidance_cache_paired -- the Ego4D-merged expansion job-165 tried
#     is PAUSED per user decision: Ego4D's AWS credentials are revoked/
#     expired (job-167: 403 Forbidden before any video download even
#     starts), so re-downloading the raw videos load_pair_live's live-decode
#     path needs requires a fresh Ego4D license request first. This EgoDex-
#     only + live_vlm + stability-fix combination already ran cleanly in
#     job-163 (job-168's smoke test re-confirms before this submission).
#
# n_steps_per_epoch = min(fwd_train, rev_train) = min(10150, 8422) = 8422
# (train_joint_coupled_normalized.py's own formula) -- --max_steps 8422
# --epochs 1 for a full natural epoch on this data (reverse is now the
# limiting side, not forward). --warmup_steps 800 (~9.5%, same proportion
# family as job-163's 125/1250 and job-165's 1000/10137).
#
# Runs on nvidia.com/a100 (not the generic nvidia.com/gpu) -- see job-163's
# own header for why (generic nvidia.com/gpu is allocatable=0 on every A100
# node this cluster has; the resource must be requested by its specific
# name). User's explicit request to run new work on A100.
#
# Pinned to region us-west: our PVCs (rook-ceph-block / rook-cephfs) live
# on the us-west Ceph cluster, and job-168 hung indefinitely at volume
# setup on every us-central A100 node it landed on. node-2-3 excluded for
# its own broken CSI driver.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-joint-fullscale-stabfix-forward-expanded
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - us-west
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - node-2-3.sdsc.optiputer.net
      containers:
        - name: joint-fullscale-stabfix-forward-expanded
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              cd "$REPO"

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/joint_fullscale_stabfix_fwd_expanded_runs
              "$PY" vans_qa/full_scale/train_joint_coupled_normalized.py \
                --qa_split /data/raw_data/qa_split_merged_v2_hard.json \
                --cache_dir /data/vans_work/vlm_guidance_cache_paired \
                --rev_qa_split /data/raw_data/qa_split_full.json \
                --bridge_hidden_dim 2048 \
                --lora_vlm --lora_vlm_r 8 --lora_vlm_alpha 16 \
                --lora_predictor --lora_predictor_r 8 --lora_predictor_alpha 16 \
                --live_vlm \
                --lr 1e-4 --vlm_lr 3e-5 \
                --lr_schedule warmup_cosine --warmup_steps 800 \
                --grad_clip_norm 1.0 \
                --epochs 1 \
                --max_steps 8422 \
                --val_every_steps 250 \
                --save_every_steps 250 \
                --max_val_items 100 \
                --max_test_items 100 \
                --out_dir /data/raw_data/joint_fullscale_stabfix_fwd_expanded_runs 2>&1 \
                | tee /data/raw_data/joint_fullscale_stabfix_fwd_expanded_runs/full_run.log
              echo "SCRIPT_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "4"
              memory: "28Gi"
              ephemeral-storage: "4Gi"
              nvidia.com/a100: "1"
            limits:
              cpu: "4.8"
              memory: "32Gi"
              ephemeral-storage: "6Gi"
              nvidia.com/a100: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-169-joint-fullscale-stabfix-forward-expanded.yaml -n williamli-scvl
