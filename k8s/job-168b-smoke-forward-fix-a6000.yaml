# Step 168b: identical copy of job-168 (forward work-root fix smoke test,
# 20 steps) on nvidia.com/rtxa6000 (48GB) instead of A100 -- job-168 sat
# Pending 4h48m because every us-west A100 was taken. The smoke test only
# checks data counts ("forward usable" ~10150, zero in_clip_relpath errors),
# so GPU type doesn't affect its result. Whichever of 168/168b starts first
# is kept; the other gets deleted. job-169 (full run) stays A100-only.
# Separate job name, out_dir and conda PVC (youcook, which job-161 already
# ran on) so the two copies can't collide. Same us-west region pin.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-smoke-forward-fix-a6000
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - us-west
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - node-2-3.sdsc.optiputer.net
      containers:
        - name: smoke-forward-fix-a6000
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              cd "$REPO"

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/smoke_forward_fix_a6000_runs
              "$PY" vans_qa/full_scale/train_joint_coupled_normalized.py \
                --qa_split /data/raw_data/qa_split_merged_v2_hard.json \
                --cache_dir /data/vans_work/vlm_guidance_cache_paired \
                --rev_qa_split /data/raw_data/qa_split_full.json \
                --bridge_hidden_dim 2048 \
                --lora_vlm --lora_vlm_r 8 --lora_vlm_alpha 16 \
                --lora_predictor --lora_predictor_r 8 --lora_predictor_alpha 16 \
                --live_vlm \
                --lr 1e-4 --vlm_lr 3e-5 \
                --lr_schedule warmup_cosine --warmup_steps 5 \
                --grad_clip_norm 1.0 \
                --epochs 1 \
                --max_steps 20 \
                --max_train_items 30 \
                --val_every_steps 10 \
                --save_every_steps 20 \
                --max_val_items 4 \
                --max_test_items 4 \
                --out_dir /data/raw_data/smoke_forward_fix_a6000_runs 2>&1 \
                | tee /data/raw_data/smoke_forward_fix_a6000_runs/full_run.log
              echo "SCRIPT_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "4"
              memory: "28Gi"
              ephemeral-storage: "4Gi"
              nvidia.com/rtxa6000: "1"
            limits:
              cpu: "4.8"
              memory: "32Gi"
              ephemeral-storage: "6Gi"
              nvidia.com/rtxa6000: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-youcook
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-168b-smoke-forward-fix-a6000.yaml -n williamli-scvl
