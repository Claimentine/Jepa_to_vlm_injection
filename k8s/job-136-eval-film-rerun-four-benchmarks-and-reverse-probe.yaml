# Step 136: the film-rerun (job-125) eval the user asked for -- 4 forward
# QA benchmarks (COIN-hard/TempCompass/MVBench/CrossTask, same set as
# job-124's ablation eval) on best_forward.pt, plus the EgoDex reverse-
# direction ADE/FDE probe (same template as job-76) on best_reverse.pt.
#
# CrossTask uses LIVE decode here, not --precompute_cache_dir -- job-130's
# round5 run showed that precompute cache is stale (built before the
# current transformers/Qwen3VL processor started requiring
# mm_token_type_ids whenever video_grid_thw is present): 1557/1558 items
# failed with the identical "mm_token_type_ids is missing" error, leaving
# an n=1, acc=0.0 result with no statistical meaning. train_qa_full.py's
# live build_inputs path already handles this field correctly (see its
# own candidate_logprob comment), so just not passing --precompute_cache_dir
# avoids the broken cache entirely.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-eval-film-rerun-four-benchmarks-and-reverse-probe
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values:
                      - "16000"
      containers:
        - name: eval-film-rerun
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              REPO=/code/Jepa_to_vlm_injection
              RUN=/data/raw_data/ablation_film_rerun_runs
              cd "$REPO"

              echo "=== forward QA: COIN-hard (temporal) ==="
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              CKPT="film_rerun=${RUN}/best_forward.pt"
              export VANS_WORK_ROOT=/data/vans_work
              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_temporal.json \
                --split_part test \
                --checkpoint "$CKPT" \
                --resume \
                --out_path /data/raw_data/film_rerun_eval_coin_hard.json

              echo "=== forward QA: TempCompass OOD ==="
              export VANS_WORK_ROOT=/data/vans_work_tempcompass
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_tempcompass.json \
                --split_part test \
                --checkpoint "$CKPT" \
                --resume \
                --out_path /data/raw_data/film_rerun_eval_tempcompass.json

              echo "=== forward QA: MVBench OOD ==="
              export VANS_WORK_ROOT=/data/vans_work_mvbench
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_mvbench.json \
                --split_part test \
                --checkpoint "$CKPT" \
                --resume \
                --out_path /data/raw_data/film_rerun_eval_mvbench.json

              echo "=== forward QA: CrossTask OOD (live decode, no stale precompute cache) ==="
              export VANS_WORK_ROOT=/data/vans_work_crosstask
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_crosstask.json \
                --split_part test \
                --checkpoint "$CKPT" \
                --resume \
                --out_path /data/raw_data/film_rerun_eval_crosstask.json

              echo "=== reverse ADE/FDE probe (EgoDex, --joint_subset all) ==="
              PY=/home/jovyan/conda-envs/thinkjepa/bin/python
              mkdir -p /data/raw_data/egodex_reverse_probe_film_rerun_full
              "$PY" vans_qa/full_scale/probe_egodex_reverse_adapter.py \
                --checkpoints "film_rerun=${RUN}/best_reverse.pt" \
                --joint_subset all \
                --batch_size 4 \
                --probe_epochs 10 \
                --num_workers 4 \
                --out_json /data/raw_data/egodex_reverse_probe_film_rerun_full/results.json \
                2>&1 | tee /data/raw_data/egodex_reverse_probe_film_rerun_full/full_run.log

              echo "SCRIPT_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests: {cpu: "4", memory: "24Gi", ephemeral-storage: "2Gi", nvidia.com/gpu: "1"}
            limits: {cpu: "4.8", memory: "28Gi", ephemeral-storage: "4Gi", nvidia.com/gpu: "1"}
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-ddp
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-136-eval-film-rerun-four-benchmarks-and-reverse-probe.yaml -n williamli-scvl
