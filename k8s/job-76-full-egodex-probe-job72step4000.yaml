# Step 76: full EgoDex reverse-probe (--joint_subset all, the fair
# comparison against job-61) on job-72's step_4000 -- the current best
# overall joint checkpoint (beats job-42 on all 4 forward benchmarks, first
# to beat the independent baseline on MVBench/CrossTask). Tests whether this
# checkpoint's reverse predictor ALSO carries at least as much trajectory
# signal as job-15/42/60 did, i.e. whether the "train 2 epochs, stop at the
# sweet spot" recipe that won on the forward side also preserves (or
# improves) the reverse direction's own EgoDex trajectory signal.
#
# Kind: Job, not a bare Pod, so the run is not subject to the ~6h pod limit.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-full-egodex-probe-job72step4000
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-01.laccd.edu
                      - nautilus-ext-gpu01.fullerton.edu
                      - dtn-gpu2.kreonet.net
                      - hcc-chase-shor-c4705.unl.edu
      containers:
        - name: probe-job72step4000
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/thinkjepa/bin/python
              REPO=/code/Jepa_to_vlm_injection
              cd "$REPO"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/egodex_reverse_probe_job72step4000_full
              "$PY" vans_qa/full_scale/probe_egodex_reverse_adapter.py \
                --checkpoints job72_step4000 \
                --joint_subset all \
                --batch_size 4 \
                --probe_epochs 10 \
                --num_workers 4 \
                --out_json /data/raw_data/egodex_reverse_probe_job72step4000_full/results.json \
                2>&1 | tee /data/raw_data/egodex_reverse_probe_job72step4000_full/full_run.log
              echo "SCRIPT_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests: {cpu: "4", memory: "20Gi", ephemeral-storage: "2Gi", nvidia.com/gpu: "1"}
            limits: {cpu: "4.8", memory: "24Gi", ephemeral-storage: "4Gi", nvidia.com/gpu: "1"}
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-76-full-egodex-probe-job72step4000.yaml -n williamli-scvl
