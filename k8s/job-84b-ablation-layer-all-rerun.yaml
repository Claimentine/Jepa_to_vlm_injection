# Step 84b: rerun of job-84 (C1 layer-selection ablation, --layer_strategy
# all) -- identical recipe, but with the GPU memory floor raised from
# >16000 MiB to >38000 MiB.
#
# Why: job-84's reverse branch was genuinely OOM-contaminated
# (rev_items_skipped=3319/3344, confirmed via its own full_run.log --
# "[WARN] rev skip ...: OutOfMemoryError: CUDA out of memory" repeated
# throughout) despite already requiring >16000 MiB -- it still landed on a
# ~22GB-class card (nvidia-smi logged "22.06 GiB total capacity" in the OOM
# traceback, consistent with an A10/RTX3090/4090). --layer_strategy all
# injects cross-attn hooks into EVERY decoder layer instead of 4
# (middle4/last4/uniform4), and the resulting much larger forward-branch
# activation footprint is what starves the reverse predictor's own VRAM in
# the SAME training step (forward and reverse share one optimizer step in
# train_joint_coupled_normalized.py's single combined loop -- see that
# script's own docstring; no checkpoint-resume exists, so a partial
# "just redo reverse" run isn't possible, this has to retrain from scratch).
# Forward branch itself trained cleanly (fwd_items_skipped=25/3344) --
# job-115's existing eval of job-84's best_forward.pt stays valid and is
# NOT being rerun.
#
# New --out_dir (ablation_layer_all_v2_runs, not job-84's original
# ablation_layer_all_runs) so this doesn't overwrite the checkpoint
# job-115 is still reading from mid-eval.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-ablation-layer-all-rerun
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-01.laccd.edu
                      - nautilus-ext-gpu01.fullerton.edu
                      - hcc-nrp-shor-c5809.unl.edu
                      - dtn-gpu2.kreonet.net
                      - hcc-chase-shor-c4705.unl.edu
                  # Raised from >16000 (job-84's own floor, which still let
                  # it land on a ~22GB card and OOM on the reverse branch)
                  # to >38000 -- excludes 24GB-class cards entirely, leaves
                  # A100-40GB/80GB, L40, L40S, A6000, H100, etc.
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values:
                      - "38000"
      containers:
        - name: ablation-layer-all-rerun
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              "$PY" -m pip install --quiet h5py
              export PATH="$(dirname "$PY"):$PATH"

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/ablation_layer_all_v2_runs
              torchrun --standalone --nproc_per_node=2 \
                vans_qa/full_scale/train_joint_coupled_normalized.py \
                --qa_split /data/raw_data/qa_split_temporal.json \
                --disable_norm \
                --cycle_loss_weight 0 \
                --bridge_hidden_dim 2048 \
                --layer_strategy all \
                --epochs 1 \
                --val_every_steps 500 \
                --save_every_steps 1000 \
                --max_val_items 100 \
                --out_dir /data/raw_data/ablation_layer_all_v2_runs 2>&1 \
                | tee /data/raw_data/ablation_layer_all_v2_runs/full_run.log
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
            - name: PYTORCH_ALLOC_CONF
              value: expandable_segments:True
          resources:
            requests:
              cpu: "10"
              memory: "27Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "2"
            limits:
              cpu: "12"
              memory: "31500Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "2"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm2
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-84b-ablation-layer-all-rerun.yaml -n williamli-scvl
