# Step 174: check Ego4D download access after the license re-approval.
# Ego4D access moved to the Lab22 platform: the `lab22` CLI (pip install
# lab22) authenticates with LAB22_API_KEY (from the lab22-api-key Secret,
# never written into this repo) instead of AWS keys, and `lab22 ego4d`
# takes the old ego4d CLI's options with the same output layout. Lists what
# the key is entitled to, then pulls one full_scale video capped at 3 min:
# a working key starts writing the mp4 within seconds.
# lab22 exit codes: 0 done, 1 usage, 2 key problem, 3 not entitled,
# 4 incomplete/unreachable (124 here = still downloading at the cap = works).
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-debug-ego4d-credentials-recheck
spec:
  backoffLimit: 0
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - us-west
      containers:
        - name: debug-ego4d-credentials-recheck
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -uo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              "$PY" -m pip install --quiet lab22
              echo "=== lab22 datasets ==="
              "$PY" -m lab22 datasets 2>&1 | tail -20; echo "exit=${PIPESTATUS[0]}"
              echo "=== lab22 describe ego4d ==="
              "$PY" -m lab22 describe ego4d 2>&1 | head -40
              echo "=== one full_scale video (3 min cap) ==="
              mkdir -p /tmp/ego4d_test
              timeout 180 "$PY" -m lab22 ego4d -o /tmp/ego4d_test \
                --datasets full_scale --video_uids 03e90bbc-7d6b-423c-84d9-b5be3eff11c5 \
                --no-metadata -y 2>&1 | tail -15
              echo "=== exit code: ${PIPESTATUS[0]} ==="
              find /tmp/ego4d_test -type f -not -path "*/.lab22/*" -exec ls -la {} \; 2>&1 | head
              echo "SCRIPT_DONE"
          env:
            - name: LAB22_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lab22-api-key
                  key: LAB22_API_KEY
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
              ephemeral-storage: "8Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
              ephemeral-storage: "10Gi"
          volumeMounts:
            - name: conda-storage
              mountPath: /home/jovyan
      volumes:
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm2
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-174-debug-ego4d-credentials-recheck.yaml -n williamli-scvl
