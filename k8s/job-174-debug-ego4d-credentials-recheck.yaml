# Step 174: recheck whether the ego4d-aws-credentials Secret works, after the
# user's Ego4D license (re)approval. job-167 got 403 on the manifest
# HeadObject with the 2026-09-29 keys (Ego4D AWS keys expire after 14 days).
# Same one-video full_scale download as job-167, capped at 3 min: valid keys
# start writing the mp4 within seconds, expired keys 403 immediately -- no
# need to pull the whole multi-GB file just to answer yes/no.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-debug-ego4d-credentials-recheck
spec:
  backoffLimit: 0
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - us-west
      containers:
        - name: debug-ego4d-credentials-recheck
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -uo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              "$PY" -m pip install --quiet ego4d
              mkdir -p /tmp/ego4d_test
              echo "=== credentials present? ==="
              [ -n "${AWS_ACCESS_KEY_ID:-}" ] && echo "AWS_ACCESS_KEY_ID set (len=${#AWS_ACCESS_KEY_ID}, AWS keys are 20)" || echo "MISSING"
              # The ego4d CLI reads ~/.aws/credentials, not env vars -- and ~ is
              # the conda PVC, which still holds job-109's expired keys. Write
              # the Secret's keys there first (same as write_aws_credentials()).
              mkdir -p ~/.aws
              printf '[default]\naws_access_key_id = %s\naws_secret_access_key = %s\n' "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > ~/.aws/credentials
              printf '[default]\nregion = %s\n' "${AWS_DEFAULT_REGION:-us-west-1}" > ~/.aws/config
              chmod 600 ~/.aws/credentials
              echo "=== attempting one video download (3 min cap) ==="
              timeout 180 "$PY" -m ego4d.cli.cli \
                -o /tmp/ego4d_test \
                --datasets full_scale \
                --video_uids 03e90bbc-7d6b-423c-84d9-b5be3eff11c5 \
                --no-metadata -y 2>&1 | tail -15
              echo "=== exit code: ${PIPESTATUS[0]} (124 = still downloading at the cap = keys work) ==="
              find /tmp/ego4d_test -type f -exec ls -la {} \; 2>&1 | head
              echo "SCRIPT_DONE"
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ego4d-aws-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ego4d-aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: ego4d-aws-credentials
                  key: AWS_DEFAULT_REGION
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
              ephemeral-storage: "8Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
              ephemeral-storage: "10Gi"
          volumeMounts:
            - name: conda-storage
              mountPath: /home/jovyan
      volumes:
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm2
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-174-debug-ego4d-credentials-recheck.yaml -n williamli-scvl
