# Step 182: diagnostic twin of job-181 -- identical (resume job-72's
# step_4000.pt, add VLM + predictor LoRA, VLM LoRA lr 5e-6, job-72's recipe)
# except WITHOUT --live_vlm. job-181's forward val swings between baseline
# and chance (step 4500: 0.47, 5000: 0.69, 5500: 0.46; baseline job-180:
# 0.739). Suspected cause: with --live_vlm the reverse loss backpropagates
# into the shared VLM LoRA, and with --disable_norm it is ~10x the forward
# loss (rev ~7.5 vs fwd ~0.7) -- job-72 never had that, its VLM was frozen
# and its reverse guidance cached. Here the reverse direction reads the
# cached guidance, so the VLM LoRA is trained by the forward loss alone.
# Stable and above 0.739 -> the reverse gradient through the shared VLM is
# the problem; still swinging -> it's the LoRA itself.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-stage2-lora-cached-guidance
spec:
  backoffLimit: 0
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - us-west
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A100-SXM4-80GB
                      - NVIDIA-A100-80GB-PCIe
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - node-2-3.sdsc.optiputer.net
      containers:
        - name: stage2-lora-cached-guidance
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              RUNS=/data/raw_data/stage2_lora_cached_guidance_runs
              cd "$REPO"
              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p "$RUNS"
              "$PY" vans_qa/full_scale/train_joint_coupled_normalized.py \
                --qa_split /data/raw_data/qa_split_temporal.json \
                --cache_dir /data/vans_work/vlm_guidance_cache_paired \
                --rev_qa_split /data/raw_data/qa_split_full.json \
                --resume_from /data/raw_data/joint_coupled_bridge_mlp_2epoch_runs/step_4000.pt \
                --disable_norm \
                --cycle_loss_weight 0 \
                --bridge_hidden_dim 2048 \
                --lora_vlm --lora_vlm_r 8 --lora_vlm_alpha 16 \
                --lora_predictor --lora_predictor_r 8 --lora_predictor_alpha 16 \
                --lr 1e-4 --vlm_lr 5e-6 \
                --grad_clip_norm 1.0 \
                --grad_accum_steps 2 \
                --epochs 2 \
                --max_steps 7000 \
                --val_every_steps 500 \
                --save_every_steps 500 \
                --max_val_items 500 \
                --max_test_items 500 \
                --out_dir "$RUNS" 2>&1 \
                | tee -a "$RUNS/full_run.log"
              echo "SCRIPT_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "4"
              memory: "28Gi"
              ephemeral-storage: "4Gi"
              nvidia.com/a100: "1"
            limits:
              cpu: "4.8"
              memory: "32Gi"
              ephemeral-storage: "6Gi"
              nvidia.com/a100: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-ddp
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-182-stage2-lora-cached-guidance.yaml -n williamli-scvl
