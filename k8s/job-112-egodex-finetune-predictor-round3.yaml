# Step 112: continues job-110 round2's fine-tune for 15 more epochs (23
# total so far -> 38), but with two changes to finetune_egodex_predictor.py
# per explicit user request after round2's per-epoch FD/SL1/CD improvement
# visibly decelerated (round1: ~0.71 FD/epoch, round2 start: ~0.16/epoch,
# round2 end: ~0.065/epoch -- a classic diminishing-returns curve, not a
# hard plateau: train_loss was still falling near-linearly and test
# metrics tracked it with no overfitting inflection, so more training
# should still help, just with smaller absolute gains):
#
# 1. --lr_min 1e-6: rounds 1-2 used a CONSTANT lr=1e-5 the whole time (no
#    scheduler existed). A fixed step size can overshoot near a local
#    optimum, which is consistent with round2's own decelerating curve --
#    this adds a CosineAnnealingLR decay from --lr down to --lr_min over
#    --epochs.
# 2. --sl1_weight / --cd_weight: rounds 1-2's loss was pure
#    F.mse_loss(pred,target), matching ThinkJEPA's own pred_loss formula
#    exactly (the point of that design was a clean apples-to-apples
#    comparison to their reference). This run deliberately departs from
#    that to chase a bigger FD/SL1/CD drop directly: MSE's gradient
#    geometry isn't identical to smooth-L1's or to cosine distance's, so
#    optimizing MSE alone leaves some SL1/CD improvement on the table.
#    Both weights kept small (0.5 / 0.1) so MSE (and therefore FD, and
#    the ThinkJEPA-comparable training signal) stays the dominant term,
#    not replaced by it.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-egodex-finetune-predictor-round3
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-01.laccd.edu
                      - nautilus-ext-gpu01.fullerton.edu
                      - dtn-gpu2.kreonet.net
                      - hcc-chase-shor-c4705.unl.edu
                      - k8s-chase-ci-01.calit2.optiputer.net
                      - hcc-nrp-shor-c5813.unl.edu
                      - k8s-gpu-01.calit2.optiputer.net
                      - k8s-chase-ci-03.calit2.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
      containers:
        - name: egodex-finetune-predictor-round3
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/thinkjepa/bin/python
              REPO=/code/Jepa_to_vlm_injection
              cd "$REPO"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/egodex_finetuned_job72_step4000_round3

              echo "[INFO] pre-warming EgoDex manifest files (parallel, targeted)..."
              MANIFEST_DIR=/data/raw_data/thinkjepa_egodex_iso/manifests/portable_v1
              CACHE_DIR=/data/raw_data/thinkjepa_egodex_iso/cache
              time (cat "$MANIFEST_DIR/train_cache.txt" "$MANIFEST_DIR/test_cache.txt" \
                    | sed "s#^#$CACHE_DIR/#" \
                    | xargs -P 32 -I{} sh -c 'cat "{}" > /dev/null' 2>/dev/null) || true
              echo "[INFO] pre-warm (data) done"

              echo "[INFO] pre-warming thinkjepa conda env (parallel)..."
              time find /home/jovyan/conda-envs/thinkjepa -type f -print0 \
                | xargs -0 -P 32 -I{} sh -c 'cat {} > /dev/null' 2>/dev/null || true
              echo "[INFO] pre-warm (conda env) done"

              "$PY" vans_qa/full_scale/finetune_egodex_predictor.py \
                --checkpoint "job110_round2=/data/raw_data/egodex_finetuned_job72_step4000_round2/predictor.pt" \
                --epochs 15 \
                --lr 1e-5 \
                --lr_min 1e-6 \
                --sl1_weight 0.5 \
                --cd_weight 0.1 \
                --batch_size 1 \
                --grad_accum_steps 16 \
                --num_workers 4 \
                --save_path /data/raw_data/egodex_finetuned_job72_step4000_round3/predictor.pt \
                --out_json /data/raw_data/egodex_finetuned_job72_step4000_round3/history.json \
                2>&1 | tee /data/raw_data/egodex_finetuned_job72_step4000_round3/full_run.log
              echo "SCRIPT_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests: {cpu: "4", memory: "20Gi", ephemeral-storage: "2Gi", nvidia.com/gpu: "1"}
            limits: {cpu: "4", memory: "20Gi", ephemeral-storage: "4Gi", nvidia.com/gpu: "1"}
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm2
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-112-egodex-finetune-predictor-round3.yaml -n williamli-scvl
