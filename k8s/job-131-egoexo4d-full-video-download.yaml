              UIDEOF

              echo "=== downloading $(wc -l < "$UIDS_FILE") takes' ego (Aria) video ==="
              egoexo -o "$OUT" --parts takes --views ego --uids $(cat "$UIDS_FILE") -y --num_workers 8 2>&1 | tee "$OUT/full_video_dl.log"

              echo
              echo "=== cleanup: keep only each take's exact rgb stream mp4 ==="
              "$PY" - "$UIDS_FILE" <<'PYEOF'
              import json, os, sys
              uids = [l.strip() for l in open(sys.argv[1]) if l.strip()]
              takes = json.load(open("/data/raw_data/egoexo4d_discovery/takes.json"))
              by_uid = {t["take_uid"]: t for t in takes}
              root = "/data/raw_data/egoexo4d_discovery"
              kept = 0
              removed = 0
              removed_bytes = 0
              for u in uids:
                  t = by_uid.get(u)
                  if t is None:
                      continue
                  aria_cams = [k for k in t["frame_aligned_videos"] if k.lower().startswith("aria")]
                  if not aria_cams:
                      continue
                  rgb = t["frame_aligned_videos"][aria_cams[0]].get("rgb")
                  if rgb is None:
                      continue
                  keep_path = os.path.join(root, t["root_dir"], rgb["relative_path"])
                  take_dir = os.path.join(root, t["root_dir"])
                  if not os.path.isdir(take_dir):
                      continue
                  for dirpath, _, filenames in os.walk(take_dir):
                      for fn in filenames:
                          fp = os.path.join(dirpath, fn)
                          if os.path.realpath(fp) == os.path.realpath(keep_path):
                              kept += 1
                              continue
                          if fn.lower().endswith((".mp4", ".vrs")):
                              try:
                                  removed_bytes += os.path.getsize(fp)
                                  os.remove(fp)
                                  removed += 1
                              except OSError:
                                  pass
              print(f"kept={kept} removed={removed} removed_bytes={removed_bytes/1e9:.2f}GB")
              PYEOF

              echo
              echo "=== final size ==="
              du -sh "$OUT/takes" 2>/dev/null
              find "$OUT/takes" -iname "*.mp4" | wc -l

              echo "EGOEXO4D_FULL_VIDEO_DOWNLOAD_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: egoexo4d-aws-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: egoexo4d-aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: egoexo4d-aws-credentials
                  key: AWS_DEFAULT_REGION
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
              ephemeral-storage: "8Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
              ephemeral-storage: "12Gi"
          volumeMounts:
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      volumes:
        - name: conda-storage
          persistentVolumeClaim:
            # baselines2 is held by the pending job-130 round5-eval as of
            # this submission -- confirmed free via a live PVC sweep,
            # ddp2 freed up once round5 itself went terminal.
            claimName: ruixin-conda-vol-ddp2
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

