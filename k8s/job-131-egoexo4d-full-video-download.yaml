# Step 131: full-scale EgoExo4D Aria video download -- all 351 takes with
# hand-pose ground truth (286 train + 65 val, per job-127's annotation
# discovery), scaling up job-128's 5-take pilot after job-129 validated the
# whole pipeline end-to-end (52/52 joint matches, exact frame-count
# agreement between the supervision builder and rebuild_causal_cache.py).
#
# --views ego still pulls more than just the one RGB stream we need per
# take (job-128 found slam-left/right, et, collage, best_exo, and even a
# non-aria GoPro file bundled in for some takes -- e.g. one pilot take had
# a 1.1GB gp05.mp4 despite --views ego). There's no CLI flag for a single
# stream, and a direct S3 HeadObject with these same credentials 403'd
# (ListObjects works via the official `egoexo` tool's own auth path but
# arbitrary GetObject doesn't -- not pursued further, not worth the time
# against the official downloader just working). So: download everything
# --views ego gives us, then immediately delete every file that isn't the
# exact frame_aligned_videos/<ariaNN>_<rgb-stream-id>.mp4 our build script
# actually reads (per-take rgb relative_path from takes.json) -- keeps the
# shared PVC from absorbing 2-3x unnecessary bytes across 351 takes.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-egoexo4d-full-video-download
spec:
  backoffLimit: 1
  template:
    spec:
      containers:
        - name: egoexo4d-full-video-download
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -uo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              export PATH="$(dirname "$PY"):$PATH"

              "$PY" -m pip install --quiet -U "ego4d>=1.7.1"

              mkdir -p ~/.aws
              cat > ~/.aws/credentials <<CREDS
              [default]
              aws_access_key_id = ${AWS_ACCESS_KEY_ID}
              aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}
              CREDS
              cat > ~/.aws/config <<CFG
              [default]
              region = ${AWS_DEFAULT_REGION}
              CFG

              OUT=/data/raw_data/egoexo4d_discovery
              mkdir -p "$OUT"

              UIDS_FILE=/tmp/all_uids.txt
              cat > "$UIDS_FILE" <<'UIDEOF'
