# Step 177: frozen-VLM recipe, EASY+HARD train (each hard row plus an
# easy twin with an other-video distractor).
#
# Replicates job-72's frozen-VLM recipe -- the only forward setup that ever
# learned (val easy 0.94 / hard 0.78 at step 3500, trained on hard-only
# qa_split_temporal.json) -- after the LoRA-VLM + live-VLM pipeline stayed at
# chance (job-169b, job-172/173). Same as job-72: frozen VLM (no --lora_vlm),
# cached reverse guidance (no --live_vlm), --disable_norm,
# --cycle_loss_weight 0, --bridge_hidden_dim 2048, constant lr 1e-4, 2 epochs,
# and no grad clipping (job-72 predates it, so --grad_clip_norm 0). job-72 ran
# 2-GPU DDP (2 pairs per update); --grad_accum_steps 2 on one GPU gives the
# same 2 pairs per update and the same 6690 updates.
# job-176/177/178 differ ONLY in --qa_split's train side (hard / easy+hard /
# easy; build_easy_train_split.py); val/test are identical, scored on 500 val
# items (job-72 used 100) every 500 updates. --max_steps 6690 gives every run
# the same 13,380 forward samples (the mixed split's 13,380 rows = one pass).
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-frozen-recipe-mixed
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - us-west
      containers:
        - name: frozen-recipe-mixed
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              "$PY" -m pip install --quiet h5py
              export PATH="$(dirname "$PY"):$PATH"

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/frozen_recipe_mixed_runs
              "$PY" vans_qa/full_scale/train_joint_coupled_normalized.py \
                --qa_split /data/raw_data/qa_split_temporal_mixed.json \
                --disable_norm \
                --cycle_loss_weight 0 \
                --bridge_hidden_dim 2048 \
                --grad_clip_norm 0 \
                --grad_accum_steps 2 \
                --epochs 2 \
                --max_steps 6690 \
                --val_every_steps 500 \
                --save_every_steps 1000 \
                --max_val_items 500 \
                --out_dir /data/raw_data/frozen_recipe_mixed_runs 2>&1 \
                | tee /data/raw_data/frozen_recipe_mixed_runs/full_run.log
              echo "SCRIPT_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
            - name: PYTORCH_ALLOC_CONF
              value: expandable_segments:True
          resources:
            requests:
              cpu: "6"
              memory: "28Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/rtxa6000: "1"
            limits:
              cpu: "7"
              memory: "32Gi"
              ephemeral-storage: "2400Mi"
              nvidia.com/rtxa6000: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-ddp
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-177-frozen-recipe-mixed.yaml -n williamli-scvl
