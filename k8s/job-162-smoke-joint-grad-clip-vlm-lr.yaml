# Step 162: smoke test for train_joint_coupled_normalized.py's three new
# stability fixes, added after job-160's fwd_val_acc oscillated near-chance
# with no convergence trend across 3000+ steps (0.51/0.39/0.31/0.46/.../0.43
# at steps 250-3000, far wider than n=100's sampling noise alone):
#   1. --grad_clip_norm (default 1.0, previously no clipping existed at all)
#   2. --vlm_lr (separate, lower LR for the shared VLM's own LoRA params,
#      as its own AdamW param group -- previously ALL trainable params
#      shared one --lr)
#   3. --lr_schedule warmup_cosine (already existed as a flag but was never
#      used by job-155/job-160, which both ran --lr_schedule constant)
#
# Tiny budget (20 steps) -- only needs to prove: (a) nothing crashes with
# the new param-group optimizer construction, (b) train_log.jsonl actually
# shows two distinct lr/vlm_lr values and a logged grad_norm per step, (c)
# warmup_cosine's LambdaLR correctly scales BOTH param groups' base lr
# (confirmed by code read: one lr_lambda multiplies every group identically).
# Not a real training result -- 20 steps can't show whether oscillation
# actually improves, only whether the mechanism itself works.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-smoke-joint-grad-clip-vlm-lr
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values:
                      - "40000"
      containers:
        - name: smoke-joint-grad-clip-vlm-lr
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              cd "$REPO"

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/smoke_joint_grad_clip_vlm_lr_runs
              "$PY" vans_qa/full_scale/train_joint_coupled_normalized.py \
                --qa_split /data/raw_data/qa_split_temporal.json \
                --cache_dir /data/vans_work/vlm_guidance_cache_paired \
                --rev_qa_split /data/raw_data/qa_split_full.json \
                --bridge_hidden_dim 2048 \
                --lora_vlm --lora_vlm_r 8 --lora_vlm_alpha 16 \
                --lora_predictor --lora_predictor_r 8 --lora_predictor_alpha 16 \
                --live_vlm \
                --lr 1e-4 --vlm_lr 3e-5 \
                --lr_schedule warmup_cosine --warmup_steps 5 \
                --grad_clip_norm 1.0 \
                --epochs 1 \
                --max_steps 20 \
                --max_train_items 24 \
                --val_every_steps 10 \
                --save_every_steps 20 \
                --max_val_items 4 \
                --max_test_items 4 \
                --out_dir /data/raw_data/smoke_joint_grad_clip_vlm_lr_runs 2>&1 \
                | tee /data/raw_data/smoke_joint_grad_clip_vlm_lr_runs/full_run.log
              echo "SCRIPT_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "4"
              memory: "28Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4.8"
              memory: "32Gi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-162-smoke-joint-grad-clip-vlm-lr.yaml -n williamli-scvl
