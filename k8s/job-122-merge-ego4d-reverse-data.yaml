# Step 122: merges job-109's Ego4D reverse-guided pairs into the reverse
# training pool, alongside the existing EgoDex-sourced pairs every joint
# run (job-22 through round5) has used so far.
#
# Confirmed compatible with ZERO cache-format changes: extract_ego4d_
# reverse_guided.py's own output schema is {pid, vlm_old, vlm_new,
# vjepa_input_feats, vjepa_target_feats} -- bit-for-bit the same keys
# train_latent_world_model_full.py's load_pair() expects (see that
# script's own header comment referencing extract_vlm_guidance_paired.py's
# format). Three steps:
#   1. build_ego4d_reverse_split_stub.py: lists every pid job-109 cached,
#      all under "train" (explicit decision 2026-10-27 -- no separate
#      Ego4D val/test carve-out; EgoDex's own test split + the dedicated
#      EgoDex probe jobs already cover reverse-direction evaluation).
#   2. merge_qa_splits.py: combines that stub with the existing
#      qa_split_full.json (EgoDex's own train/val/test membership,
#      untouched) into qa_split_full_merged_ego4d.json, for
#      --rev_qa_split to point at.
#   3. symlink-merge the two cache directories (EgoDex's
#      vlm_guidance_cache_paired, 11777 files, and job-109's
#      cache_narration) into one new dir -- load_pair()/list_cached_pids()
#      both take a single --cache_dir, so this is simplest as a flat
#      directory of symlinks (same ln -sfn pattern this project already
#      uses for merging clip/vjepa-cache directories elsewhere) rather
#      than a code change to accept multiple cache dirs.
#
# HOLD: do not submit until job-109 (ruixin-ego4d-reverse-guided-extract)
# has fully completed -- this job globs whatever .npz files exist in
# job-109's cache_narration dir at the moment it runs, so running it early
# would silently miss every pair job-109 hadn't saved yet.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-merge-ego4d-reverse-data
spec:
  backoffLimit: 1
  template:
    spec:
      containers:
        - name: merge-ego4d-reverse-data
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command: ["bash"]
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              cd "$REPO"

              EGO4D_CACHE=/data/vans_work_ego4d_reverse_guided/cache_narration
              EGODEX_CACHE=/data/vans_work/vlm_guidance_cache_paired
              MERGED_CACHE=/data/vans_work/vlm_guidance_cache_paired_merged_ego4d

              echo "=== 1. build Ego4D reverse pid stub (all-train) ==="
              "$PY" vans_qa/full_scale/build_ego4d_reverse_split_stub.py \
                --cache_dir "$EGO4D_CACHE" \
                --out /data/raw_data/qa_split_ego4d_reverse_stub.json

              echo "=== 2. merge with existing EgoDex reverse split membership ==="
              "$PY" vans_qa/full_scale/merge_qa_splits.py \
                --inputs /data/raw_data/qa_split_full.json /data/raw_data/qa_split_ego4d_reverse_stub.json \
                --out /data/raw_data/qa_split_full_merged_ego4d.json

              echo "=== 3. symlink-merge the two cache directories ==="
              mkdir -p "$MERGED_CACHE"
              n_egodex=0
              for f in "$EGODEX_CACHE"/*.npz; do
                ln -sfn "$f" "$MERGED_CACHE/$(basename "$f")"
                n_egodex=$((n_egodex + 1))
              done
              n_ego4d=0
              for f in "$EGO4D_CACHE"/*.npz; do
                ln -sfn "$f" "$MERGED_CACHE/$(basename "$f")"
                n_ego4d=$((n_ego4d + 1))
              done
              echo "[INFO] symlinked egodex=$n_egodex ego4d=$n_ego4d -> $MERGED_CACHE"
              echo "[INFO] total files in merged cache: $(ls "$MERGED_CACHE" | wc -l)"
              echo "MERGE_EGO4D_REVERSE_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests: {cpu: "2", memory: "4Gi", ephemeral-storage: "2Gi"}
            limits: {cpu: "2", memory: "4Gi", ephemeral-storage: "2400Mi"}
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-baselines2
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with (NOT YET -- hold until job-109 completes):
#   kubectl apply -f job-122-merge-ego4d-reverse-data.yaml -n williamli-scvl
