# Step 130: 6-benchmark forward QA eval of round5's completed checkpoint
# (job-107, VANS/COIN+YouCook2 merged training, 2 epochs, best_forward.pt).
# Same eval_forward_checkpoint.py template as job-124's 4-benchmark ablation
# eval, plus round5's own two in-domain training sets (COIN full,
# qa_split_full.json; YouCook2, qa_split_youcook2.json) for the complete
# 6-benchmark picture, per explicit user request.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-eval-round5-six-benchmarks
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values:
                      - "16000"
      containers:
        - name: eval-round5-six-benchmarks
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              RUN=/data/raw_data/joint_coupled_merged_v1_runs_round5
              CKPT="round5=${RUN}/best_forward.pt"

              cd "$REPO"

              echo "=== COIN full-test ==="
              export VANS_WORK_ROOT=/data/vans_work
              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_full.json \
                --split_part test \
                --checkpoint "$CKPT" \
                --resume \
                --out_path /data/raw_data/round5_eval_coin.json

              echo "=== COIN-hard (temporal) ==="
              export VANS_WORK_ROOT=/data/vans_work
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_temporal.json \
                --split_part test \
                --checkpoint "$CKPT" \
                --resume \
                --out_path /data/raw_data/round5_eval_coin_hard.json

              echo "=== YouCook2 ==="
              export VANS_WORK_ROOT=/data/vans_work_youcook
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_youcook2.json \
                --split_part test \
                --checkpoint "$CKPT" \
                --resume \
                --out_path /data/raw_data/round5_eval_youcook2.json

              echo "=== TempCompass OOD ==="
              export VANS_WORK_ROOT=/data/vans_work_tempcompass
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_tempcompass.json \
                --split_part test \
                --checkpoint "$CKPT" \
                --resume \
                --out_path /data/raw_data/round5_eval_tempcompass.json

              echo "=== MVBench OOD ==="
              export VANS_WORK_ROOT=/data/vans_work_mvbench
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_mvbench.json \
                --split_part test \
                --checkpoint "$CKPT" \
                --resume \
                --out_path /data/raw_data/round5_eval_mvbench.json

              echo "=== CrossTask OOD ==="
              export VANS_WORK_ROOT=/data/vans_work_crosstask
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_crosstask.json \
                --split_part test \
                --precompute_cache_dir /data/vans_work_crosstask/eval_input_cache_crosstask \
                --checkpoint "$CKPT" \
                --resume \
                --out_path /data/raw_data/round5_eval_crosstask.json
          env:
            - name: VANS_ROOT
              value: /data
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "4"
              memory: "24Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4.8"
              memory: "30Gi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-baselines2
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-130-eval-round5-six-benchmarks.yaml -n williamli-scvl
