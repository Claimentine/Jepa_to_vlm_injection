# Step 106 smoke test: extract_coin_reverse_guided.py (new file) -- COIN
# analogue of job-105 (Ego4D). coin_longaxis's existing 2927 npz pairs
# can't feed train_joint_coupled_normalized.py's reverse pool directly
# (no vlm_old/vlm_new, no raw frames saved) -- see the script's own
# docstring. COIN videos are YouTube (yt-dlp), much faster/more reliable
# to redownload this session than Ego4D's S3 CLI has been.
# --limit 10 before a full-scale run, same discipline as job-105/job-92.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-smoke-coin-reverse-guided
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - k8s-chase-ci-01.calit2.optiputer.net
                      - nrp-g1.nysernet.org
                      - hcc-nrp-shor-c5813.unl.edu
                      - k8s-gpu-01.calit2.optiputer.net
                      - k8s-chase-ci-03.calit2.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
      containers:
        - name: smoke-coin-reverse-guided
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              "$PY" -m pip install --quiet timm yt-dlp
              export PATH="$(dirname "$PY"):$PATH"
              which yt-dlp

              echo "=== installing deno (yt-dlp JS runtime) ==="
              cd /tmp
              curl -sL https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip -o deno.zip
              unzip -q deno.zip
              ./deno --version

              cd "$REPO"
              mkdir -p /data/vans_work_coin_reverse_guided_smoke
              "$PY" vans_qa/full_scale/extract_coin_reverse_guided.py \
                --limit 10 \
                --min_span_seconds 30 \
                --video_cache_dir /data/vans_work_coin_reverse_guided_smoke/raw_videos \
                --cache_dir /data/vans_work_coin_reverse_guided_smoke/cache \
                --split_out /data/raw_data/qa_split_coin_reverse_guided_smoke.json

              echo "SMOKE_COIN_REVERSE_GUIDED_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: VJEPA2_CKPT
              value: /data/checkpoints/vjepa2/vitl.pt
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "5"
              memory: "16Gi"
              ephemeral-storage: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: "16Gi"
              ephemeral-storage: "6Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-106-smoke-coin-reverse-guided.yaml -n williamli-scvl
