# Step 101: FD/SL1/CD only (ThinkJEPA's compute_predicted_latent_metrics
# formula -- see probe_egodex_reverse_adapter.py's own latent_metrics()
# docstring) for job42_bridge_mlp2048 and job72_step4000. Per explicit
# instruction, skips job15_independent (the baseline/control checkpoint --
# not needed for the ThinkJEPA comparison) and skips probe-head training
# entirely: --latent_metrics_only runs one no-grad pass of each frozen
# predictor over the EgoDex test set and exits, no --probe_epochs cost at
# all. Uses a dedicated PVC clone (ruixin-conda-vol-vlm2) so this doesn't
# have to queue behind job-94, which is actively holding the original
# ruixin-conda-vol-vlm for its own (much longer) probe-training run.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-egodex-latent-metrics-only
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-01.laccd.edu
                      - nautilus-ext-gpu01.fullerton.edu
                      - dtn-gpu2.kreonet.net
                      - hcc-chase-shor-c4705.unl.edu
                      - k8s-chase-ci-01.calit2.optiputer.net
                      - hcc-nrp-shor-c5813.unl.edu
                      - k8s-gpu-01.calit2.optiputer.net
                      - k8s-chase-ci-03.calit2.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
      containers:
        - name: egodex-latent-metrics-only
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/thinkjepa/bin/python
              REPO=/code/Jepa_to_vlm_injection
              cd "$REPO"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/egodex_reverse_probe_latent_metrics_only

              echo "[INFO] pre-warming EgoDex cache tree (parallel)..."
              time find /data/raw_data/thinkjepa_egodex_iso/cache -name '*.npz' -print0 \
                | xargs -0 -P 32 -I{} sh -c 'cat {} > /dev/null' || true
              echo "[INFO] pre-warm (data) done"

              echo "[INFO] pre-warming thinkjepa conda env (parallel)..."
              time find /home/jovyan/conda-envs/thinkjepa -type f -print0 \
                | xargs -0 -P 32 -I{} sh -c 'cat {} > /dev/null' 2>/dev/null || true
              echo "[INFO] pre-warm (conda env) done"

              "$PY" vans_qa/full_scale/probe_egodex_reverse_adapter.py \
                --checkpoints job42_bridge_mlp2048 job72_step4000 \
                --latent_metrics_only \
                --batch_size 4 \
                --num_workers 4 \
                --out_json /data/raw_data/egodex_reverse_probe_latent_metrics_only/results.json \
                2>&1 | tee /data/raw_data/egodex_reverse_probe_latent_metrics_only/full_run.log
              echo "SCRIPT_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests: {cpu: "4", memory: "16Gi", ephemeral-storage: "2Gi", nvidia.com/gpu: "1"}
            limits: {cpu: "4", memory: "16Gi", ephemeral-storage: "4Gi", nvidia.com/gpu: "1"}
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm2
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-101-egodex-latent-metrics-only.yaml -n williamli-scvl
