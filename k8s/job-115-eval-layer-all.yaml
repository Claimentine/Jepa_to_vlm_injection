# Step 115: C1 layer-selection ablation -- full-benchmark eval of job-84's
# completed checkpoint (--layer_strategy all). Same pattern as job-90/114.
# job-84's training itself is genuinely OOM-contaminated on the REVERSE
# branch (rev_items_skipped=3319/3344 during training -- confirmed via its
# own full_run.log) -- this forward-side eval is unaffected by that (the
# forward branch trained normally; all-layer injection's much larger
# cross-attn footprint is what starved the reverse branch's own VRAM
# specifically), so a real forward number is still meaningful here even
# though the reverse number stays contaminated.
#
# IMPORTANT: run this strictly AFTER job-114 (uniform4) has fully
# completed, not concurrently -- both jobs merge their own checkpoint's
# result into the SAME shared out_path json files by re-reading then
# rewriting the whole file after each benchmark stage, so two of these
# jobs racing would let one silently clobber the other's freshly-added key.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-eval-layer-all
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-01.laccd.edu
                      - nautilus-ext-gpu01.fullerton.edu
                      - dtn-gpu2.kreonet.net
      containers:
        - name: eval-layer-all
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              RUN=/data/raw_data/ablation_layer_all_runs
              CKPT="all=${RUN}/best_forward.pt"

              cd "$REPO"

              echo "=== COIN full-test ==="
              export VANS_WORK_ROOT=/data/vans_work
              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_temporal.json \
                --split_part test \
                --checkpoint "$CKPT" \
                --resume \
                --out_path /data/raw_data/forward_fulltest_comparison_ablation_layer.json

              echo "=== TempCompass OOD ==="
              export VANS_WORK_ROOT=/data/vans_work_tempcompass
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_tempcompass.json \
                --split_part test \
                --checkpoint "$CKPT" \
                --resume \
                --out_path /data/raw_data/tempcompass_forward_comparison_ablation_layer.json

              echo "=== MVBench OOD ==="
              export VANS_WORK_ROOT=/data/vans_work_mvbench
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_mvbench.json \
                --split_part test \
                --checkpoint "$CKPT" \
                --resume \
                --out_path /data/raw_data/mvbench_forward_comparison_ablation_layer.json

              echo "=== CrossTask OOD ==="
              export VANS_WORK_ROOT=/data/vans_work_crosstask
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_crosstask.json \
                --split_part test \
                --precompute_cache_dir /data/vans_work_crosstask/eval_input_cache_crosstask \
                --checkpoint "$CKPT" \
                --resume \
                --out_path /data/raw_data/crosstask_forward_comparison_ablation_layer.json
          env:
            - name: VANS_ROOT
              value: /data
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "4"
              memory: "24Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4.8"
              # Raised from 19200Mi after this job OOMKilled ~8h into the
              # "all" layer-strategy's COIN full-test pass (2026-10-27) --
              # --resume only skips checkpoints already DONE in the output
              # JSON, not partial progress within one, so the OOM cost a
              # full redo. 30Gi is close to the namespace's 32Gi pod ceiling
              # (restriction-limit-range) while leaving headroom for the
              # init container.
              memory: "30Gi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-youcook
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-115-eval-layer-all.yaml -n williamli-scvl
