# Step 59 full: CrossTask extraction over all annotated videos. The smoke test
# (10 videos) passed on the pushed num_frames=32 fix: 43/43 clips encoded, 66
# QA items written. Output qa_split_crosstask.json feeds the eval jobs 63-64.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-crosstask-qa-full
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-01.laccd.edu
      containers:
        - name: crosstask-qa-full
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              "$PY" -m pip install --quiet yt-dlp
              export PATH="$(dirname "$PY"):$PATH"
              which yt-dlp

              echo "=== installing deno (yt-dlp JS runtime) ==="
              cd /tmp
              curl -sL https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip -o deno.zip
              unzip -q deno.zip
              ./deno --version

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/extract_crosstask_qa.py \
                --output_qa_split /data/raw_data/qa_split_crosstask.json \
                --annotations_cache_dir /data/vans_work_crosstask/crosstask_annotations \
                --video_cache_dir /data/vans_work_crosstask/crosstask_raw_videos \
                --clips_root /data/vans_work_crosstask/clips \
                --vjepa_cache_dir /data/vans_work_crosstask/vjepa_cache_full
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work_crosstask
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: VJEPA2_CKPT
              value: /data/checkpoints/vjepa2/vitl.pt
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests: {cpu: "5", memory: "13Gi", ephemeral-storage: "4Gi", nvidia.com/gpu: "1"}
            limits: {cpu: "6", memory: "15600Mi", ephemeral-storage: "4800Mi", nvidia.com/gpu: "1"}
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-59-full-crosstask-qa.yaml -n williamli-scvl
