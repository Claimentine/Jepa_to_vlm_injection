# Persistent volume for datasets, feature caches, and run outputs.
# File storage (rook-cephfs): best for large files and shared access across
# multiple pods/jobs at once (ReadWriteMany).
# Per lab onboarding guide Section 1.5 / Template 2.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jepa-vlm-injection-data-vol
spec:
  storageClassName: rook-cephfs
  accessModes:
    - ReadWriteMany # Allows multiple pods to mount this
  resources:
    requests:
      storage: 2Ti # Grown from 200Gi -> 400Gi (2026-08-18, VANS extraction) ->
                    # 1Ti (undocumented at the time -- this file had drifted
                    # out of sync with the live PVC) -> 2Ti (2026-09-12): the
                    # 1Ti claim hit 982GB used / 43GB free mid COIN long-axis
                    # extraction (job-24's first 2000-video batch alone used
                    # ~50GB -- 15GB raw video cache + 35GB .npz outputs, since
                    # each .npz stores raw past/future frame images alongside
                    # the V-JEPA2 features). Remaining ~8000 COIN candidates
                    # at that rate need another ~200GB; 2Ti leaves real
                    # headroom instead of repeating this same emergency
                    # expansion again in a few days. rook-cephfs supports
                    # online expansion (no pod restart needed) -- always
                    # re-check `kubectl get pvc ... -o yaml` for the live
                    # size before trusting this comment, it has drifted
                    # before.

# Apply with:
#   kubectl apply -f pvc-data-cephfs.yaml -n williamli-scvl
#
# Reminder (Golden Rule #2): 6-month purge rule applies here too. This is
# NOT where finished results/papers-worth-of-data should live long-term.
