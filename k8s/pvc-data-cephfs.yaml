# Persistent volume for datasets, feature caches, and run outputs.
# File storage (rook-cephfs): best for large files and shared access across
# multiple pods/jobs at once (ReadWriteMany).
# Per lab onboarding guide Section 1.5 / Template 2.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jepa-vlm-injection-data-vol
spec:
  storageClassName: rook-cephfs
  accessModes:
    - ReadWriteMany # Allows multiple pods to mount this
  resources:
    requests:
      storage: 400Gi # Grown from 200Gi on 2026-08-18: hit 100% full mid
                      # V-JEPA2 feature extraction (job-03) -- vans_injection_backup
                      # alone reached 189.6GB against the 200Gi cap, and the
                      # full extraction over all 13,629 needed clips at
                      # ~16MB/npz needs ~330-350GB total including the
                      # existing backup, checkpoints, and hf_cache. rook-cephfs
                      # supports online expansion (no pod restart needed).

# Apply with:
#   kubectl apply -f pvc-data-cephfs.yaml -n williamli-scvl
#
# Reminder (Golden Rule #2): 6-month purge rule applies here too. This is
# NOT where finished results/papers-worth-of-data should live long-term.
