              echo
              echo "=== verify fingerprint now matches ==="
              "$PY" - <<'PYEOF'
              import numpy as np, glob
              from collections import Counter
              counts = Counter()
              for p in sorted(glob.glob('/data/raw_data/egoexo4d_probe_bundle_full/cache/**/*.npz', recursive=True)):
