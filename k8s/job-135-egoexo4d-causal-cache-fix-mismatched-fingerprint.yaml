# Step 135: rebuilds the 101 EgoExo4D cache npz files that job-132's
# shard-4 and shard-5 produced with a DIFFERENT cache_config_fingerprint
# than the other 5 shards.
#
# Root cause, confirmed by diffing both shards' own configuration_json
# field inside a sample npz: every functional setting is byte-identical
# (qwen revision "main" resolved the same, same checkpoint_sha, same
# vjepa_checkpoint_sha256, same layers/prompt/sampling) EXCEPT
# extractor_source_sha256 -- a hash of rebuild_causal_cache.py's own file
# content. shard-4/5 ran on ruixin-conda-vol-vlm/-vlm2, whose copies of
# ThinkJEPA's cache_train/rebuild_causal_cache.py differ byte-for-byte
# from the copies on the other 5 conda-storage PVCs (ruixin-conda-vol,
# -ddp, -ddp2, -precompute, -baselines all agree with each other). Purely
# a provenance/identity-hash artifact, not a functional difference in the
# extracted features -- but NpzCacheDataset._validate_archive_set_identity
# strictly rejects a cache_dir whose files don't all share one fingerprint
# (confirmed hitting exactly this error via --inspect_batch_only before
# committing to the full probe run), so the 101 affected files were
# deleted and are rebuilt here on ruixin-conda-vol (confirmed to produce
# the same fingerprint as shard-0/1/2/3/6).
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-egoexo4d-causal-cache-fix-fingerprint
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values:
                      - "16000"
      containers:
        - name: egoexo4d-causal-cache-fix-fingerprint
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
