# TEST COPY of job-03-extract-vjepa-features.yaml: --limit 50 profiling run
# to confirm GPU utilization (>40%) and CPU/memory before submitting the
# full ~13.5k-clip job. Delete this Job (and this file) once the check is
# done -- it's not meant to be kept around, see k8s/job-03-extract-vjepa-features.yaml
# for the real one.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-extract-vjepa-features-test
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # Installed PyTorch build only supports compute capability
                  # >=7.5 (sm_75/80/86/90/100/120). A prior run landed on a
                  # TITAN Xp (CC 6.1, "NVIDIA TITAN Xp with CUDA capability
                  # sm_61 is not compatible") and would have failed the
                  # forward pass even with a valid checkpoint. Exclude all
                  # CC<7.5 cards present in this cluster (Kepler/Maxwell/
                  # Pascal/Volta).
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
      containers:
        - name: extract-vjepa-features
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/thinkjepa/bin/python
              REPO=/code/Jepa_to_vlm_injection

              # Re-create the data-layout symlinks idempotently, so this Job
              # doesn't silently depend on manual setup done ad hoc in an
              # interactive pod. Both point at the same restored backup dir:
              # clips/ is looked up as <id>/<n>.mp4, vjepa_cache_full/ as
              # <id>__<n>.npz -- the two naming schemes don't collide, so
              # sharing one physical directory for both is safe and avoids
              # duplicating 94GB.
              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"
              mkdir -p "$(dirname "$VJEPA2_CKPT")"

              echo "[INFO] clips needed: $($PY -c "
              import json, os
              split = json.load(open(os.path.join(os.environ['VANS_ROOT'], 'raw_data/qa_split_full.json')))
              c = set()
              for part in split.values():
                  for item in part:
                      c.add(item['in_clip']); c.add(item['out_clip'])
              print(len(c))
              ")"

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/extract_vjepa_features_full.py --limit 50
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: VJEPA2_CKPT
              value: /data/checkpoints/vjepa2/vitl.pt
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
          resources:
            requests:
              cpu: "6"
              memory: "16Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              # Limits within 20% of requests per fair-share policy, except
              # GPU count which must match exactly (can't fractionally limit
              # a GPU).
              cpu: "7.2"
              memory: "19200Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
        - name: init-fetch-checkpoint
          # CPU-only, deliberately separate from the GPU container: downloading
          # a multi-GB file with a GPU already allocated and idle would burn
          # fair-share GPU-utilization budget for no reason.
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              CKPT=/data/checkpoints/vjepa2/vitl.pt

              # Existence alone isn't enough -- a prior run landed a truncated
              # 4.59GB file here (pod likely killed/evicted mid-download) that
              # `[ -f "$CKPT" ]` happily "skipped" on every retry, so the GPU
              # container kept failing on torch.load() with "PytorchStreamReader
              # failed reading zip archive". Validate as a zip archive and
              # redownload (force_download, since HF's local cache would
              # otherwise also serve the same broken blob) if it doesn't check out.
              if [ -f "$CKPT" ] && python3 -c "
              import zipfile, sys
              try:
                  with zipfile.ZipFile('$CKPT') as zf:
                      sys.exit(0 if zf.testzip() is None else 1)
              except Exception:
                  sys.exit(1)
              "; then
                echo "[skip] checkpoint already present and valid at $CKPT"
              else
                if [ -f "$CKPT" ]; then
                  echo "[fix] existing checkpoint failed zip validation, removing" >&2
                  rm -f "$CKPT"
                fi
                pip install --quiet -U huggingface_hub
                mkdir -p "$(dirname "$CKPT")"
                python3 - <<'PY'
              import shutil
              from huggingface_hub import hf_hub_download
              # facebook/vjepa2-vitl-fpc64-256: public, no token needed.
              # original/model.pth is the raw torch state-dict format
              # load_dense_jepa_encoder() expects (not the HF-wrapped
              # model.safetensors in the same repo). fpc64 (64 frames/clip)
              # and 256 res match this project's NUM_FRAMES=64 / res=256.
              cached = hf_hub_download(
                  repo_id="facebook/vjepa2-vitl-fpc64-256",
                  repo_type="model",
                  filename="original/model.pth",
                  force_download=True,
              )
              shutil.copy(cached, "/data/checkpoints/vjepa2/vitl.pt")
              print("[fetch] saved to /data/checkpoints/vjepa2/vitl.pt")
              PY
                python3 -c "
              import zipfile
              with zipfile.ZipFile('$CKPT') as zf:
                  assert zf.testzip() is None, 'still corrupt after redownload'
              print('[check] fresh download is a valid zip archive')
              "
              fi
          env:
            # Without this, huggingface_hub's default cache dir lands on the
            # container's ephemeral-storage instead of the data PVC -- the
            # ~1.2GB checkpoint download blew the 1200Mi limit below and got
            # the pod Evicted before it ever reached the GPU container.
            - name: HF_HOME
              value: /data/hf_cache
          resources:
            requests:
              cpu: "1"
              memory: "3Gi"
              ephemeral-storage: "2Gi"
            limits:
              cpu: "1.2"
              memory: "3600Mi"
              ephemeral-storage: "2400Mi"
          volumeMounts:
            - name: data-storage
              mountPath: /data
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never
  backoffLimit: 0

# Apply with:
#   kubectl apply -f job-03-extract-vjepa-features-test.yaml -n williamli-scvl
# Watch it:
#   kubectl get pods -n williamli-scvl -w
#   kubectl logs -f job/ruixin-extract-vjepa-features-test -n williamli-scvl
# Clean up when done:
#   kubectl delete job ruixin-extract-vjepa-features-test -n williamli-scvl
