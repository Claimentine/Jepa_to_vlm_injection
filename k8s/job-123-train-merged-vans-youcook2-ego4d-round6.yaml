# Step 123 (job-107 round6): job-72/round5's exact recipe (--disable_norm
# --cycle_loss_weight 0 --bridge_hidden_dim 2048 --epochs 2), with the full
# data expansion requested 2026-10-27:
#   - forward: unchanged qa_split_merged_v1.json (VANS/COIN+YouCook2,
#     10366 train), but now reading from job-121's precompute cache
#     (--precompute_cache_dir) so the per-step cost drops from a live
#     decode+processor call to a cache read -- this was confirmed as the
#     dominant bottleneck in round4/5 (GPU near-idle, 3-6 min/step despite
#     a small model). train_joint_coupled_normalized.py was just given
#     this flag (previously only the eval scripts had it).
#   - reverse: job-122's merged split (qa_split_full_merged_ego4d.json)
#     and merged cache dir (vlm_guidance_cache_paired_merged_ego4d) --
#     adds job-109's Ego4D reverse-guided pairs (~5000-6000, all under
#     "train" per explicit decision) on top of the existing ~10116
#     EgoDex-sourced pairs, finally fulfilling job-107's own original
#     header note ("Ego4D ... deliberately NOT included this run ...
#     queued as a follow-up continuation once they [produce usable
#     data] do").
#
# --nproc_per_node=2 (matches job-72's own recipe exactly, per 2026-10-27
# discussion -- the round4 hang theory about concurrent 2-rank safetensors
# loading was never confirmed and more likely a one-off node/storage
# issue, not a reason to deviate from the established recipe).
#
# HOLD: do not submit until BOTH job-121 (forward precompute cache) AND
# job-122 (Ego4D reverse-data merge, itself gated on job-109 finishing)
# have completed -- this run depends on both of their outputs existing on
# disk before torchrun even starts.
#
# STATUS 2026-10-28: job-109 fully complete (both narration + goalstep
# phases). job-122 reran to merge both phases in (train=16834, val=1805,
# test=1805 in qa_split_full_merged_ego4d.json) -- done. job-121 is
# resubmitted and filling in the remaining ~3723 YouCook2 precompute-cache
# entries now (has_features() itself already confirmed 100% for all 3676
# YouCook2 train items via a live check, independent of job-121's own
# cache-completeness). Still wait for job-121's own DONE marker before
# submitting this, so the forward branch stays cache-bound instead of
# falling back to live decode for whichever items aren't cached yet.
#
# FIX 2026-10-27: job-121's first run revealed YouCook2 items all fail
# has_features() when only the VANS/COIN backup is linked into
# $VANS_WORK_ROOT -- YouCook2's own clips+vjepa feats live under the
# separate /data/vans_work_youcook and were never merged in. Without this
# fix, fwd_train (line ~280 of train_joint_coupled_normalized.py) would
# have silently excluded all ~3676 YouCook2 train items, defeating much of
# the point of this round. job-121 was rerun with the same merge fix first.
#
# FIX 2026-10-28: added --max_test_items 300 -- job-118 crashed exactly 3h
# after its training loop ended because the FINAL rev_test eval (rank-0
# only, previously uncapped, ~1800 items read off a congested shared PVC)
# outran even the bumped 3h NCCL barrier timeout while rank 1 waited on
# the trailing dist.barrier(). See train_joint_coupled_normalized.py's
# --max_test_items docstring for the full diagnosis.
#
# FIX 2026-10-30: added the >16000MiB nvidia.com/gpu.memory nodeAffinity
# floor (job-125 already carries this). Without it, this job's first
# ~4.5h ran on two RTX 2080 Ti (11264MiB) cards on
# k8s-haosu-23.sdsc.optiputer.net DESPITE the product-name exclusion list
# below already listing NVIDIA-GeForce-RTX-2080-Ti -- that node's
# gpu.product label apparently doesn't match the expected string (a
# NotIn match requires the label to literally equal a listed value; a
# missing/differently-formatted label silently passes NotIn), so the
# name-based exclusion alone isn't reliable on every node. Result: 423+
# OOM skip warnings (both fwd and rev items) in under 5h with zero
# checkpoints saved (train_log.jsonl still 0 bytes) -- silently degrading
# how much of the full-data expansion this run actually trains on. Killed
# and resubmitted with the numeric memory floor instead, which doesn't
# depend on the product string matching at all.
#
# DOWNGRADED TO SINGLE-GPU 2026-10-30 (same call as job-125's earlier
# downgrade): after the memory-floor fix, the 2-GPU resubmission still sat
# Pending 2h+ with zero FailedScheduling events (cluster-wide 2-GPU
# scarcity, same pattern job-125 hit for 17h). Per explicit user request,
# dropped torchrun/DDP entirely (single process -- is_ddp() is False when
# WORLD_SIZE is unset, same fallback path job-87's debug run and job-125
# already exercised safely) and halved cpu/memory/gpu requests to match.
# Trades ~2x wall time for an actually-schedulable job.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-train-merged-vans-youcook2-ego4d-round6
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-01.laccd.edu
                      - nautilus-ext-gpu01.fullerton.edu
                      - dtn-gpu2.kreonet.net
                  # name-based exclusion above isn't reliable on every node
                  # (see 2026-10-30 FIX note) -- this numeric floor is the
                  # real guard against landing on an <16GB card again.
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values:
                      - "16000"
      containers:
        - name: train-merged-vans-youcook2-ego4d-round6
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              "$PY" -m pip install --quiet h5py
              export PATH="$(dirname "$PY"):$PATH"

              # Same one-time marker guard as job-121 (which runs first) --
              # if job-121 already built the merge, this is a free no-op;
              # running the merge loop twice concurrently caused a 60+min
              # stall via CephFS lock contention on 2026-10-28.
              MARKER="$VANS_WORK_ROOT/.merged_youcook_done"
              if [ ! -f "$MARKER" ]; then
                # Guard against $VANS_WORK_ROOT/{clips,vjepa_cache_full} still
                # being plain symlinks from an older run (see job-121's
                # 2026-10-27 "are the same file" crash note) -- mkdir -p alone
                # is a silent no-op on an existing symlink-to-a-dir.
                for p in "$VANS_WORK_ROOT/clips" "$VANS_WORK_ROOT/vjepa_cache_full"; do
                  [ -L "$p" ] && rm -f "$p"
                done
                mkdir -p "$VANS_WORK_ROOT/clips" "$VANS_WORK_ROOT/vjepa_cache_full"
                # Merge in YouCook2's separately-stored clips+vjepa feats too
                # (see job-121's 2026-10-27 rerun note -- has_features() was
                # silently False for every YouCook2 item when only the
                # VANS/COIN backup was linked in, since YouCook2's features
                # live under /data/vans_work_youcook instead).
                for d in /data/hf_data/vans_injection_backup/*/; do
                  ln -sfn "${d%/}" "$VANS_WORK_ROOT/clips/$(basename "${d%/}")"
                done
                for f in /data/hf_data/vans_injection_backup/*.npz; do
                  ln -sfn "$f" "$VANS_WORK_ROOT/vjepa_cache_full/$(basename "$f")"
                done
                for d in /data/vans_work_youcook/clips/*/; do
                  ln -sfn "${d%/}" "$VANS_WORK_ROOT/clips/$(basename "${d%/}")"
                done
                for f in /data/vans_work_youcook/vjepa_cache_full/*.npz; do
                  ln -sfn "$f" "$VANS_WORK_ROOT/vjepa_cache_full/$(basename "$f")"
                done
                touch "$MARKER"
              fi

              cd "$REPO"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/joint_coupled_merged_v1_ego4d_runs_round6
              "$PY" \
                vans_qa/full_scale/train_joint_coupled_normalized.py \
                --qa_split /data/raw_data/qa_split_merged_v1.json \
                --precompute_cache_dir /data/vans_work/eval_input_cache_merged_v1_train \
                --rev_qa_split /data/raw_data/qa_split_full_merged_ego4d.json \
                --cache_dir /data/vans_work/vlm_guidance_cache_paired_merged_ego4d \
                --disable_norm \
                --cycle_loss_weight 0 \
                --bridge_hidden_dim 2048 \
                --epochs 2 \
                --val_every_steps 500 \
                --save_every_steps 1000 \
                --max_val_items 100 \
                --max_test_items 300 \
                --out_dir /data/raw_data/joint_coupled_merged_v1_ego4d_runs_round6 2>&1 \
                | tee /data/raw_data/joint_coupled_merged_v1_ego4d_runs_round6/full_run.log
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
            - name: PYTORCH_ALLOC_CONF
              value: expandable_segments:True
          resources:
            requests:
              cpu: "5"
              memory: "16Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: "19200Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            # ddp2 is held by round5 (still training) as of this
            # 2026-10-29 submission -- confirmed via a live PVC sweep
            # across all pods first, same Multi-Attach risk this project
            # has hit before.
            claimName: ruixin-conda-vol-youcook
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-123-train-merged-vans-youcook2-ego4d-round6.yaml -n williamli-scvl
