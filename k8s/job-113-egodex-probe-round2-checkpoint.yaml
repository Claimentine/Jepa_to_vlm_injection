# Step 113: full EgoDex reverse-probe (ADE/FDE/acc@0.05 + FD/SL1/CD, same
# default no-flag mode as job-76) on our latest COMPLETED EgoDex-specific
# fine-tune checkpoint (round2: job-110, 15 epochs on top of job-72's
# step_4000, continuing round1's own 8 epochs -- 23 total). job-76 only
# ever probed the pre-fine-tune job72_step4000 checkpoint itself (the
# paper draft's current ThinkBridge row, ADE/FDE/acc=0.033/0.041/82.5,
# FD/SL1/CD still blank) -- round2 has never had this full probe run
# against it, only its own per-epoch train_loss/test metrics from
# finetune_egodex_predictor.py's own training loop, which are NOT the same
# metric as the probe script's FD/SL1/CD here (that script evaluates a
# TRAINED linear probe decoding the frozen predictor's raw latent into
# xyz_world; this one re-derives the probe fresh against round2's own
# weights). Guidance mode is automatic (checkpoint has no "guidance" key,
# defaults to "crossattn" -- correct for this lineage, NOT the
# job_none_guidance ablation).
#
# round3 (job-112, currently running) has no checkpoint yet -- queued as
# a follow-up once it completes.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-egodex-probe-round2-checkpoint
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-01.laccd.edu
                      - nautilus-ext-gpu01.fullerton.edu
                      - dtn-gpu2.kreonet.net
                      - hcc-chase-shor-c4705.unl.edu
      containers:
        - name: probe-round2-checkpoint
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/thinkjepa/bin/python
              REPO=/code/Jepa_to_vlm_injection
              cd "$REPO"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/egodex_reverse_probe_job72step4000_round2_full
              "$PY" vans_qa/full_scale/probe_egodex_reverse_adapter.py \
                --checkpoints "job72_round2=/data/raw_data/egodex_finetuned_job72_step4000_round2/predictor.pt" \
                --joint_subset all \
                --batch_size 4 \
                --probe_epochs 10 \
                --num_workers 4 \
                --out_json /data/raw_data/egodex_reverse_probe_job72step4000_round2_full/results.json \
                2>&1 | tee /data/raw_data/egodex_reverse_probe_job72step4000_round2_full/full_run.log
              echo "SCRIPT_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests: {cpu: "4", memory: "20Gi", ephemeral-storage: "2Gi", nvidia.com/gpu: "1"}
            limits: {cpu: "4.8", memory: "24Gi", ephemeral-storage: "4Gi", nvidia.com/gpu: "1"}
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-113-egodex-probe-round2-checkpoint.yaml -n williamli-scvl
