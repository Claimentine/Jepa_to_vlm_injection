# Step 104: full-scale Ego4D GoalStep QA eval benchmark -- a 6th forward
# zero-shot benchmark (egocentric/daily-life domain) for job13(crossattn)
# and job-72(job-42's bridge_capacity recipe at step 4000, our current best
# full-architecture checkpoint) to be evaluated on, alongside the other 5
# (CrossTask/COIN/TempCompass/MVBench/YouCook2).
#
# extract_ego4d_qa.py was job-89's smoke-test-only script (--limit_videos
# 10, read-only against job-50's leftover video cache, which job-95 has
# since mostly consumed-and-deleted). Updated this session to download on
# demand via extract_ego4d_longaxis.py's own download_video() -- the AWS
# credentials it's wired to ARE working (job-95 has downloaded hundreds of
# videos with them all session). Uses its OWN --video_cache_dir (NOT
# job-95's /data/vans_work/ego4d_raw_videos) so the two jobs' concurrent
# downloads/deletes never collide.
#
# --limit_videos 20: the smoke test got 917 QA items from just 10 videos
# (goalstep videos average ~92 consecutive-step pairs each) -- 20 videos
# lands in the same ballpark as the other 5 benchmarks (CrossTask ~1558,
# COIN ~2846, YouCook2 636), not an order of magnitude bigger.
#
# UPDATED 2026-10-25: switched to --skip_phase2 (download+trim only, no
# VJEPA load) and dropped the GPU request entirely -- Ego4D's ~50%
# per-download-attempt failure rate (confirmed this session, up to 600s
# each) meant this pod was holding a GPU reservation for hours at 0%
# utilization even with lazy loading, since lazy loading only controls
# WHEN code touches the GPU, not whether the pod holds one the whole
# time regardless. Run this overnight as a CPU-only pod; rerun WITHOUT
# --skip_phase2 (and WITH a GPU request again) tomorrow to do the VJEPA
# encoding over the already-downloaded/trimmed clips, no re-download.
#
# UPDATED 2026-10-25 (round 2): --video_cache_dir now points at job-109's
# own goalstep raw_videos directory (shared, not job-104's own separate
# one) -- both scripts use the identical download_video()/directory
# layout (<dir>/v2/full_scale/<uid>.mp4) for the SAME GoalStep video
# pool, so every future download by EITHER pipeline now benefits both
# instead of each downloading its own separate copy. --limit_videos
# bumped 20->60 to pull more forward QA data now that there's a shared
# pool to draw from.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-ego4d-qa-fullscale
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      # known-bad nodes this session (GPU-lost UnexpectedAdmissionError,
                      # carried over from job-94/job-95's own exclusion lists)
                      - k8s-chase-ci-01.calit2.optiputer.net
                      - nrp-g1.nysernet.org
                      - hcc-nrp-shor-c5813.unl.edu
                      - k8s-gpu-01.calit2.optiputer.net
                      - k8s-chase-ci-03.calit2.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
                      # excluded 2026-10-25: 6 consecutive ego4d CLI download
                      # timeouts in a row (fresh video_uids each time, not a
                      # repeat of the same few slow ones) -- looks like a
                      # degraded network path from this node to Ego4D's S3
                      # bucket specifically, not the videos themselves
                      # (job-95, on a different node, keeps succeeding at a
                      # normal rate concurrently)
                      - hcc-nrp-shor-c5805.unl.edu
      containers:
        - name: ego4d-qa-fullscale
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              cd "$REPO"

              "$PY" -m pip install --quiet ego4d
              export PATH="$(dirname "$PY"):$PATH"

              GOALSTEP=$(find /data/raw_data/ego4d_annotations -iname "goalstep_train.json" | head -1)
              echo "using goalstep annotations: $GOALSTEP"

              mkdir -p /data/vans_work_ego4d_qa
              "$PY" vans_qa/full_scale/extract_ego4d_qa.py \
                --goalstep_json "$GOALSTEP" \
                --video_cache_dir /data/vans_work_ego4d_reverse_guided/raw_videos_goalstep \
                --limit_videos 60 \
                --skip_phase2 \
                --output_qa_split /data/raw_data/qa_split_ego4d.json \
                --clips_root /data/vans_work_ego4d_qa/clips \
                --vjepa_cache_dir /data/vans_work_ego4d_qa/vjepa_cache_full

              echo "EGO4D_QA_DOWNLOAD_ONLY_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: VJEPA2_CKPT
              value: /data/checkpoints/vjepa2/vitl.pt
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ego4d-aws-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ego4d-aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: ego4d-aws-credentials
                  key: AWS_DEFAULT_REGION
          resources:
            requests:
              cpu: "5"
              memory: "16Gi"
              ephemeral-storage: "4Gi"
            limits:
              cpu: "6"
              memory: "16Gi"
              ephemeral-storage: "6Gi"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-baselines
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-104-ego4d-qa-fullscale.yaml -n williamli-scvl
