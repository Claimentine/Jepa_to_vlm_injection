# Step 73: job-72 (job-42's recipe, --epochs 2) is training with a noisy
# 100-item val snapshot trajectory that climbed into epoch 2 (step
# 3500-4000: 0.84-0.86) then dipped sharply (step 4500: 0.41) before
# recovering (step 5000: 0.66, step 5500: 0.82, step 6000: 0.79). To see
# which point in training actually generalizes best (not just which 100-item
# snapshot got lucky), this runs the full forward-direction benchmark suite
# on the three periodic checkpoints bracketing that dip: step_4000.pt (the
# pre-dip high point), step_5000.pt (post-dip, still recovering), and
# step_6000.pt (post-dip, stabilized). step_5500.pt was never saved
# (--save_every_steps 1000, not a multiple), so step_5000/6000 are its
# closest saved neighbors.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-eval-job72-checkpoints
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-01.laccd.edu
                      - nautilus-ext-gpu01.fullerton.edu
                      - dtn-gpu2.kreonet.net
      containers:
        - name: eval-job72-checkpoints
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              RUN=/data/raw_data/joint_coupled_bridge_mlp_2epoch_runs
              CKPTS=(
                "job72_step4000=${RUN}/step_4000.pt"
                "job72_step5000=${RUN}/step_5000.pt"
                "job72_step6000=${RUN}/step_6000.pt"
              )

              cd "$REPO"

              echo "=== COIN full-test ==="
              export VANS_WORK_ROOT=/data/vans_work
              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_temporal.json \
                --split_part test \
                --checkpoint "${CKPTS[0]}" --checkpoint "${CKPTS[1]}" --checkpoint "${CKPTS[2]}" \
                --resume \
                --out_path /data/raw_data/forward_fulltest_comparison_job72.json

              echo "=== TempCompass OOD ==="
              export VANS_WORK_ROOT=/data/vans_work_tempcompass
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_tempcompass.json \
                --split_part test \
                --checkpoint "${CKPTS[0]}" --checkpoint "${CKPTS[1]}" --checkpoint "${CKPTS[2]}" \
                --resume \
                --out_path /data/raw_data/tempcompass_forward_comparison_job72.json

              echo "=== MVBench OOD ==="
              export VANS_WORK_ROOT=/data/vans_work_mvbench
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_mvbench.json \
                --split_part test \
                --checkpoint "${CKPTS[0]}" --checkpoint "${CKPTS[1]}" --checkpoint "${CKPTS[2]}" \
                --resume \
                --out_path /data/raw_data/mvbench_forward_comparison_job72.json

              echo "=== CrossTask OOD (decoupled cache from job-63) ==="
              export VANS_WORK_ROOT=/data/vans_work_crosstask
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_crosstask.json \
                --split_part test \
                --precompute_cache_dir /data/vans_work_crosstask/eval_input_cache_crosstask \
                --checkpoint "${CKPTS[0]}" --checkpoint "${CKPTS[1]}" --checkpoint "${CKPTS[2]}" \
                --resume \
                --out_path /data/raw_data/crosstask_forward_comparison_job72.json
          env:
            - name: VANS_ROOT
              value: /data
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4.8"
              memory: "19200Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-73-eval-job72-checkpoints.yaml -n williamli-scvl
