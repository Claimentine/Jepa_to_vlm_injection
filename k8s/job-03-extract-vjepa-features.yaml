# Step 3: V-JEPA2 feature extraction for the full-scale VANS QA pipeline.
#
# Needs a GPU (load_dense_jepa_encoder / encode_dense_jepa_video call
# .cuda() directly -- this cannot run CPU-only, unlike job-01/job-02).
# Idempotent: vans_qa/full_scale/extract_vjepa_features_full.py skips any
# clip that already has an output .npz, so re-running / resuming after a
# preemption just picks up where it left off.
#
# Before applying the full run: submit once with --limit 50 (edit the args
# below) and check the GPU dashboard
# (https://grafana.nrp-nautilus.io/d/dRG9q0Ymz/k8s-compute-resources-namespace-gpus)
# and CPU/memory dashboard while it runs. This script's GPU work is a tight
# per-clip loop (decode -> cuda() -> forward -> save), so utilization should
# sit well above the 40% fair-share floor, but confirm before committing to
# the ~13.5k-clip full run, and adjust the resources block below to match
# what you actually observe (lab onboarding guide Section 1.2, "Be
# Truthful") -- the numbers below are a starting estimate, not measured.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-extract-vjepa-features
spec:
  template:
    spec:
      containers:
        - name: extract-vjepa-features
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/thinkjepa/bin/python
              REPO=/code/Jepa_to_vlm_injection

              # Re-create the data-layout symlinks idempotently, so this Job
              # doesn't silently depend on manual setup done ad hoc in an
              # interactive pod. Both point at the same restored backup dir:
              # clips/ is looked up as <id>/<n>.mp4, vjepa_cache_full/ as
              # <id>__<n>.npz -- the two naming schemes don't collide, so
              # sharing one physical directory for both is safe and avoids
              # duplicating 94GB.
              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"
              mkdir -p "$(dirname "$VJEPA2_CKPT")"

              echo "[INFO] clips needed: $($PY -c "
              import json, os
              split = json.load(open(os.path.join(os.environ['VANS_ROOT'], 'raw_data/qa_split_full.json')))
              c = set()
              for part in split.values():
                  for item in part:
                      c.add(item['in_clip']); c.add(item['out_clip'])
              print(len(c))
              ")"

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/extract_vjepa_features_full.py
              # For the profiling run, temporarily change the line above to:
              #   exec "$PY" vans_qa/full_scale/extract_vjepa_features_full.py --limit 50
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: VJEPA2_CKPT
              value: /data/checkpoints/vjepa2/vitl.pt
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
          resources:
            requests:
              cpu: "6"
              memory: "16Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              # Limits within 20% of requests per fair-share policy, except
              # GPU count which must match exactly (can't fractionally limit
              # a GPU).
              cpu: "7.2"
              memory: "19200Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
        - name: init-fetch-checkpoint
          # CPU-only, deliberately separate from the GPU container: downloading
          # a multi-GB file with a GPU already allocated and idle would burn
          # fair-share GPU-utilization budget for no reason.
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              CKPT=/data/checkpoints/vjepa2/vitl.pt
              if [ -f "$CKPT" ]; then
                echo "[skip] checkpoint already present at $CKPT"
              else
                pip install --quiet -U huggingface_hub
                mkdir -p "$(dirname "$CKPT")"
                python3 - <<'PY'
              import os, shutil
              from huggingface_hub import hf_hub_download
              # facebook/vjepa2-vitl-fpc64-256: public, no token needed.
              # original/model.pth is the raw torch state-dict format
              # load_dense_jepa_encoder() expects (not the HF-wrapped
              # model.safetensors in the same repo). fpc64 (64 frames/clip)
              # and 256 res match this project's NUM_FRAMES=64 / res=256.
              cached = hf_hub_download(
                  repo_id="facebook/vjepa2-vitl-fpc64-256",
                  repo_type="model",
                  filename="original/model.pth",
              )
              shutil.copy(cached, "/data/checkpoints/vjepa2/vitl.pt")
              print("[fetch] saved to /data/checkpoints/vjepa2/vitl.pt")
              PY
              fi
          resources:
            requests:
              cpu: "1"
              memory: "3Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1.2"
              memory: "3600Mi"
              ephemeral-storage: "1200Mi"
          volumeMounts:
            - name: data-storage
              mountPath: /data
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never
  backoffLimit: 2

# Apply with:
#   kubectl apply -f job-03-extract-vjepa-features.yaml -n williamli-scvl
# Watch it:
#   kubectl get pods -n williamli-scvl -w
#   kubectl logs -f job/ruixin-extract-vjepa-features -n williamli-scvl
# Clean up when done (Golden Rule #4):
#   kubectl delete job ruixin-extract-vjepa-features -n williamli-scvl
#
# Check GPU utilization stayed healthy (fair-share, Section 1.2):
#   https://grafana.nrp-nautilus.io/d/dRG9q0Ymz/k8s-compute-resources-namespace-gpus
