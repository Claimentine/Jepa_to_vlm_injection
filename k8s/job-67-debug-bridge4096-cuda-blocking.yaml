# Step 67: debug job-60's 3/3 "CUDA error: an illegal memory access" crash.
# All three job-60 attempts died the same way after hours of training: a
# per-item try/except caught an AcceleratorError (first seen on a FORWARD
# item, "fwd skip pESV6xLJNkA__144"), which the training loop treated as a
# normal skip-and-continue -- but an illegal memory access corrupts the CUDA
# context for the rest of the process, so a later, unrelated, trivial op
# (torch.zeros((), device=device)) crashed instead. The original async CUDA
# error reporting means the reported crash site is NOT necessarily the real
# kernel that corrupted memory -- CUDA_LAUNCH_BLOCKING=1 forces synchronous
# kernel launches so the FIRST real error gets an accurate, synchronous
# traceback pointing at the actual offending kernel/shape.
#
# Same config as job-60 (bridge_hidden_dim=4096, --log_bridge_grad_conflict,
# disable_norm, cycle_loss_weight=0) so the same bug (if deterministic-ish)
# should reproduce. CUDA_LAUNCH_BLOCKING=1 is much slower -- this run is only
# for localizing the bug, not a usable training result. backoffLimit: 0 so a
# crash leaves its log for inspection instead of silently retrying.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-debug-bridge4096-cuda-blocking
spec:
  backoffLimit: 0
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-01.laccd.edu
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values:
                      - "20000"
      containers:
        - name: debug-cuda-blocking
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              "$PY" -m pip install --quiet h5py
              export PATH="$(dirname "$PY"):$PATH"

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/joint_coupled_bridge4096_debug
              export CUDA_LAUNCH_BLOCKING=1
              export TORCH_USE_CUDA_DSA=1
              torchrun --standalone --nproc_per_node=2 \
                vans_qa/full_scale/train_joint_coupled_normalized.py \
                --qa_split /data/raw_data/qa_split_temporal.json \
                --disable_norm \
                --cycle_loss_weight 0 \
                --bridge_hidden_dim 4096 \
                --log_bridge_grad_conflict \
                --epochs 1 \
                --val_every_steps 500 \
                --save_every_steps 1000 \
                --max_val_items 100 \
                --out_dir /data/raw_data/joint_coupled_bridge4096_debug 2>&1 \
                | tee /data/raw_data/joint_coupled_bridge4096_debug/debug_run.log
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
            - name: PYTORCH_ALLOC_CONF
              value: expandable_segments:True
          resources:
            requests:
              cpu: "10"
              memory: "27Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "2"
            limits:
              cpu: "12"
              memory: "31500Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "2"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-ddp
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-67-debug-bridge4096-cuda-blocking.yaml -n williamli-scvl
