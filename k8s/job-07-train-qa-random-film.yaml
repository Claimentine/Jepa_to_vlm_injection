# Step 7 (2/3): training run, injection=random x injection_site=cross_attn.
# `random` is the control condition: ignores vjepa_feats and projects a
# fixed-seed random tensor of the same shape through an identical adapter, to
# test whether gains come from JEPA content vs. just extra trainable
# soft-prompt capacity (see JepaInjector's docstring in
# common/jepa_injection_model.py).
#
# 2026-08-30: pointed at qa_split_temporal.json, same settings as job-05's
# jepa x cross_attn full retrain there (1 epoch over all ~6690 same-video-hard
# train rows, --val_every_steps 500, --max_val_items 100), so the two are
# directly comparable. That jepa run hit best_val_acc(logprob)=0.8100
# in-training, and its checkpoint scored easy=0.7920 / hard=0.5650 on an
# 800-item held-out test (job-06) -- hard sits ~6.5 points above chance and
# ~16.5 points above the frozen zero-shot baseline's hard=0.4000 (job-07
# none run), suggesting cross_attn learned *something* real once the
# any-video shortcut was removed from training. This run is the missing
# control: if `random` reaches a similar hard-tier number with the identical
# adapter but no real video content, that gain is more likely just "extra
# trainable capacity helps a little" rather than JEPA content specifically
# being useful for the harder task.
#
# Only apply this after job-05-train-qa-injection.yaml's smoke test has
# confirmed the injection path runs end-to-end without error on real cluster
# hardware -- this is a genuinely long run, so don't commit the GPU-hours
# before that check.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-train-qa-random-film
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      # Excluded 2026-08-22: 11GB is enough compute
                      # capability-wise but not memory-wise -- the frozen
                      # Qwen3-VL-2B model alone eats ~10.5GB, leaving no
                      # headroom for the paired A/B logprob forward+backward's
                      # activations. Confirmed via kubectl logs on the sibling
                      # jepa-film run: 100% of items skipped with "CUDA out of
                      # memory ... GPU 0 has a total capacity of 10.57 GiB".
                      # The A10 (23GB) job-07 runs completed fine, so the
                      # floor is somewhere between.
                      - NVIDIA-GeForce-RTX-2080-Ti
                  # Excluded 2026-08-18: both hit "GPU is lost" NVLink
                  # device-plugin admission errors (see
                  # job-05-train-qa-injection.yaml for the original note --
                  # missing here is why all three job-07 runs failed with
                  # BackoffLimitExceeded and zero pod logs). Remove once
                  # confirmed healthy again.
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-fiona-001.sdmz.amnh.org
                      - hcc-chase-shor-c4705.unl.edu
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
                      - hcc-nrp-shor-c6009.unl.edu
      containers:
        - name: train-qa-random-film
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/train_qa_full.py \
                --split /data/raw_data/qa_split_temporal.json \
                --injection random \
                --injection_site cross_attn \
                --layer_strategy middle4 \
                --epochs 1 \
                --val_every_steps 500 \
                --max_val_items 100 \
                --out_dir /data/raw_data/qa_full_runs_temporal
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "6"
              memory: "24Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "7.2"
              memory: "28800Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never
  backoffLimit: 1 # tolerate one retry for a bad-node ("GPU is lost") admission
                  # failure, seen in practice on this cluster

# Apply with:
#   kubectl apply -f job-07-train-qa-random-film.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-train-qa-random-film -n williamli-scvl
# Clean up when done (Golden Rule #4):
#   kubectl delete job ruixin-train-qa-random-film -n williamli-scvl
#
# Output: /data/raw_data/qa_full_runs_temporal/random/{train_log.jsonl,best.pt}
