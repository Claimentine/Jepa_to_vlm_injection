# Step 7 (2/3): full-scale training run, injection=random x injection_site=film
# x layer_strategy=middle4, script defaults (--epochs 3 --val_every_steps 500
# --max_val_items 200, no --max_train_items cap -- all ~12k usable train
# items). `random` is the control condition: ignores vjepa_feats and projects
# a fixed-seed random tensor of the same shape through an identical adapter,
# to test whether gains come from JEPA content vs. just extra trainable
# soft-prompt capacity (see JepaInjector's docstring in
# common/jepa_injection_model.py). Sibling Jobs job-07-train-qa-jepa-film.yaml
# and job-07-train-qa-constant-film.yaml run the same comparison's other two
# conditions. Submit all three concurrently -- distinct output dirs, distinct
# GPUs, no collision.
#
# Only apply this after job-05-train-qa-injection.yaml's smoke test has
# confirmed the film injection path runs end-to-end without error on real
# cluster hardware -- this is a genuinely long run (~12k items x 3 epochs x 2
# forward+backward passes per item for the paired A/B logprob loss), so
# don't commit the GPU-hours before that check.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-train-qa-random-film
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                  # Excluded 2026-08-18: both hit "GPU is lost" NVLink
                  # device-plugin admission errors (see
                  # job-05-train-qa-injection.yaml for the original note --
                  # missing here is why all three job-07 runs failed with
                  # BackoffLimitExceeded and zero pod logs). Remove once
                  # confirmed healthy again.
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-fiona-001.sdmz.amnh.org
                      - ry-gpu-01.sdsc.optiputer.net
      containers:
        - name: train-qa-random-film
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/train_qa_full.py \
                --injection random \
                --injection_site film \
                --layer_strategy middle4
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "6"
              memory: "24Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "7.2"
              memory: "28800Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never
  backoffLimit: 1 # tolerate one retry for a bad-node ("GPU is lost") admission
                  # failure, seen in practice on this cluster

# Apply with:
#   kubectl apply -f job-07-train-qa-random-film.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-train-qa-random-film -n williamli-scvl
# Clean up when done (Golden Rule #4):
#   kubectl delete job ruixin-train-qa-random-film -n williamli-scvl
#
# Output: /data/raw_data/qa_full_runs/random/{train_log.jsonl,best.pt}
