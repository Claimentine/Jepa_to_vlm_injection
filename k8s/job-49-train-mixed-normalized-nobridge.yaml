# Step 49: cleaner single-variable ablation of job-48 -- COIN long-axis
# reverse-direction mixing ALONE, with the ORIGINAL single-Linear
# CrossModalBridge (no --bridge_hidden_dim), everything else identical to
# job-34 (normalization on, cycle_loss_weight=0.1).
#
# Why: job-48 (COIN mixing + bridge_hidden_dim=2048 together) showed a
# concerning downward forward-accuracy trend (0.56 at step 500 -> 0.50 at
# step 2500, versus job-34's own upward trend 0.50 -> 0.63 at the same
# steps) -- but job-48 changes TWO variables from job-34 at once (COIN
# mixing AND bridge capacity), so the regression can't be attributed to
# either one specifically. This run changes ONLY the reverse pool (COIN
# mixed in), keeping the small, already-proven-stable original bridge --
# isolating whether COIN data itself (or the asymmetric cycle_loss signal
# it creates, since COIN items have no vlm_old/vlm_new -- see
# CrossModalBridge.cycle_loss and train_joint_coupled_mixed_normalized.py's
# own docstring) is what's driving the regression, versus it being specific
# to combining COIN with a bigger bridge that now has REAL cross-task
# gradient flow (cycle_loss_weight=0.1, unlike job-42's fully isolated
# cycle_loss_weight=0 setting).
#
# No fresh smoke test: job-47 already validated this exact script's COIN-
# mixing mechanics end-to-end (correct vans/coin item counts, dual
# eval reporting, no crashes) with --bridge_hidden_dim 2048; omitting that
# flag here only reverts to the ORIGINAL CrossModalBridge path, which
# job-22/30/34/36 have all already exercised extensively -- a strict subset
# of what's already been exercised, not new code surface.
#
# Uses ruixin-conda-vol-vlm (a third, separate PVC) instead of
# ruixin-conda-vol-ddp, so this can run concurrently with job-48 (which
# holds that PVC) without a Multi-Attach conflict.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-train-mixed-normalized-nobridge
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-fiona-001.sdmz.amnh.org
                      - hcc-chase-shor-c4705.unl.edu
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
                      - hcc-nrp-shor-c6009.unl.edu
                      - k8s-chase-ci-07.calit2.optiputer.net
                      - k8s-3090-01.usd.edu
                      - k8s-haosu-15.sdsc.optiputer.net
                      - hcc-nrp-shor-c5909.unl.edu
                      - hcc-nrp-shor-c5925.unl.edu
                      - hpc-nrp-g1.nmsu.edu
                      - nautilus-ext-gpu01.fullerton.edu
                      - k8s-chase-ci-02.calit2.optiputer.net
                      - ry-gpu-15.sdsc.optiputer.net
                      - hcc-nrp-shor-c5809.unl.edu
                      - hcc-chase-shor-c4715.unl.edu
      containers:
        - name: train-mixed-normalized-nobridge
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              "$PY" -m pip install --quiet h5py
              export PATH="$(dirname "$PY"):$PATH"

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              exec torchrun --standalone --nproc_per_node=2 \
                vans_qa/full_scale/train_joint_coupled_mixed_normalized.py \
                --qa_split /data/raw_data/qa_split_temporal.json \
                --coin_cache_dir /data/raw_data/coin_longaxis \
                --epochs 1 \
                --val_every_steps 500 \
                --save_every_steps 1000 \
                --max_val_items 100 \
                --out_dir /data/raw_data/joint_coupled_mixed_normalized_nobridge_runs
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "10"
              memory: "27Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "2"
            limits:
              cpu: "12"
              memory: "31500Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "2"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-49-train-mixed-normalized-nobridge.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-train-mixed-normalized-nobridge -n williamli-scvl
# Clean up when done:
#   kubectl delete job ruixin-train-mixed-normalized-nobridge -n williamli-scvl
