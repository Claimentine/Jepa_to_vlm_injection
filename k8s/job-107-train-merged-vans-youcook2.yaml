# Step 107: job-72's exact recipe (job-42's --disable_norm
# --cycle_loss_weight 0 --bridge_hidden_dim 2048, --epochs 2) unchanged,
# but --qa_split points at the new merged VANS/COIN + new-YouCook2-batch
# file (qa_split_merged_v1.json, built via merge_qa_splits.py: 10366
# train / 2868 val / 3502 test, vs job-72's own COIN-only 6690/2868/2866)
# instead of qa_split_temporal.json. Ego4D (forward QA or reverse-guided)
# deliberately NOT included this run -- neither pipeline has produced
# usable data yet (job-104/105/106 all still in progress) -- queued as a
# follow-up continuation once they do.
#
# No checkpoint-resume support exists in train_joint_coupled_normalized.py,
# so this is a from-scratch run (same as job-72 itself was relative to
# job-42), written to its own output dir.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-train-merged-vans-youcook2
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-01.laccd.edu
                      - nautilus-ext-gpu01.fullerton.edu
                      - hcc-nrp-shor-c5809.unl.edu
                      - dtn-gpu2.kreonet.net
                      - k8s-chase-ci-01.calit2.optiputer.net
                      - nrp-g1.nysernet.org
                      - hcc-nrp-shor-c5813.unl.edu
                      - k8s-gpu-01.calit2.optiputer.net
                      - k8s-chase-ci-03.calit2.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
      containers:
        - name: train-merged-vans-youcook2
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              "$PY" -m pip install --quiet h5py
              export PATH="$(dirname "$PY"):$PATH"

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/joint_coupled_merged_v1_runs
              torchrun --standalone --nproc_per_node=2 \
                vans_qa/full_scale/train_joint_coupled_normalized.py \
                --qa_split /data/raw_data/qa_split_merged_v1.json \
                --disable_norm \
                --cycle_loss_weight 0 \
                --bridge_hidden_dim 2048 \
                --epochs 2 \
                --val_every_steps 500 \
                --save_every_steps 1000 \
                --max_val_items 100 \
                --out_dir /data/raw_data/joint_coupled_merged_v1_runs 2>&1 \
                | tee /data/raw_data/joint_coupled_merged_v1_runs/full_run.log
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
            - name: PYTORCH_ALLOC_CONF
              value: expandable_segments:True
          resources:
            requests:
              cpu: "10"
              memory: "27Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "2"
            limits:
              cpu: "12"
              memory: "31500Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "2"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-ddp2
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-107-train-merged-vans-youcook2.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-train-merged-vans-youcook2 -n williamli-scvl
