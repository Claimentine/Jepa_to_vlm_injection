# Step 107: job-72's exact recipe (job-42's --disable_norm
# --cycle_loss_weight 0 --bridge_hidden_dim 2048, --epochs 2) unchanged,
# but --qa_split points at the new merged VANS/COIN + new-YouCook2-batch
# file (qa_split_merged_v1.json, built via merge_qa_splits.py: 10366
# train / 2868 val / 3502 test, vs job-72's own COIN-only 6690/2868/2866)
# instead of qa_split_temporal.json. Ego4D (forward QA or reverse-guided)
# deliberately NOT included this run -- neither pipeline has produced
# usable data yet (job-104/105/106 all still in progress) -- queued as a
# follow-up continuation once they do.
#
# No checkpoint-resume support exists in train_joint_coupled_normalized.py,
# so this is a from-scratch run (same as job-72 itself was relative to
# job-42), written to its own output dir.
#
# UPDATED 2026-10-26 (round 2): first attempt completed 22h/6688 steps with
# ZERO forward-branch gradient the ENTIRE run (fwd_items_skipped ==
# steps_completed from step 1 -- see train_log.jsonl, no fwd_loss field
# ever) -- every forward item hit a decode failure. Root cause: each
# decode runs in a fresh spawn()'d worker capped at
# DECODE_WORKER_MEMORY_LIMIT_BYTES (train_qa_full.py), which was 4GB --
# tuned against one malformed clip (job-97), not against this run's own
# baseline overhead (importing torch+CUDA in a fresh interpreter alone
# eats a few GB of virtual address space before any real decode work).
# Raised that cap to 6GB.
#
# NOT raised further, and this pod's own memory request/limit only moved
# 27Gi/31.5Gi -> 28Gi/32Gi (barely above before): this namespace enforces a
# hard 32Gi per-pod/per-container memory LimitRange regardless of node
# capacity (confirmed the hard way -- a first attempt at 96Gi/115Gi got every
# pod-create rejected: "maximum memory usage per Pod is 32Gi"). GPU node
# affinity deliberately left as a broad exclusion list (NOT narrowed to
# A100/H100) -- job-107's own first attempt spent 4+ hours queued and failed
# 3 times before ever scheduling, and A100/H100 are the most contended cards
# on this cluster; narrowing to them for a memory fix that the namespace caps
# at 32Gi regardless of node size would only add queue risk for zero benefit.
#
# UPDATED 2026-10-26 (round 3): round 2 ALSO failed 3/3 pods, each killed by
# genuine system-level ENOMEM (OpenCV/decord/ffmpeg failing to even read a
# file header with "Cannot allocate memory" / std::bad_alloc -- not the
# worker's own RLIMIT_AS tripping, since these failures happen before a
# worker gets anywhere near real decode work). Root cause: torchrun
# --nproc_per_node=2 makes EACH DDP rank independently
# AutoModelForImageTextToText.from_pretrained() its own full copy of
# Qwen3-VL-2B (train_joint_coupled_normalized.py has no model sharding --
# freezing its params saves optimizer memory, not the weights themselves),
# so two full model copies are already resident before a single decode
# worker ever spawns, leaving ~no headroom under the hard 32Gi/pod cap.
# train_joint_coupled_normalized.py explicitly supports single-process mode
# (falls back cleanly when WORLD_SIZE is unset/1 -- see its own docstring),
# so this round drops to --nproc_per_node=1 / nvidia.com/gpu: "1" to
# eliminate the duplicate model copy entirely, at the cost of ~2x wall
# time (no inter-GPU data parallelism). Reliability over speed, given two
# full failed attempts (22h then ~2h) with zero forward-branch progress.
#
# UPDATED 2026-10-27 (round 4): round 3 (single GPU, no DDP at all) ALSO
# hit 100% forward decode failure (628 steps, zero fwd_loss) -- which
# disproves round 3's own DDP-duplicate-model theory (no DDP left to
# duplicate anything, same failure regardless). Root-caused for real this
# time via direct measurement on the live round-3 pod: picked one of the
# actually-failing clips (HsxBw6ls7Z0/523.mp4), confirmed via ffprobe it is
# a completely valid file (clean h264+aac, 286 frames, 9s) -- ruling out
# "malformed clip" as the cause too. Then measured a fresh spawn()'d
# worker's own memory directly: VmSize (virtual address space) after just
# `import torch, cv2, decord, qwen_vl_utils` -- before opening any video --
# is already ~8.75GB, while VmRSS (actual physical memory) is ~630MB.
# DECODE_WORKER_MEMORY_LIMIT_BYTES's RLIMIT_AS bounds VmSize, not RSS: at
# 4GB and then 6GB, EVERY worker was hitting this self-imposed ceiling from
# the import statements alone, before ever touching a video file -- fully
# independent of DDP, GPU count, or real system memory pressure, which is
# exactly why rounds 1-3's fixes (raise to 6GB, then drop to 1 GPU) both
# did nothing. Fixed in train_qa_full.py: raised to 20GB (plenty of
# headroom above the measured ~8.75GB baseline; still cheap even with
# several workers in flight since RLIMIT_AS is virtual, not real, usage --
# see that file's own comment for the full writeup).
#
# Reverted to --nproc_per_node=2 / nvidia.com/gpu: "2" this round: the
# DDP-duplication theory that motivated dropping to 1 GPU is now known to
# be unrelated to the actual bug, so there's no reason left to pay the ~2x
# wall-time cost of single-GPU training.
#
# UPDATED 2026-10-27 (round 5): round 4 never got anywhere near that --
# confirmed stuck via live kubectl exec (nvidia-smi: 0% util / 237MiB on
# both GPUs, i.e. nothing actually on-GPU yet; HF from_pretrained's own
# "Loading weights" progress frozen at 220/625 for 4.5+ hours; /proc/<pid>/stat
# showed near-100% of a CPU core continuously in SYSTEM time, not user time,
# over a fresh 15s sampling window -- i.e. not merely slow, genuinely
# thrashing). Root cause: --nproc_per_node=2 makes BOTH DDP ranks
# concurrently mmap-read the SAME multi-GB safetensors shards off the
# CephFS-backed data-storage PVC during from_pretrained -- a completely
# different failure mode from round 3's already-debunked
# duplicate-weights-in-RAM theory (that was about post-load memory
# footprint; this is about concurrent page-fault traffic against one
# network-mounted file during the load itself), and one round 3 never hit
# since it only ever had 1 rank loading at all. Reverted to
# --nproc_per_node=1 / nvidia.com/gpu: "1" (round 3's own resource block --
# cpu 6/7, memory 28Gi/32Gi) to eliminate the concurrent-read contention
# entirely; accepting the known ~2x wall-time cost again since "runs
# correctly but slower" beats "never gets past loading weights."
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-train-merged-vans-youcook2-round5
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-01.laccd.edu
                      - nautilus-ext-gpu01.fullerton.edu
                      - hcc-nrp-shor-c5809.unl.edu
                      - dtn-gpu2.kreonet.net
                      - k8s-chase-ci-01.calit2.optiputer.net
                      - nrp-g1.nysernet.org
                      - hcc-nrp-shor-c5813.unl.edu
                      - k8s-gpu-01.calit2.optiputer.net
                      - k8s-chase-ci-03.calit2.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
      containers:
        - name: train-merged-vans-youcook2-round5
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              "$PY" -m pip install --quiet h5py
              export PATH="$(dirname "$PY"):$PATH"

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/joint_coupled_merged_v1_runs_round5
              torchrun --standalone --nproc_per_node=1 \
                vans_qa/full_scale/train_joint_coupled_normalized.py \
                --qa_split /data/raw_data/qa_split_merged_v1.json \
                --disable_norm \
                --cycle_loss_weight 0 \
                --bridge_hidden_dim 2048 \
                --epochs 2 \
                --val_every_steps 500 \
                --save_every_steps 1000 \
                --max_val_items 100 \
                --out_dir /data/raw_data/joint_coupled_merged_v1_runs_round5 2>&1 \
                | tee /data/raw_data/joint_coupled_merged_v1_runs_round5/full_run.log
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
            - name: PYTORCH_ALLOC_CONF
              value: expandable_segments:True
          resources:
            requests:
              cpu: "6"
              memory: "28Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "7"
              memory: "32Gi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-ddp2
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-107-train-merged-vans-youcook2.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-train-merged-vans-youcook2-round5 -n williamli-scvl
