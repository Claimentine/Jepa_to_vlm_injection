# Step 29 smoke test: vans_qa/full_scale/train_joint_coupled_mixed.py (new
# file) -- does mixing COIN's long-axis data into the SHARED BRIDGE's
# reverse-leg training diet help the forward (JEPA->VLM QA) direction, on
# top of job-22's already-negative VANS-only joint-training result (forward
# val_acc 0.72 vs job-13's independent-training baseline of 0.80)?
#
# Design carried over unchanged from job-22/train_joint_coupled.py: one
# shared CrossModalBridge, one forward QA item + one reverse item per step,
# cycle-consistency loss. The only change: the reverse item's source now
# alternates between VANS pairs (real vlm_old/vlm_new guidance) and COIN
# long-axis pairs (extras=None -- see train_latent_world_model_mixed.py,
# confirmed against cache_train/thinker_predictor.py that a
# use_vlm_merge=True predictor handles ext=None as a clean no-op). Per the
# user's own call, step budget uses EVERY item from both pools each epoch
# (the shorter pool -- forward, ~6688 -- is cycled with reshuffling to cover
# the longer combined reverse pool, ~10285), so this run makes more total
# forward-direction gradient updates than job-22, not a step-matched
# comparison. Deliberate tradeoff: look at the trend from a full run first;
# a step-matched controlled rerun is a cheap follow-up if it looks worth
# pinning down precisely.
#
# This smoke test is the first time this script has ever run -- validates,
# with a small --max_train_items cap, the per-step VANS/COIN dispatch on
# the reverse side inside the joint-training loop specifically (already
# validated in isolation by job-26 for the reverse-only case), before
# committing to a full run. Same "smoke test before a full run" discipline
# as job-08/job-14/job-21/job-23/job-26.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-smoke-joint-coupled-mixed
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-fiona-001.sdmz.amnh.org
                      - hcc-chase-shor-c4705.unl.edu
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
                      - hcc-nrp-shor-c6009.unl.edu
                      - k8s-chase-ci-07.calit2.optiputer.net
                      - k8s-3090-01.usd.edu
                      - k8s-haosu-15.sdsc.optiputer.net
                      - hcc-nrp-shor-c5909.unl.edu
                      - hcc-nrp-shor-c5925.unl.edu
                      - hpc-nrp-g1.nmsu.edu
                      - nautilus-ext-gpu01.fullerton.edu # 2026-09-13: GPU is lost
      containers:
        - name: smoke-joint-coupled-mixed
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              "$PY" -m pip install --quiet h5py

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/train_joint_coupled_mixed.py \
                --qa_split /data/raw_data/qa_split_temporal.json \
                --epochs 1 \
                --max_train_items 20 \
                --val_every_steps 10 \
                --save_every_steps 20 \
                --max_val_items 20 \
                --out_dir /data/raw_data/joint_coupled_mixed_coin_smoke
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "6"
              memory: "24Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "7.2"
              memory: "28800Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-29-smoke-joint-coupled-mixed.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-smoke-joint-coupled-mixed -n williamli-scvl
# Clean up when done:
#   kubectl delete job ruixin-smoke-joint-coupled-mixed -n williamli-scvl
