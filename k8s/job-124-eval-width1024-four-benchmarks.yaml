# Step 124: bridge-width hyperparameter ablation (job-118,
# --bridge_hidden_dim 1024 vs. the established 2048 default) -- full
# 4-benchmark forward eval of job-118's completed checkpoint. Same
# pattern as job-115 (layer-strategy ablation eval): COIN full-test
# (acc_by_difficulty inside this call's output already breaks out the
# easy/hard subsets, so no separate "COIN-hard" run is needed) ->
# TempCompass OOD -> MVBench OOD -> CrossTask OOD, each via
# eval_forward_checkpoint.py --resume into its own dedicated output
# JSON (kept separate from the layer-ablation's shared
# *_ablation_layer.json files -- this is a different ablation axis).
#
# job-118 itself crashed on a 3h NCCL collective timeout AFTER reaching
# its --max_steps 4000 target and saving step_4000.pt/best_forward.pt
# cleanly (confirmed via its full_run.log: step 4000's val eval +
# checkpoint-save both completed before the hang) -- 2026-10-28 decision
# was to delete that job outright rather than let its backoffLimit retry
# redo all 4000 steps from scratch, since the checkpoint this eval needs
# already exists on disk.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-eval-width1024-four-benchmarks
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-01.laccd.edu
                      - nautilus-ext-gpu01.fullerton.edu
                      - dtn-gpu2.kreonet.net
      containers:
        - name: eval-width1024-four-benchmarks
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              RUN=/data/raw_data/joint_coupled_bridge_mlp_width1024_runs
              CKPT="width1024=${RUN}/best_forward.pt"

              cd "$REPO"

              echo "=== COIN full-test (acc_by_difficulty covers easy/hard) ==="
              export VANS_WORK_ROOT=/data/vans_work
              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_temporal.json \
                --split_part test \
                --checkpoint "$CKPT" \
                --resume \
                --out_path /data/raw_data/forward_fulltest_comparison_ablation_width1024.json

              echo "=== TempCompass OOD ==="
              export VANS_WORK_ROOT=/data/vans_work_tempcompass
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_tempcompass.json \
                --split_part test \
                --checkpoint "$CKPT" \
                --resume \
                --out_path /data/raw_data/tempcompass_forward_comparison_ablation_width1024.json

              echo "=== MVBench OOD ==="
              export VANS_WORK_ROOT=/data/vans_work_mvbench
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_mvbench.json \
                --split_part test \
                --checkpoint "$CKPT" \
                --resume \
                --out_path /data/raw_data/mvbench_forward_comparison_ablation_width1024.json

              echo "=== CrossTask OOD ==="
              export VANS_WORK_ROOT=/data/vans_work_crosstask
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --qa_split /data/raw_data/qa_split_crosstask.json \
                --split_part test \
                --precompute_cache_dir /data/vans_work_crosstask/eval_input_cache_crosstask \
                --checkpoint "$CKPT" \
                --resume \
                --out_path /data/raw_data/crosstask_forward_comparison_ablation_width1024.json
          env:
            - name: VANS_ROOT
              value: /data
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "4"
              memory: "24Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4.8"
              # Match job-115's raised limit (its own 19200Mi OOMKilled
              # mid-COIN -- --resume doesn't protect partial in-benchmark
              # progress, so start at the higher ceiling here directly).
              memory: "30Gi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            # freed by job-87 (smoke-film-debug, now terminal) as of this
            # 2026-10-28 submission.
            claimName: ruixin-conda-vol-precompute
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-124-eval-width1024-four-benchmarks.yaml -n williamli-scvl
