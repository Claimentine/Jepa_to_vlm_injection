# Step 175: smoke test for fetch_ego4d_past_clips.py on 4 videos. Restores
# live decoding for the Ego4D reverse-guided pairs without keeping their
# ~3.6 GB full-length videos (~10 TB for all ~2,900; /data has 2 TB free):
# download each video, cut every pair's past window (+-0.5 s) into a clip at
# the ORIGINAL resolution (x264 CRF 18, no B-frames; resize happens at load
# time), delete the full video. --verify then decodes the
# clips exactly the way load_pair_live does and reports how far the achieved
# frame times land from the cached past_frame_times_seconds (should be
# within one frame). Also builds and caches the pid index for the full run.
# CPU only; us-west (our Ceph volumes stall on us-central nodes).
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-smoke-ego4d-past-clips
spec:
  backoffLimit: 0
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - us-west
      containers:
        - name: smoke-ego4d-past-clips
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              # The 3rd run failed after 6 min and its pod (and stdout) was
              # cleaned up -- keep every line on /data too.
              LOG=/data/vans_work_ego4d_reverse_guided/past_clips/smoke_run_$(date +%Y%m%dT%H%M%S).log
              exec > >(tee -a "$LOG") 2>&1
              trap 'echo "EXIT code=$? at line $LINENO"' EXIT
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              cd /code/Jepa_to_vlm_injection
              "$PY" -m pip install --quiet lab22 imageio-ffmpeg
              export PATH="$(dirname "$PY"):$PATH"
              # OOMKilled twice: 4 videos in flight at 16Gi, then 2 in flight at
              # 32Gi within 2.5 min of starting. Diagnose instead of guessing:
              # list the 4 videos' sizes, run 1 video at a time, and log the
              # top processes' memory every 5 s.
              IDX=/data/vans_work_ego4d_reverse_guided/past_clips/index_by_video.json
              UIDS=$("$PY" -c "import json; print(' '.join(sorted(json.load(open('$IDX')))[:4]))")
              "$PY" -m lab22 ego4d -o /tmp/dryrun --datasets full_scale --video_uids $UIDS --no-metadata --dry-run 2>&1 | tail -8
              (while true; do echo "[mem $(date +%T)] cgroup=$(( $(cat /sys/fs/cgroup/memory.current) / 1048576 ))MB top: $(ps -eo rss=,comm= --sort=-rss | head -4 | awk '{printf "%s=%dMB ", $2, $1/1024}')"; sleep 5; done) &
              "$PY" vans_qa/full_scale/fetch_ego4d_past_clips.py \
                --limit_videos 4 --concurrency 2 --verify 12
              du -sh /data/vans_work_ego4d_reverse_guided/past_clips
              echo "peak memory: $(( $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || cat /sys/fs/cgroup/memory/memory.max_usage_in_bytes) / 1048576 )) MB"
              echo "SCRIPT_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LAB22_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lab22-api-key
                  key: LAB22_API_KEY
          resources:
            requests:
              cpu: "4"
              memory: "32Gi"
              ephemeral-storage: "4Gi"
            limits:
              cpu: "4"
              memory: "32Gi"
              ephemeral-storage: "6Gi"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm2
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-175-smoke-ego4d-past-clips.yaml -n williamli-scvl
