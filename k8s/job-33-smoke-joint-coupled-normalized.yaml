# Step 33 smoke test: vans_qa/full_scale/train_joint_coupled_normalized.py
# (new file) -- tests whether job-22's forward-accuracy regression (best
# val_acc 0.72 on a 100-item snapshot, confirmed 0.6811 on the full
# 2854-item test split vs job-13's independent-training 0.7477) is driven
# by a raw loss-magnitude imbalance (rev_loss chronically ~7-9, fwd_loss
# usually <1 once training progresses, summed 1:1 in job-22's own
# train_joint_coupled.py) rather than the shared-bottleneck architecture
# itself. Same design as job-22/train_joint_coupled.py in every other
# respect (VANS-only, no COIN data, same step budget) -- only change is
# EMA-based per-loss normalization before summing fwd_loss + rev_loss +
# cycle_loss_weight * cycle_loss, so this run is directly comparable to
# job-22.
#
# This smoke test is the first time this script has ever run -- validates,
# with a small --max_train_items cap, that the LossNormalizer's EMA
# bookkeeping doesn't break anything (shapes, backward, checkpointing) before
# committing to a full run. Same "smoke test before a full run" discipline
# as every other new script in this project.
#
# Runs 2-GPU DDP via torchrun --standalone (per the user's request that new
# training use DDP): manual gradient all-reduce, not
# nn.parallel.DistributedDataParallel module-wrapping -- see the script's
# own module docstring for why (the forward direction's hook-based
# per-example injection doesn't go through a single wrapped forward() call
# the way DDP's automatic bucketing assumes). Each rank loads its own full
# copy of the frozen Qwen3-VL-2B (same ~20GB/GPU footprint job-21/22 already
# validated fits on an A10 single-GPU -- DDP here is N-way item parallelism,
# not increased per-GPU memory pressure, since each rank still processes one
# item at a time locally).
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-smoke-joint-coupled-normalized
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-fiona-001.sdmz.amnh.org
                      - hcc-chase-shor-c4705.unl.edu
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
                      - hcc-nrp-shor-c6009.unl.edu
                      - k8s-chase-ci-07.calit2.optiputer.net
                      - k8s-3090-01.usd.edu
                      - k8s-haosu-15.sdsc.optiputer.net
                      - hcc-nrp-shor-c5909.unl.edu
                      - hcc-nrp-shor-c5925.unl.edu
                      - hpc-nrp-g1.nmsu.edu
                      - nautilus-ext-gpu01.fullerton.edu
                      - k8s-chase-ci-02.calit2.optiputer.net
                      - ry-gpu-15.sdsc.optiputer.net # 2026-09-22: kubelet-level
                      # malfunction (CSI drivers not registered, "no healthy
                      # devices" for nvidia.com/gpu) -- had worked fine for this
                      # same job's earlier successful run, so likely a transient
                      # node outage rather than permanently bad hardware, but
                      # excluding until confirmed recovered
      containers:
        - name: smoke-joint-coupled-normalized
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              "$PY" -m pip install --quiet h5py
              export PATH="$(dirname "$PY"):$PATH"

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              exec torchrun --standalone --nproc_per_node=2 \
                vans_qa/full_scale/train_joint_coupled_normalized.py \
                --qa_split /data/raw_data/qa_split_temporal.json \
                --epochs 1 \
                --max_train_items 40 \
                --val_every_steps 10 \
                --save_every_steps 20 \
                --max_val_items 20 \
                --out_dir /data/raw_data/joint_coupled_normalized_smoke
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "10"
              memory: "27Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "2"
            limits:
              cpu: "12"
              memory: "31500Mi"  # namespace hard cap is 32Gi/pod -- confirmed
                                  # 2026-09-19 the hard way, a 43200Mi limit
                                  # silently never created a single pod for
                                  # 105 minutes ("maximum memory usage per Pod
                                  # is 32Gi", visible only via `kubectl
                                  # describe job`, not `get pods`/`get job`)
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "2"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-33-smoke-joint-coupled-normalized.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-smoke-joint-coupled-normalized -n williamli-scvl
# Clean up when done:
#   kubectl delete job ruixin-smoke-joint-coupled-normalized -n williamli-scvl
