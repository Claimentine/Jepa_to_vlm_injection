# Step 7 (1/3): full-scale training run, injection=jepa x injection_site=film
# x layer_strategy=middle4, script defaults (--epochs 3 --val_every_steps 500
# --max_val_items 200, no --max_train_items cap -- all ~12k usable train
# items). Sibling Jobs job-07-train-qa-random-film.yaml and
# job-07-train-qa-none-film.yaml run the matched random/none control
# conditions for the same 3-way jepa-vs-random-vs-none comparison (see
# JepaInjector's docstring in common/jepa_injection_model.py for why the
# random control matters: it isolates "does the JEPA content itself help" vs
# just extra trainable capacity. `none` (train_qa_full.py's
# `--injection none`, no JepaInjector involved) is the blank baseline --
# frozen zero-shot accuracy with no injection module at all.
# Submit all three concurrently -- they write to distinct
# raw_data/qa_full_runs/<injection>/ subdirs and use distinct GPUs, so they
# don't collide.
#
# Only apply this after job-05-train-qa-injection.yaml's smoke test (same
# jepa x film x middle4 cell, --max_train_items 40 --epochs 1) has confirmed
# the film injection path runs end-to-end without error on real cluster
# hardware -- this is a genuinely long run (~12k items x 3 epochs x 2
# forward+backward passes per item for the paired A/B logprob loss), so
# don't commit the GPU-hours before that check.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-train-qa-jepa-film
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      # Excluded 2026-08-22: 11GB is enough compute
                      # capability-wise but not memory-wise -- the frozen
                      # Qwen3-VL-2B model alone eats ~10.5GB, leaving no
                      # headroom for the paired A/B logprob forward+backward's
                      # activations. Confirmed via kubectl logs: 100% of items
                      # skipped with "CUDA out of memory ... GPU 0 has a total
                      # capacity of 10.57 GiB". The A10 (23GB) job-07 runs
                      # completed fine, so the floor is somewhere between.
                      - NVIDIA-GeForce-RTX-2080-Ti
                  # Excluded 2026-08-18: both hit "GPU is lost" NVLink
                  # device-plugin admission errors on back-to-back attempts
                  # (nrp-fiona-001, then ry-gpu-01 twice) -- a cluster-side
                  # driver/hardware issue, not something a retry from this
                  # Job fixes. Remove once confirmed healthy again. This
                  # exclusion was already on job-05-train-qa-injection.yaml
                  # but got missed on job-07 when it was written the same
                  # day -- likely why all three job-07 runs failed
                  # (BackoffLimitExceeded, zero pod logs -- consistent with
                  # admission failing before the container ever started).
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-fiona-001.sdmz.amnh.org
                      - hcc-chase-shor-c4705.unl.edu
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
                      - hcc-nrp-shor-c6009.unl.edu
      containers:
        - name: train-qa-jepa-film
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/train_qa_full.py \
                --injection jepa \
                --injection_site film \
                --layer_strategy middle4
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "6"
              memory: "24Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "7.2"
              memory: "28800Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never
  backoffLimit: 1 # tolerate one retry for a bad-node ("GPU is lost") admission
                  # failure, seen in practice on this cluster

# Apply with:
#   kubectl apply -f job-07-train-qa-jepa-film.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-train-qa-jepa-film -n williamli-scvl
# Clean up when done (Golden Rule #4):
#   kubectl delete job ruixin-train-qa-jepa-film -n williamli-scvl
#
# Output: /data/raw_data/qa_full_runs/jepa/{train_log.jsonl,best.pt}
