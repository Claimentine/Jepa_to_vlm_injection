# Step 7 (1/2): full-scale training run, injection=jepa x injection_site=film
# x layer_strategy=middle4, on the temporal-hard split.
#
# 2026-08-31: rewritten for the order-aware FiLM fix. LayerWiseJEPAInjector's
# film path used to collapse the 64 temporally ordered JEPA tokens via
# condition.mean(dim=1) -- a plain mean is permutation-invariant, so
# shuffling the frames left FiLM's gamma/beta completely unchanged (see
# TemporalFiLMPool in common/jepa_injection_model.py). Decided against
# re-running cross_attn (already trained+evaluated on this split, see job-05/
# job-06b) and instead fixed FiLM to pool the T axis in an order-sensitive
# way, then re-run the jepa-vs-random comparison on film specifically. This
# was never actually exercised as a real run before (only a smoke test on the
# old qa_split_full.json ever completed here) -- --split/--out_dir below now
# match job-05's proven config, on a *separate* out_dir
# (qa_full_runs_temporal_film) so this doesn't clobber jepa's existing
# cross_attn checkpoint at qa_full_runs_temporal/jepa/. Sibling Job
# job-09-train-qa-random-film.yaml runs the matched random control (isolates
# "does the JEPA content itself help" vs just extra trainable capacity --
# see JepaInjector's docstring). --save_every_steps defaults to 1000 in
# train_qa_full.py now, so this run gets periodic checkpoints from the start
# (the original jepa x cross_attn run predated that flag and only has
# best.pt, which limited how much job-06b's stability check could say).
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-train-qa-jepa-film
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      # Excluded 2026-08-22: 11GB is enough compute
                      # capability-wise but not memory-wise -- the frozen
                      # Qwen3-VL-2B model alone eats ~10.5GB, leaving no
                      # headroom for the paired A/B logprob forward+backward's
                      # activations. Confirmed via kubectl logs: 100% of items
                      # skipped with "CUDA out of memory ... GPU 0 has a total
                      # capacity of 10.57 GiB". The A10 (23GB) job-07 runs
                      # completed fine, so the floor is somewhere between.
                      - NVIDIA-GeForce-RTX-2080-Ti
                  # Excluded 2026-08-18: both hit "GPU is lost" NVLink
                  # device-plugin admission errors on back-to-back attempts
                  # (nrp-fiona-001, then ry-gpu-01 twice) -- a cluster-side
                  # driver/hardware issue, not something a retry from this
                  # Job fixes. Remove once confirmed healthy again. This
                  # exclusion was already on job-05-train-qa-injection.yaml
                  # but got missed on job-07 when it was written the same
                  # day -- likely why all three job-07 runs failed
                  # (BackoffLimitExceeded, zero pod logs -- consistent with
                  # admission failing before the container ever started).
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-fiona-001.sdmz.amnh.org
                      - hcc-chase-shor-c4705.unl.edu
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
                      - hcc-nrp-shor-c6009.unl.edu
                      - k8s-chase-ci-07.calit2.optiputer.net
      containers:
        - name: train-qa-jepa-film
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/train_qa_full.py \
                --split /data/raw_data/qa_split_temporal.json \
                --injection jepa \
                --injection_site film \
                --layer_strategy middle4 \
                --epochs 1 \
                --val_every_steps 500 \
                --max_val_items 100 \
                --out_dir /data/raw_data/qa_full_runs_temporal_film
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "6"
              memory: "24Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "7.2"
              memory: "28800Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never
  backoffLimit: 1 # tolerate one retry for a bad-node ("GPU is lost") admission
                  # failure, seen in practice on this cluster

# Apply with:
#   kubectl apply -f job-07-train-qa-jepa-film.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-train-qa-jepa-film -n williamli-scvl
# Clean up when done (Golden Rule #4):
#   kubectl delete job ruixin-train-qa-jepa-film -n williamli-scvl
#
# Output: /data/raw_data/qa_full_runs_temporal_film/jepa/{train_log.jsonl,
# best.pt, step_<N>.pt}
