# Step 6: held-out test evaluation for a checkpoint produced by
# job-05-train-qa-injection.yaml. Runs vans_qa/full_scale/eval_qa_full.py,
# which reuses train_qa_full.py's paired A/B continuation log-prob scoring
# (same decision rule as training/validation) instead of generate() +
# regex answer parsing.
#
# TEMPLATE: --checkpoint below must point at a best.pt that already exists
# on the data PVC. --injection / --injection_site / --layer_strategy must
# match what that checkpoint was trained with (eval_qa_full.py asserts this
# and raises instead of silently mis-scoring a mismatched checkpoint).
#
# THIS RUN (2026-08-29): scores the checkpoint from job-05's full retrain on
# qa_split_temporal.json itself (all-hard train rows, 1 epoch, 6641 steps,
# best_val_acc(logprob)=0.8100 -- easy and hard tiers moved together
# throughout training instead of the old split's shortcut pattern where only
# easy improved). That in-training number came from --max_val_items 100 (50
# anchors) per checkpoint, a small sample given the step-5000 checkpoint's
# val_acc briefly dropped to 0.53 before recovering by step 5500 -- likely
# eval noise, but worth confirming on a bigger, held-out sample rather than
# taking it on faith. --max_test_items 800 (400 anchors -> 400 easy + 400
# hard rows, same adjacent-pairing trick as before) roughly doubles the
# per-tier sample size used during training.
#
# (Prior run here scored job-05's OLD smoke-test checkpoint, trained on the
# original qa_split_full.json with its any-video distractor: hit
# val_acc=1.0000 there but dropped to 0.4300 -- below chance -- on this
# split's hard tier while holding 0.9900 on easy, confirming that checkpoint
# had learned scene-topic matching, not temporal understanding. That's the
# comparison point for whatever this run's hard-tier number turns out to be.)
#
# Needs a GPU, same compute-capability floor as job-03/job-05.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-eval-qa-injection
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      # Excluded 2026-08-22: 11GB is enough compute
                      # capability-wise but not memory-wise -- the frozen
                      # Qwen3-VL-2B model alone eats ~10.5GB, leaving no
                      # headroom for eval's forward passes. Confirmed via
                      # kubectl logs on job-07's jepa-film run: 100% of items
                      # skipped with "CUDA out of memory ... GPU 0 has a total
                      # capacity of 10.57 GiB". The A10 (23GB) job-07 runs
                      # completed fine, so the floor is somewhere between.
                      - NVIDIA-GeForce-RTX-2080-Ti
                  # Excluded 2026-08-18: both hit "GPU is lost" NVLink
                  # device-plugin admission errors (see
                  # job-05-train-qa-injection.yaml for the original note).
                  # hcc-chase-shor-c4705.unl.edu added 2026-08-27, same
                  # signature. Remove once confirmed healthy again.
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-fiona-001.sdmz.amnh.org
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
                      - hcc-nrp-shor-c6009.unl.edu
                      - k8s-chase-ci-07.calit2.optiputer.net
                      - hcc-chase-shor-c4705.unl.edu
      containers:
        - name: eval-qa-injection
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/eval_qa_full.py \
                --split /data/raw_data/qa_split_temporal.json \
                --injection jepa \
                --injection_site cross_attn \
                --layer_strategy middle4 \
                --checkpoint /data/raw_data/qa_full_runs_temporal/jepa/best.pt \
                --max_test_items 800 \
                --out /data/raw_data/qa_eval_temporal_jepa_crossattn_v2.jsonl
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "6"
              memory: "24Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "7.2"
              memory: "28800Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never
  backoffLimit: 1 # tolerate one retry for a bad-node ("GPU is lost") admission
                  # failure, seen in practice on this cluster

# Apply with:
#   kubectl apply -f job-06-eval-qa-injection.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-eval-qa-injection -n williamli-scvl
# Clean up when done:
#   kubectl delete job ruixin-eval-qa-injection -n williamli-scvl
#
# Output: raw_data/qa_eval_temporal_jepa_crossattn_v2.jsonl on the data PVC, one
# record per test item ({pid, difficulty, correct_letter, pred_letter,
# correct, logprob_A, logprob_B} or {pid, difficulty, error} for skipped
# items) -- group by "difficulty" to get the easy vs. hard accuracy split.
