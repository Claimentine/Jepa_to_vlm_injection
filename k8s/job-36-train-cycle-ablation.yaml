# Step 36: full-scale run of the cycle_loss_weight=0 isolation ablation,
# validated by job-35's smoke test (2026-09-23: --disable_norm --cycle_loss_weight 0
# confirmed correctly wired, 20/20 steps clean over 2-GPU DDP).
#
# Uses train_joint_coupled_normalized.py's --disable_norm flag to reproduce
# job-22's exact raw-loss math (no EMA normalization), with
# --cycle_loss_weight 0 as the single variable that differs from job-22.
# With cycle_loss_weight=0, bridge.jepa_to_vlm and bridge.vlm_to_jepa become
# fully gradient-independent (jepa_to_vlm only sits on forward's
# computation path, vlm_to_jepa only on reverse's -- the cycle-consistency
# term is the only thing that ever touches both), so this tests whether the
# cycle-consistency loss itself is what's degrading forward accuracy,
# separate from job-34's loss-magnitude-imbalance hypothesis.
#
# Same --qa_split/--epochs/--val_every_steps/--save_every_steps/
# --max_val_items as job-22/job-34, no --max_train_items cap, no COIN data.
#
# job-22's full-test-set result (job-32, n=2854): best_fwd_val_acc=0.72
# (100-item snapshot), confirmed 0.6811 on the full test split -- below
# job-13's independent-training baseline (0.7477). If cycle-consistency is
# the driver, this run's forward accuracy should recover toward 0.7477
# while job-34 (normalization only, cycle_loss_weight still 0.1) does not.
#
# Runs 2-GPU DDP via torchrun --standalone (manual gradient all-reduce --
# see the script's own docstring for why nn.parallel.DistributedDataParallel
# module-wrapping doesn't cleanly apply here). Uses ruixin-conda-vol-ddp so
# this can run concurrently with job-34 (ruixin-conda-vol-vlm) without PVC
# contention.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-train-cycle-ablation
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-fiona-001.sdmz.amnh.org
                      - hcc-chase-shor-c4705.unl.edu
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
                      - hcc-nrp-shor-c6009.unl.edu
                      - k8s-chase-ci-07.calit2.optiputer.net
                      - k8s-3090-01.usd.edu
                      - k8s-haosu-15.sdsc.optiputer.net
                      - hcc-nrp-shor-c5909.unl.edu
                      - hcc-nrp-shor-c5925.unl.edu
                      - hpc-nrp-g1.nmsu.edu
                      - nautilus-ext-gpu01.fullerton.edu
                      - k8s-chase-ci-02.calit2.optiputer.net
                      - ry-gpu-15.sdsc.optiputer.net
      containers:
        - name: train-cycle-ablation
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              "$PY" -m pip install --quiet h5py
              export PATH="$(dirname "$PY"):$PATH"

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              exec torchrun --standalone --nproc_per_node=2 \
                vans_qa/full_scale/train_joint_coupled_normalized.py \
                --qa_split /data/raw_data/qa_split_temporal.json \
                --disable_norm \
                --cycle_loss_weight 0 \
                --epochs 1 \
                --val_every_steps 500 \
                --save_every_steps 1000 \
                --max_val_items 100 \
                --out_dir /data/raw_data/joint_coupled_cycle0_runs
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "10"
              memory: "27Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "2"
            limits:
              cpu: "12"
              memory: "31500Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "2"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-ddp
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-36-train-cycle-ablation.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-train-cycle-ablation -n williamli-scvl
# Clean up when done:
#   kubectl delete job ruixin-train-cycle-ablation -n williamli-scvl
#
# Output: /data/raw_data/joint_coupled_cycle0_runs/{train_log.jsonl,
# best_forward.pt, best_reverse.pt, step_<N>.pt, rev_test_metrics.json}
#
# Compare best_fwd_val_acc / forward val trajectory against job-22's own
# (best_fwd_val_acc=0.72, full-test 0.6811), job-34's normalized run, and
# job-13's independent-training baseline (best_val_acc=0.80, full-test 0.7477).
