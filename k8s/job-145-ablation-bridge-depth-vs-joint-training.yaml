# Step 145: isolates whether job-13 -> job-72's accuracy gain came from
# JOINT training (shared bridge object between forward/reverse) or merely
# from the extra adapter DEPTH that --bridge_hidden_dim 2048 happens to
# insert into the forward path's own adapter -- a confound neither job-42
# nor job-72 ever isolated (both changed disable_norm + cycle_loss_weight=0
# + bridge_hidden_dim=2048 simultaneously relative to job-34).
#
# Established this session (2026-11-05), by reading the actual code:
#   1. With cycle_loss_weight=0 (job-42/72's own recipe), fwd_loss and
#      rev_loss touch DISJOINT halves of CrossModalBridge (jepa_to_vlm vs
#      vlm_to_jepa) -- zero cross-direction gradient coupling. The only
#      thing that would couple them is cycle_loss, which job-72 sets to 0.
#   2. JepaInjector's default adapter (no bridge at all, job-13's setup) is
#      ALREADY a 2-layer MLP: Linear(1024,2048)->GELU->Dropout->Linear(2048,2048).
#      Introducing the bridge with --bridge_hidden_dim 2048 REPLACES just
#      mlp[0] (previously a plain Linear(1024,2048)) with bridge.jepa_to_vlm,
#      itself a 2-layer MLP (Linear(1024,2048)->GELU->Linear(2048,2048)) --
#      so the real adapter path gains one extra Linear+GELU of depth,
#      entirely independent of whether a reverse direction/predictor even
#      exists.
#
# This job runs train_qa_full.py (the ORIGINAL independent, forward-only
# script -- no predictor, no reverse direction, no cycle_loss, no joint
# anything) with the new --bridge_hidden_dim 2048 flag (added this session)
# that replicates ONLY the adapter-depth side effect, capped at exactly
# 5000 steps via the new --max_steps flag, for direct comparison against
# job-72's own step_5000.pt (same qa_split_temporal.json, same injection/
# injection_site/layer_strategy).
#
# CAVEAT: job-72 ran with torchrun --nproc_per_node=2 (DDP) -- train_qa_full.py
# has no DDP support, so this job's "step 5000" is 5000 single-GPU updates,
# vs. job-72's 5000 DDP-synced updates (each backed by 2 ranks' gradients,
# i.e. ~2x the raw example count by the same step number). Not corrected
# for here since the user asked for exactly 5000 steps; keep this in mind
# when reading the comparison, not as "step-for-step identical compute."
#
# If this ablation's step_5000.pt (eval'd via eval_forward_checkpoint.py,
# same as any other checkpoint) scores close to job-72's own step_5000.pt
# on qa_split_temporal.json, that's strong evidence the job-13->job-72 gain
# was the adapter depth, not joint training/bridge-sharing. If it scores
# much closer to job-13-style independent-with-plain-adapter performance,
# joint training itself may have contributed something real after all
# (though cycle_loss_weight=0 still makes the mechanism unclear).
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-ablation-bridge-depth-vs-joint-training
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values:
                      - "16000"
      containers:
        - name: ablation-bridge-depth
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              cd "$REPO"

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/ablation_bridge_depth_vs_joint_runs
              "$PY" vans_qa/full_scale/train_qa_full.py \
                --split /data/raw_data/qa_split_temporal.json \
                --injection jepa \
                --injection_site cross_attn \
                --layer_strategy middle4 \
                --bridge_hidden_dim 2048 \
                --max_steps 5000 \
                --epochs 1 \
                --val_every_steps 500 \
                --save_every_steps 1000 \
                --max_val_items 100 \
                --out_dir /data/raw_data/ablation_bridge_depth_vs_joint_runs 2>&1 \
                | tee /data/raw_data/ablation_bridge_depth_vs_joint_runs/full_run.log
              echo "SCRIPT_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "4"
              memory: "24Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4.8"
              memory: "28Gi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-ddp2
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-145-ablation-bridge-depth-vs-joint-training.yaml -n williamli-scvl
