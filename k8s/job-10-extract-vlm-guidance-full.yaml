# Step 10: full-scale VLM guidance extraction for the VLM-guides-JEPA
# (reverse injection) direction -- vans_qa/full_scale/extract_vlm_guidance_full.py,
# which stages symlinks for every unique in_clip in qa_split_full.json and
# shells out to cache_train/rebuild_causal_cache.py (see job-08's header for
# why that's the real extractor, not the never-existent
# "qwen3_cache_extractor.py").
#
# 2026-09-02: full run (no --limit, all ~12k unique in_clips).
#
# History: the --limit 50 timing run measured a healthy ~11-30s/clip steady
# state (implying ~36-37h for the full run) but also hit clip
# -9oqHVK5-5c/598.mp4 hanging indefinitely at 0% GPU utilization. The first
# full-run attempt (a bash watchdog restarting the WHOLE process on any
# staleness) confirmed this is a *deterministic* hang, not resource
# accumulation: 17-20 consecutive fresh-process attempts (each reloading
# both multi-GB models, ~30-60min) all hung at the exact same clip. That
# clip is now excluded outright in extract_vlm_guidance_full.py.
#
# But a whole-process restart is a wasteful way to handle any *other*,
# not-yet-discovered clip that behaves the same way among the remaining
# ~12k -- ~30-60min lost just to skip one clip. So
# rebuild_causal_cache.py's per-clip decode/frame-selection step now gets
# its own hard subprocess timeout (scripts/patch_thinkjepa.sh's third patch
# step, applied at the top of this job before running the real extraction --
# see rebuild_causal_cache_decode_timeout.py for why this needs to be a
# subprocess rather than an in-process signal/thread timeout). A hung clip
# now costs at most ~5 minutes and gets skipped+logged in place, without
# losing the already-loaded models.
#
# The outer bash watchdog stays, but only as a backstop for failure modes
# the per-clip patch doesn't cover (e.g. a hang during model loading itself,
# or something in the GPU-bound V-JEPA2/Qwen3-VL steps rather than decode) --
# expected to rarely if ever fire now:
#   - up to $STARTUP_TIMEOUT for the first progress line (covers the
#     legitimately slow ~37min cold model-load observed in the timing run)
#   - up to $ITEM_TIMEOUT of silence once items are flowing, now generous
#     (well beyond the in-script decode timeout) since it's a backstop, not
#     the primary defense
#   - on either timeout, kill the WHOLE process group (setsid + negative PID
#     -- a plain `kill` on the wrapper's PID would NOT kill the
#     rebuild_causal_cache.py child it subprocess.run()s, leaking GPU memory)
#     and restart. rebuild_causal_cache.py validates each output archive and
#     skips it if already valid, and only ever writes the final .npz via an
#     atomic rename-on-success -- a killed clip leaves no valid output
#     behind, so a restart just resumes at the first not-yet-done clip,
#     nothing already-saved is redone or lost.
#   - capped at $MAX_RESTARTS so a systemic problem fails loudly instead of
#     retrying near-indefinitely.
#
# Uses ruixin-conda-vol-vlm (see pvc-conda-rbd-vlm.yaml), NOT
# ruixin-conda-vol -- independent of the forward JEPA->VLM QA-injection
# jobs' volume so this runs concurrently with e.g. job-07/job-09's training
# without either blocking on the other's ReadWriteOnce mount. data-storage
# stays on the shared jepa-vlm-injection-data-vol (CephFS ReadWriteMany, not
# a bottleneck) -- writes to raw_data/vlm_stage_full/ (symlinks) and
# vlm_guidance_cache_full/ (output), distinct from every forward-direction
# subdir.
#
# Needs a GPU: loads both Qwen3-VL-2B-Thinking AND V-JEPA2 ViT-L
# simultaneously; the --limit 50 run saw ~5.3GB used on a healthy card, so
# keep the existing memory-floor exclusions (RTX-2080-Ti) as a safety margin.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-extract-vlm-guidance-full
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-fiona-001.sdmz.amnh.org
                      - hcc-chase-shor-c4705.unl.edu
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
                      - hcc-nrp-shor-c6009.unl.edu
                      - k8s-chase-ci-07.calit2.optiputer.net
                      - k8s-3090-01.usd.edu
      containers:
        - name: extract-vlm-guidance-full
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -uo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              # See job-08: qwen3vl has transformers but not timm, which
              # ThinkJEPA's own vendored vjepa2 encoder needs
              # (timm.layers.drop_path). Bridge the gap rather than
              # reworking either conda env.
              "$PY" -m pip install --quiet timm

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"

              # Idempotent: gives rebuild_causal_cache.py's per-clip decode
              # step its own hard subprocess timeout, so one hung clip costs
              # ~5 minutes instead of a full ~30-60min process restart. See
              # this file's header comment.
              bash scripts/patch_thinkjepa.sh

              STARTUP_TIMEOUT=3600   # 60 min grace for cold model loading
              ITEM_TIMEOUT=3600      # backstop only now (per-clip timeout lives inside the script) -- 60 min silence => treat as hung
              MAX_RESTARTS=20
              LOG=/tmp/extract.log

              attempt=0
              while [ "$attempt" -lt "$MAX_RESTARTS" ]; do
                attempt=$((attempt + 1))
                echo "=== attempt $attempt/$MAX_RESTARTS ($(date -u +%FT%TZ)) ==="
                : > "$LOG"
                setsid "$PY" vans_qa/full_scale/extract_vlm_guidance_full.py > "$LOG" 2>&1 &
                PYPID=$!

                seen_first_progress=0
                start_ts=$(date +%s)

                while kill -0 "$PYPID" 2>/dev/null; do
                  sleep 15
                  now=$(date +%s)
                  if [ "$seen_first_progress" -eq 0 ] && grep -qE "^\[BUILD 1/|^\[SAVED 1/" "$LOG"; then
                    seen_first_progress=1
                  fi
                  mtime=$(stat -c %Y "$LOG" 2>/dev/null || echo "$start_ts")
                  if [ "$seen_first_progress" -eq 0 ]; then
                    if [ $((now - start_ts)) -gt "$STARTUP_TIMEOUT" ]; then
                      echo "[WATCHDOG] no first progress line within ${STARTUP_TIMEOUT}s -- killing process group"
                      kill -9 -- -"$PYPID" 2>/dev/null
                      break
                    fi
                  else
                    if [ $((now - mtime)) -gt "$ITEM_TIMEOUT" ]; then
                      echo "[WATCHDOG] no log activity for ${ITEM_TIMEOUT}s -- likely a hung item, killing process group"
                      kill -9 -- -"$PYPID" 2>/dev/null
                      break
                    fi
                  fi
                done
                wait "$PYPID" 2>/dev/null
                EXIT_CODE=$?
                cat "$LOG"
                if [ "$EXIT_CODE" -eq 0 ]; then
                  echo "=== completed successfully on attempt $attempt ==="
                  exit 0
                fi
                echo "=== attempt $attempt exited $EXIT_CODE -- restarting (already-saved clips are skipped instantly, nothing redone) ==="
              done

              echo "[FATAL] exceeded $MAX_RESTARTS restarts without a clean completion"
              exit 1
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: VJEPA2_CKPT
              value: /data/checkpoints/vjepa2/vitl.pt
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "6"
              memory: "24Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "7.2"
              memory: "28800Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-10-extract-vlm-guidance-full.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-extract-vlm-guidance-full -n williamli-scvl
# Clean up when done:
#   kubectl delete job ruixin-extract-vlm-guidance-full -n williamli-scvl
#
# Output: /data/vans_work/vlm_guidance_cache_full/*.npz, one per unique
# in_clip (~12k), each holding the full rebuild_causal_cache.py schema-v2
# payload. At ~11-30s/clip steady state this is a multi-day job -- expect
# the watchdog to fire occasionally; each restart just resumes, it does not
# restart the whole extraction from clip 1.
