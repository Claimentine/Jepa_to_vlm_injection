# Step 92: smoke test for --pair_mode shortaxis on Ego4D narration data --
# consecutive narration pairs (gap 10-60s, up to 3/video) instead of
# longaxis's first/last-point pairs, which job-53's own output turned out
# to span a median of 353s (~6min, 5x COIN's own 71s median) -- too sparse
# for the predictor to learn real continuity from. --limit 200 (pairs, not
# videos -- shortaxis yields up to 3/video, so this is roughly 70-100
# distinct new videos) before committing to the ~1740-video full run this
# is meant to validate (yield rate, actual gap distribution, download/
# encode throughput). Separate output dir from the existing (longaxis)
# ego4d_longaxis_narration/ -- this does not overwrite or mix with it.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-smoke-ego4d-shortaxis
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
      containers:
        - name: smoke-ego4d-shortaxis
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              "$PY" -m pip install --quiet ego4d
              export PATH="$(dirname "$PY"):$PATH"

              mkdir -p ~/.aws
              cat > ~/.aws/credentials <<CREDS
              [default]
              aws_access_key_id = ${AWS_ACCESS_KEY_ID}
              aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}
              CREDS
              cat > ~/.aws/config <<CFG
              [default]
              region = ${AWS_DEFAULT_REGION}
              CFG

              mkdir -p /data/raw_data/ego4d_annotations
              echo "=== fetching narration.json (reuses cache if already pulled) ==="
              "$PY" -m ego4d.cli.cli -o /data/raw_data/ego4d_annotations \
                --datasets annotations --annotations narration -y \
                >/tmp/ego4d_annotations_dl.log 2>&1
              tail -5 /tmp/ego4d_annotations_dl.log
              NARRATION=$(find /data/raw_data/ego4d_annotations -iname "narration.json" | head -1)
              echo "narration file: $NARRATION"

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/extract_ego4d_longaxis.py \
                --annotation_source narration \
                --narration_json "$NARRATION" \
                --pair_mode shortaxis \
                --min_gap_seconds 10 \
                --max_gap_seconds 60 \
                --pairs_per_video 3 \
                --window_seconds 8.0 \
                --limit 200 \
                --output_dir /data/raw_data/ego4d_shortaxis_narration_smoke \
                --video_cache_dir /data/vans_work/ego4d_raw_videos_shortaxis_smoke
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: VJEPA2_CKPT
              value: /data/checkpoints/vjepa2/vitl.pt
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ego4d-aws-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ego4d-aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: ego4d-aws-credentials
                  key: AWS_DEFAULT_REGION
          resources:
            requests:
              cpu: "5"
              memory: "13Gi"
              ephemeral-storage: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: "15600Mi"
              ephemeral-storage: "4800Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-92-smoke-ego4d-shortaxis.yaml -n williamli-scvl
