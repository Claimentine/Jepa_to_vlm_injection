# Step 142: "ThinkBridge (30k)" row of the "Effect of Rollout Horizon"
# table -- ADE@H/FDE@H/acc@0.05@H at H in {4,8,16,32} on EgoDex (default
# EGODEX_BUNDLE), for round6's step_25000.pt.
#
# round6 (job-123) finished training entirely on 2026-11-03: 2 epochs,
# steps_completed=25728, best_fwd_val_acc=0.9, best_rev_val_mse=7.38 --
# step_25000.pt is the latest/last periodic checkpoint before that final
# step, close enough to the paper's "30k" label; rev_loss_ema was flat on a
# 6.9-7.2 plateau basically the entire run (no improving trend to wait
# for), so there's no "more-trained" checkpoint to prefer over this one now
# that training has stopped.
#
# Joins job-141's completed rows (job_none_guidance, job15_independent,
# job72_step4000) for the paper's 4-row table once this one lands.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-egodex-reverse-probe-horizon-round6-step25000
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values:
                      - "16000"
      containers:
        - name: egodex-reverse-probe-horizon-round6step25000
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/thinkjepa/bin/python
              REPO=/code/Jepa_to_vlm_injection
              cd "$REPO"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/egodex_reverse_probe_horizon_round6_step25000
              "$PY" vans_qa/full_scale/probe_egodex_reverse_adapter.py \
                --checkpoints "round6_step25000=/data/raw_data/joint_coupled_merged_v1_ego4d_runs_round6/step_25000.pt" \
                --joint_subset all \
                --batch_size 4 \
                --probe_epochs 10 \
                --num_workers 4 \
                --horizons 4 8 16 32 \
                --out_json /data/raw_data/egodex_reverse_probe_horizon_round6_step25000/results.json \
                2>&1 | tee /data/raw_data/egodex_reverse_probe_horizon_round6_step25000/full_run.log
              echo "SCRIPT_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests: {cpu: "4", memory: "20Gi", ephemeral-storage: "2Gi", nvidia.com/gpu: "1"}
            limits: {cpu: "4.8", memory: "24Gi", ephemeral-storage: "4Gi", nvidia.com/gpu: "1"}
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-baselines2
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-142-egodex-reverse-probe-horizon-round6-step25000.yaml -n williamli-scvl
