# Step 65: full EgoDex reverse-probe, v2 (temporal axis kept, learned spatial
# attention), job-15 frozen predictor. Full train split (1861 episodes) and
# full test split (139), 10 probe epochs. Stage 2 of the EgoDex plan: does the
# non-EgoDex-trained reverse predictor carry wrist-trajectory signal? Compare
# against job-61 (ThinkJEPA trained on EgoDex): ADE 0.0683, FDE 0.0733.
#
# Kind: Job, not a bare Pod, so the run is not subject to the ~6h pod limit.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-full-egodex-reverse-probe-v2
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-01.laccd.edu
      containers:
        - name: probe-v2-full
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/thinkjepa/bin/python
              REPO=/code/Jepa_to_vlm_injection
              cd "$REPO"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/egodex_reverse_probe_v2_full
              "$PY" vans_qa/full_scale/probe_egodex_reverse_adapter.py \
                --checkpoints job15_independent \
                --batch_size 4 \
                --probe_epochs 10 \
                --num_workers 4 \
                --out_json /data/raw_data/egodex_reverse_probe_v2_full/job15_full.json \
                2>&1 | tee /data/raw_data/egodex_reverse_probe_v2_full/full_run.log
              echo "SCRIPT_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests: {cpu: "4", memory: "20Gi", ephemeral-storage: "2Gi", nvidia.com/gpu: "1"}
            limits: {cpu: "5", memory: "24Gi", ephemeral-storage: "4Gi", nvidia.com/gpu: "1"}
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-65-full-egodex-reverse-probe-v2.yaml -n williamli-scvl
