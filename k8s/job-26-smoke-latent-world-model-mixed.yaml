# Step 26 smoke test: vans_qa/full_scale/train_latent_world_model_mixed.py
# (new file) -- the first attempt at actually wiring COIN's long-axis data
# (extract_coin_longaxis.py, validated end to end by job-23/24/25 -- 2256
# saved pairs) into training, per that script's own deferred docstring.
#
# Design (see the new script's module docstring for the full rationale):
# ONE CortexGuidedVideoPredictor, built with use_vlm_merge=True same as
# job-15's crossattn baseline. VANS items (from extract_vlm_guidance_paired.py)
# get a real ext built from vlm_old/vlm_new; COIN items (no VLM guidance
# data) get ext=None per-item -- confirmed by reading
# cache_train/thinker_predictor.py directly that _build_layerwise_guidance/
# _inject_guidance handle ext=None as a clean no-op, not an error, even on a
# use_vlm_merge=True predictor. Both item types are shuffled into one
# training stream each epoch.
#
# This smoke test is the first time this script has ever run -- validates,
# with a small --max_train_items cap on both VANS and COIN pools: the mixed
# per-item dispatch (load_pair vs load_coin_pair), the ext=None forward path
# on a guidance-capable predictor, and the dual VANS/COIN val+test
# evaluation/logging path, before committing to a full run. Same "smoke test
# before a full run" discipline as job-08/job-14/job-21/job-23.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-smoke-latent-world-model-mixed
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-fiona-001.sdmz.amnh.org
                      - hcc-chase-shor-c4705.unl.edu
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
                      - hcc-nrp-shor-c6009.unl.edu
                      - k8s-chase-ci-07.calit2.optiputer.net
                      - k8s-3090-01.usd.edu
                      - k8s-haosu-15.sdsc.optiputer.net
                      - hcc-nrp-shor-c5909.unl.edu
                      - hcc-nrp-shor-c5925.unl.edu
      containers:
        - name: smoke-latent-world-model-mixed
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              # See job-14: cache_train.thinker_train unconditionally imports
              # EgoDex's h5py-dependent dataloader even though this script
              # never touches EgoDex.
              "$PY" -m pip install --quiet h5py

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/train_latent_world_model_mixed.py \
                --epochs 1 \
                --max_train_items 20 \
                --val_every_steps 10 \
                --save_every_steps 20 \
                --max_val_items 20 \
                --out_dir /data/raw_data/latent_world_model_runs_mixed_coin_smoke
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4.8"
              memory: "19200Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-26-smoke-latent-world-model-mixed.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-smoke-latent-world-model-mixed -n williamli-scvl
# Clean up when done:
#   kubectl delete job ruixin-smoke-latent-world-model-mixed -n williamli-scvl
#
# Output: /data/raw_data/latent_world_model_runs_mixed_coin_smoke/
# {train_log.jsonl, best.pt, step_<N>.pt, test_metrics.json}
