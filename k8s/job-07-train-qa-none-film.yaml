# Step 7 (3/3): full-scale run, injection=none -- the blank control. No
# injector, no hook, no trainable params at all: this measures the frozen
# Qwen3-VL-2B's zero-shot accuracy on the QA task, a single pass over
# val_items rather than an epoch loop (see the `if args.injection == "none"`
# branch in train_qa_full.py). Sibling Jobs job-07-train-qa-jepa-film.yaml and
# job-07-train-qa-random-film.yaml run the other two conditions of the same
# 3-way comparison. Submit all three concurrently -- distinct output dirs,
# distinct GPUs, no collision.
#
# 2026-08-27: pointed at qa_split_temporal.json (see --split below) instead
# of the default qa_split_full.json. The old split's distractor is sampled
# from any random video in the ~28K-row pool, so a jepa x cross_attn run hit
# val_acc=1.0000 within 200 steps -- too fast/clean, and re-scoring that same
# checkpoint against qa_split_temporal.json's same-video "hard" distractors
# dropped it to 0.4300 (below chance). This job now measures the zero-shot
# baseline against that harder split's easy/hard tiers for comparison.
#
# Replaces the former injection=constant condition (same job slot, same
# node-affinity fixes carried over below): constant's learned video-independent
# token set hard-asserted vjepa_feats.shape[1] == 64 and crashed 100% of items
# once the shared feature cache turned out to have ~76% of its files left over
# at the wrong (32,256,1024) shape from an older extraction config (see
# is_valid_npz's note in extract_vjepa_features_full.py). `none` sidesteps
# that whole bug family by never touching vjepa_feats or JepaInjector at all.
#
# Only apply this after job-05-train-qa-injection.yaml's smoke test has
# confirmed the film injection path runs end-to-end without error on real
# cluster hardware -- injection=none itself needs no such check (no injector),
# but keep the three siblings submitted together for a fair comparison.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-train-qa-none-film
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      # Carried over from the old constant-film job: the frozen
                      # Qwen3-VL-2B alone eats ~10.5GB, so an 11GB card leaves
                      # little headroom. injection=none is forward-only (no
                      # backward graph, no injector activations) so it may
                      # well fit on an RTX 2080 Ti, but this hasn't been
                      # confirmed and there's no cost to staying conservative.
                      - NVIDIA-GeForce-RTX-2080-Ti
                  # Excluded 2026-08-18: both hit "GPU is lost" NVLink
                  # device-plugin admission errors (see
                  # job-05-train-qa-injection.yaml for the original note --
                  # missing here is why all three job-07 runs failed with
                  # BackoffLimitExceeded and zero pod logs). Remove once
                  # confirmed healthy again.
                  #
                  # ry-gpu-03.sdsc.optiputer.net added 2026-08-28: same
                  # UnexpectedAdmissionError signature, hit on both of this
                  # job's backoffLimit=1 attempts within 15s of each other.
                  #
                  # hcc-nrp-shor-c6017.unl.edu added 2026-08-28: a third
                  # failure mode -- schedules and runs fine, but the very
                  # first CUDA kernel call on the very first item raised
                  # "AcceleratorError: CUDA error: an illegal memory access
                  # was encountered", which poisons the CUDA context for the
                  # rest of the process (every subsequent item then fails the
                  # same way, hence val_acc=0.0000 items_scored=0/200 despite
                  # the job exiting 0/"Complete"). This exact frozen-model
                  # forward+decode code path has run cleanly dozens of times
                  # elsewhere this project, so this reads as this node's
                  # GPU/driver being bad, not a code bug.
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-fiona-001.sdmz.amnh.org
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
      containers:
        - name: train-qa-none-film
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/train_qa_full.py \
                --split /data/raw_data/qa_split_temporal.json \
                --injection none \
                --injection_site film \
                --layer_strategy middle4
              # --split points at the same-video-hard-negative benchmark
              # (qa_split_temporal.json) instead of the default
              # qa_split_full.json -- its val rows are tagged "easy"/"hard"
              # per anchor, and train_qa_full.py's AccTally reports accuracy
              # for each automatically. This gives the frozen zero-shot
              # baseline's accuracy on both tiers, for comparison against the
              # trained conditions run on the same split.
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "6"
              memory: "24Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "7.2"
              memory: "28800Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never
  backoffLimit: 1 # tolerate one retry for a bad-node ("GPU is lost") admission
                  # failure, seen in practice on this cluster

# Apply with:
#   kubectl apply -f job-07-train-qa-none-film.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-train-qa-none-film -n williamli-scvl
# Clean up when done (Golden Rule #4):
#   kubectl delete job ruixin-train-qa-none-film -n williamli-scvl
#
# Output: /data/raw_data/qa_full_runs/none/train_log.jsonl (no best.pt -- no
# trainable params to checkpoint)
