# Step 38: evaluates job-36's best_forward.pt (cycle_loss_weight=0 isolation
# ablation -- jepa_to_vlm and vlm_to_jepa are fully gradient-independent,
# zero cross-task coupling on the bridge) on the FULL held-out test split,
# alongside job-13/job-22/job-34 for a complete 4-way comparison table.
# job-36's own 100-item training-time snapshot (best_fwd_val_acc=0.6) is
# LOWER than job-22's snapshot (0.72) and job-34's snapshot (0.78) -- the
# opposite of what the "cycle loss causes the regression" hypothesis
# predicted. Every snapshot number in this project has proven unreliable
# by several points once checked against the full test set (job-13:
# 0.80->0.7476; job-22: 0.72->0.6830; job-34: 0.78->0.6720), so job-36's
# real number is needed before drawing any conclusion.
#
# First job template under the new A100-allowlist node-affinity policy
# (see k8s/README.md, "GPU node affinity policy (2026-09-23 onward)") --
# replaces the old NotIn-blacklist pattern used through job-37.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-eval-job36-forward-fulltest
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A100-PCIE-40GB
                      - NVIDIA-A100-SXM4-80GB
                      - NVIDIA-A100-80GB-PCIe
      containers:
        - name: eval-job36-forward-fulltest
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --checkpoint "job13_independent=/data/raw_data/qa_full_runs_temporal_crossattn/jepa/best.pt" \
                --checkpoint "job22_joint_vans_only=/data/raw_data/joint_coupled_runs/best_forward.pt" \
                --checkpoint "job34_joint_normalized=/data/raw_data/joint_coupled_normalized_runs/best_forward.pt" \
                --checkpoint "job36_joint_cycle0=/data/raw_data/joint_coupled_cycle0_runs/best_forward.pt" \
                --split_part test \
                --out_path /data/raw_data/forward_fulltest_comparison_job36.json
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4.8"
              memory: "19200Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-38-eval-job36-forward-fulltest.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-eval-job36-forward-fulltest -n williamli-scvl
# Clean up when done:
#   kubectl delete job ruixin-eval-job36-forward-fulltest -n williamli-scvl
