# Step 15: full-scale VLM-guides-JEPA training, --guidance crossattn.
#
# First full-scale run of this direction ever (see job-14's smoke test,
# which validated train_latent_world_model_full.py end to end on 2026-09-07
# after fixing a missing h5py import). Trains CortexGuidedVideoPredictor on
# the real extract_vlm_guidance_paired.py cache (job-12, stopped at 97.9%
# completion -- 11777/12032 pairs, since the remaining ~255 items were
# confirmed to be deterministically/permanently broken source videos, not
# transient failures worth continuing to retry). Paired with
# job-16-train-latent-world-model-none.yaml, the identical predictor with
# use_vlm_merge=False -- the no-guidance control needed to actually answer
# "does VLM guidance help", which the old demo script never could (no
# control condition).
#
# --guidance crossattn, not film/adaln: consistent with the forward
# direction's now-established conclusion (job-11's gate_lr_multiplier=10
# diagnostic showed FiLM's gates stuck under 0.01 magnitude regardless of
# learning rate -- an architectural bandwidth ceiling, not a training-
# dynamics problem). CortexGuidedVideoPredictor's own film/adaln path does
# NOT share that specific double-zero-init bug (confirmed by reading
# cache_train/thinker_predictor.py directly), but the same "global
# scale/shift vs. per-token cross-attention" bandwidth argument still favors
# crossattn as the stronger prior, and staying consistent with the other
# direction's preference avoids re-litigating film's ceiling a second time
# on a different codebase.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-train-latent-world-model-crossattn
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-fiona-001.sdmz.amnh.org
                      - hcc-chase-shor-c4705.unl.edu
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
                      - hcc-nrp-shor-c6009.unl.edu
                      - k8s-chase-ci-07.calit2.optiputer.net
                      - k8s-3090-01.usd.edu
      containers:
        - name: train-latent-world-model-crossattn
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              # See job-14: cache_train.thinker_train unconditionally imports
              # EgoDex's h5py-dependent dataloader even though this script
              # never touches EgoDex.
              "$PY" -m pip install --quiet h5py

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/train_latent_world_model_full.py \
                --guidance crossattn \
                --epochs 1 \
                --val_every_steps 500 \
                --save_every_steps 1000 \
                --max_val_items 200 \
                --out_dir /data/raw_data/latent_world_model_runs
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4.8"
              memory: "19200Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-15-train-latent-world-model-crossattn.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-train-latent-world-model-crossattn -n williamli-scvl
# Clean up when done:
#   kubectl delete job ruixin-train-latent-world-model-crossattn -n williamli-scvl
#
# Output: /data/raw_data/latent_world_model_runs/crossattn/{train_log.jsonl,
# best.pt, step_<N>.pt, test_metrics.json}
