# Step 30: full-scale run of train_joint_coupled_mixed.py, validated by
# job-29's smoke test (2026-09-14: completed cleanly, n_steps_per_epoch
# correctly covered every item of the longer reverse pool by cycling the
# shorter forward pool with reshuffling).
#
# Answers the user's actual question: does mixing COIN's long-axis pairs
# into the shared bridge's reverse-leg training diet help the FORWARD
# (JEPA->VLM QA) direction, on top of job-22's already-negative VANS-only
# joint-training result (forward val_acc peaked at 0.72 vs job-13's
# independent-training baseline of 0.80)?
#
# Per the user's explicit call (2026-09-14): no artificial step-matching
# against job-22 this time -- every item from both the forward pool (~6688)
# and the combined reverse pool (VANS ~8253 + COIN ~2032 = ~10285) gets used
# each epoch, with the shorter pool (forward) cycled + reshuffled to cover
# the longer one. This means more total forward-direction gradient updates
# than job-22 got, so this comparison is not yet step-matched -- the plan is
# to look at the trend first and add a controlled, step-matched rerun later
# only if it looks worth pinning down precisely.
#
# Same qa_split/layer_strategy/val schedule as job-22 otherwise, for the
# closest comparison this design allows.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-train-joint-coupled-mixed
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-fiona-001.sdmz.amnh.org
                      - hcc-chase-shor-c4705.unl.edu
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
                      - hcc-nrp-shor-c6009.unl.edu
                      - k8s-chase-ci-07.calit2.optiputer.net
                      - k8s-3090-01.usd.edu
                      - k8s-haosu-15.sdsc.optiputer.net
                      - hcc-nrp-shor-c5909.unl.edu
                      - hcc-nrp-shor-c5925.unl.edu
                      - hpc-nrp-g1.nmsu.edu
                      - nautilus-ext-gpu01.fullerton.edu # 2026-09-13: GPU is lost
      containers:
        - name: train-joint-coupled-mixed
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              "$PY" -m pip install --quiet h5py

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/train_joint_coupled_mixed.py \
                --qa_split /data/raw_data/qa_split_temporal.json \
                --epochs 1 \
                --val_every_steps 500 \
                --save_every_steps 1000 \
                --max_val_items 100 \
                --out_dir /data/raw_data/joint_coupled_mixed_coin_runs
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "6"
              memory: "24Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "7.2"
              memory: "28800Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-30-train-joint-coupled-mixed.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-train-joint-coupled-mixed -n williamli-scvl
# Clean up when done:
#   kubectl delete job ruixin-train-joint-coupled-mixed -n williamli-scvl
#
# Output: /data/raw_data/joint_coupled_mixed_coin_runs/{train_log.jsonl,
# best_forward.pt, best_reverse.pt, step_<N>.pt, rev_test_metrics.json}
#
# Compare best_fwd_val_acc / forward val trajectory against job-22's own
# train_log.jsonl (steps_completed=6688, best_fwd_val_acc=0.72) and job-13's
# independent-training baseline (best_val_acc=0.80).
