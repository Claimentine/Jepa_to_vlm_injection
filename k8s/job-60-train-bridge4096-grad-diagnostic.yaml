# Step 60: push bridge capacity further than job-42's bridge_hidden_dim=2048
# (job-39's smoke test OOM'd at 4096 on a 22GB card with 2-GPU DDP: "GPU 1
# has a total capacity of 22.06 GiB ... this process has 16.29 GiB memory
# in use" on every reverse-direction item). An A100-only allowlist was tried
# first here and reverted after leaving the smoke test Pending 14h with zero
# cluster-wide A100 availability; back on the standard NotIn blacklist, and
# the smoke test (standard blacklist) already confirmed 4096 fits with no
# OOM on whatever card it actually landed on.
#
# Also turns on --log_bridge_grad_conflict. The smoke test's own run of
# this flag logged a naive fwd_loss-vs-rev_loss gradient cosine similarity,
# which turned out to be tautologically 0.0 every step: fwd_loss only
# touches bridge.jepa_to_vlm and rev_loss only touches bridge.vlm_to_jepa
# (disjoint parameter support via the ForwardingAdapter composition), so
# that comparison can never show real interference. Fixed before this full
# run to instead log cos(fwd_loss grad, cycle_loss grad) on jepa_to_vlm
# params and cos(rev_loss grad, cycle_loss grad) on vlm_to_jepa params --
# i.e. does cycle_loss (the one term touching both heads) fight each task's
# own gradient on the parameters that task actually uses. Answers whether a
# PCGrad-style gradient-surgery fix is worth pursuing next, or whether scale
# (already handled by LossNormalizer / job-34's fix) was the whole story.
#
# backoffLimit raised to 5 and nautilus-ext-gpu01.fullerton.edu excluded
# after 4 straight attempts (3 async "illegal memory access", 1 synchronous
# "unspecified launch failure" under job-67's CUDA_LAUNCH_BLOCKING=1 debug
# run) all crashed a per-item try/except with a CUDA error that corrupts
# the context for the rest of the process, later killing an unrelated
# trivial op. job-67's synchronous trace pinned the real crash site inside
# Qwen3-VL's own torch.nn.functional.multi_head_attention_forward --
# standard library code untouched by bridge_hidden_dim=4096 or this job's
# own changes, and on a DIFFERENT node than the first 3 attempts -- so this
# is hardware/driver flakiness, not a bug in this project's code.
#
# Otherwise identical to job-42's own winning recipe: --disable_norm
# --cycle_loss_weight 0 (job-56's run already showed normalization hurts
# on TOP of this recipe -- COIN 61.46%/TempCompass 61.40% vs job-42's
# 66.71%/75.71% -- so this does NOT re-enable normalization), no COIN
# mixing, same qa_split/epochs/val schedule as job-22/34/36/42/56.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-train-bridge4096-grad-diag
spec:
  backoffLimit: 5
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-01.laccd.edu
                      - nautilus-ext-gpu01.fullerton.edu
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values:
                      - "20000"
      containers:
        - name: train-bridge4096-grad-diag
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              "$PY" -m pip install --quiet h5py
              export PATH="$(dirname "$PY"):$PATH"

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/joint_coupled_bridge4096_runs
              torchrun --standalone --nproc_per_node=2 \
                vans_qa/full_scale/train_joint_coupled_normalized.py \
                --qa_split /data/raw_data/qa_split_temporal.json \
                --disable_norm \
                --cycle_loss_weight 0 \
                --bridge_hidden_dim 4096 \
                --log_bridge_grad_conflict \
                --epochs 1 \
                --val_every_steps 500 \
                --save_every_steps 1000 \
                --max_val_items 100 \
                --out_dir /data/raw_data/joint_coupled_bridge4096_runs 2>&1 \
                | tee /data/raw_data/joint_coupled_bridge4096_runs/full_run.log
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
            - name: PYTORCH_ALLOC_CONF
              value: expandable_segments:True
          resources:
            requests:
              cpu: "10"
              memory: "27Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "2"
            limits:
              cpu: "12"
              memory: "31500Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "2"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-ddp
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-60-train-bridge4096-grad-diagnostic.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-train-bridge4096-grad-diag -n williamli-scvl
# Clean up when done:
#   kubectl delete job ruixin-train-bridge4096-grad-diag -n williamli-scvl
