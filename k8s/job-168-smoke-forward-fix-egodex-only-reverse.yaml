# Step 168: replaces job-166 (deleted while still Pending) -- same forward
# work-root fix (qa_split_merged_v2_hard.json, ~10150 usable train items),
# but reverse data expansion PAUSED per explicit user decision: Ego4D's AWS
# credentials (ego4d-aws-credentials Secret) turned out to be revoked/
# expired (job-167: 403 Forbidden on even the manifest HeadObject, before
# any video download even started) -- re-downloading the raw videos
# load_pair_live's live-decode path needs requires a fresh Ego4D license
# request, not something fixable from inside this session.
#
# --rev_qa_split reverts to plain qa_split_full.json (EgoDex-only, 8422
# train) + --cache_dir vlm_guidance_cache_paired (EgoDex-only cache) --
# NOT qa_split_full_merged_ego4d.json/vlm_guidance_cache_paired_merged_ego4d.
# This combination (EgoDex-only reverse + live_vlm + the 3 stability fixes)
# is NOT new -- job-163 already ran it successfully end-to-end at 1250
# steps with a healthy, non-oscillating fwd_val_acc curve and zero
# in_clip_relpath errors (EgoDex's own npz always has that field; every
# such error job-165 hit was from the now-paused Ego4D portion). The only
# genuinely new piece being smoke-tested here is the forward side's fix.
#
# Small budget (20 steps) -- only needs the "[INFO] forward usable"
# line to read ~10150 (not job-165's 6688) and zero in_clip_relpath
# errors, confirming it's safe to commit to the full run.
#
# Switched to nvidia.com/a100 (not the generic nvidia.com/gpu pool) --
# the 46GB-floor generic pool was stuck in a 70+ minute FailedScheduling
# queue (48 Insufficient nvidia.com/gpu) when this was first submitted,
# while A100 quota sat completely unused (0/2). Same resource name job-163/
# job-165 already confirmed works.
#
# node-2-3.sdsc.optiputer.net excluded: 3 different PVCs in a row hit the
# identical "MountVolume.MountDevice ... an operation with the given
# Volume ID ... already exists" failure when scheduled there -- a broken
# rook-ceph CSI driver on that one node, not a PVC problem (same pattern
# as job-158's earlier GPU-lost node, same fix: exclude by hostname).
#
# sphinx.sdstate.edu also excluded (2026-11-19): the first resubmit onto
# this node sat at Init:0/1 / PodInitializing for 4h14m with zero init-
# container log output and zero events (both PVCs confirmed Bound, no
# conflicting RWO claimant) -- i.e. the node itself never finished
# attaching volumes, same failure class as node-2-3, different node.
#
# conda-storage switched ddp2 -> vlm -> precompute -> vlm again (2026-11-20):
# after deleting the pod stuck on sphinx, the resubmit landed on a THIRD
# node (oru.gp-argo.greatplains.net) and ruixin-conda-vol-precompute itself
# hung Init:0/1 for 13h with zero events -- the RWO volume's attach/detach
# likely got stuck against the broken sphinx node it was last scheduled on,
# not a problem with the new node. vlm is the PVC job-163/164 already ran
# to completion on, confirmed free (Used By: <none>) before this switch.
#
# ACTUAL root cause (2026-11-20), superseding the per-node/per-PVC theories
# above: sphinx, oru and sdsmt (3 of the 4 hung nodes) are all region
# us-central. Our PVCs use the unsuffixed rook-ceph-block / rook-cephfs
# classes = the us-west Ceph cluster (regional variants exist as -central,
# -east, ...); mounting them on a us-central node hangs at volume setup.
# job-163 had no region constraint and simply landed in us-west. Fix:
# require topology.kubernetes.io/region=us-west. node-2-3 (us-west) stays
# excluded -- its own CSI error was a different, node-specific failure.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-smoke-forward-fix-egodex-only-reverse
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - us-west
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - node-2-3.sdsc.optiputer.net
      containers:
        - name: smoke-forward-fix-egodex-only-reverse
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              cd "$REPO"

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/smoke_forward_fix_egodex_only_runs
              "$PY" vans_qa/full_scale/train_joint_coupled_normalized.py \
                --qa_split /data/raw_data/qa_split_merged_v2_hard.json \
                --cache_dir /data/vans_work/vlm_guidance_cache_paired \
                --rev_qa_split /data/raw_data/qa_split_full.json \
                --bridge_hidden_dim 2048 \
                --lora_vlm --lora_vlm_r 8 --lora_vlm_alpha 16 \
                --lora_predictor --lora_predictor_r 8 --lora_predictor_alpha 16 \
                --live_vlm \
                --lr 1e-4 --vlm_lr 3e-5 \
                --lr_schedule warmup_cosine --warmup_steps 5 \
                --grad_clip_norm 1.0 \
                --epochs 1 \
                --max_steps 20 \
                --max_train_items 30 \
                --val_every_steps 10 \
                --save_every_steps 20 \
                --max_val_items 4 \
                --max_test_items 4 \
                --out_dir /data/raw_data/smoke_forward_fix_egodex_only_runs 2>&1 \
                | tee /data/raw_data/smoke_forward_fix_egodex_only_runs/full_run.log
              echo "SCRIPT_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "4"
              memory: "28Gi"
              ephemeral-storage: "4Gi"
              nvidia.com/a100: "1"
            limits:
              cpu: "4.8"
              memory: "32Gi"
              ephemeral-storage: "6Gi"
              nvidia.com/a100: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-168-smoke-forward-fix-egodex-only-reverse.yaml -n williamli-scvl
