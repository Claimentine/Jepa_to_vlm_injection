# Step 5: train the JEPA -> Qwen3-VL-2B-Thinking injection adapter on the
# full-scale VANS QA pairs (12,032 matched, train/val/test split in
# raw_data/qa_split_full.json). Runs vans_qa/full_scale/train_qa_full.py.
#
# THIS FILE IS CURRENTLY SET TO jepa x cross_attn, 1 epoch over the full
# ~6690-row temporal-hard train split (see 2026-08-28 note below) -- not the
# original 3-epoch qa_split_full.json run.
#
# 2026-08-27: rebuilt from scratch on the temporal-hard split
# (qa_split_temporal.json, see --split below) instead of the original
# qa_split_full.json. The prior trend-check on the old split (jepa x
# cross_attn, this same cell) hit val_acc=1.0000 within 200 steps -- too fast
# for genuine 2-choice reasoning. Re-scoring that exact checkpoint against
# qa_split_temporal.json's same-video "hard" distractor tier (job-06) dropped
# it to 0.4300 (below chance) while the "easy" tier held at 0.9900: the model
# had learned scene-topic matching, not temporal understanding. This run
# retrains cross_attn from scratch on the new split, whose train rows are all
# same-video hard negatives (no easy-tier shortcut available during
# training), to see whether cross_attn's full per-frame token access is
# actually enough to solve the harder task, or whether it just tracked the
# global-pooling story before too. `film`'s mean-pool-then-modulate collapse
# is the earlier lead (see job-07's completed film runs, val_acc oscillating
# 0.42-0.58 with no trend) but the shortcut finding means that comparison
# needs redoing on this split too, once this cell's result is in.
# --out_dir points at a directory separate from both the old split's run and
# the smoke-test's qa_full_runs_crossattn_test/, so none of the three clobber
# each other.
#
# (Originally a smoke test for LayerWiseJEPAInjector's film/cross_attn sites
# the first time they ran on real cluster hardware -- that already passed,
# see job-07's completed film runs -- edit the args below, or copy this file,
# to run a different cell.)
#
# Needs a GPU: Qwen3-VL-2B-Thinking forward/backward passes over video +
# text, same as extract_vlm_guidance_full.py. V-JEPA2 itself is NOT loaded
# here -- this only reads its already-cached vjepa_feats (.npz) written by
# job-03, so no vjepa2 checkpoint fetch step is needed.
#
# --injection {jepa,random,constant,none} x --injection_site {prefix,film,cross_attn}
# is the grid of conditions this codebase supports (--injection_site is
# ignored when --injection none, since that condition never builds an
# injector or hook); this Job runs exactly one cell (jepa x cross_attn,
# layer_strategy=middle4) at a time -- edit the args below (or copy this
# file) to run a different cell.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-train-qa-injection
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # Same compute-capability floor as job-03 (installed
                  # PyTorch build only supports sm_75/80/86/90/100/120).
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      # Excluded 2026-08-22: 11GB is enough compute
                      # capability-wise but not memory-wise -- the frozen
                      # Qwen3-VL-2B model alone eats ~10.5GB, leaving no
                      # headroom for the paired A/B logprob forward+backward's
                      # activations. Confirmed via kubectl logs on job-07's
                      # jepa-film run: 100% of items skipped with "CUDA out of
                      # memory ... GPU 0 has a total capacity of 10.57 GiB".
                      # The A10 (23GB) job-07 runs completed fine, so the
                      # floor is somewhere between.
                      - NVIDIA-GeForce-RTX-2080-Ti
                  # Excluded 2026-08-18: both hit "GPU is lost" NVLink
                  # device-plugin admission errors on back-to-back attempts
                  # (nrp-fiona-001, then ry-gpu-01 twice) -- a cluster-side
                  # driver/hardware issue, not something a retry from this
                  # Job fixes. Remove once confirmed healthy again.
                  #
                  # hcc-chase-shor-c4705.unl.edu added 2026-08-27: same
                  # UnexpectedAdmissionError / PodScheduled=False signature,
                  # hit on both of this job's backoffLimit=1 attempts (both
                  # landed on this same node).
                  #
                  # k8s-gen4-05.calit2.optiputer.net added 2026-08-28: a
                  # different failure mode -- admits fine, but its path to
                  # the shared CephFS is badly congested/distant, so every
                  # item's video/feature read crawls (confirmed ~70-75s/step
                  # vs. ~20-35s/step on a healthy node, GPU util ~26%) on TWO
                  # separate runs landing on this exact node. Not an
                  # admission failure, so it wouldn't be caught by the
                  # UnexpectedAdmissionError signature above -- caught
                  # instead by train_qa_full.py's early I/O-bound warning.
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-fiona-001.sdmz.amnh.org
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - hcc-chase-shor-c4705.unl.edu
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
      containers:
        - name: train-qa-injection
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              # Idempotent data-layout symlinks -- same as job-03, so this
              # Job doesn't silently depend on manual setup done ad hoc in
              # an interactive pod.
              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/train_qa_full.py \
                --split /data/raw_data/qa_split_temporal.json \
                --injection jepa \
                --injection_site cross_attn \
                --layer_strategy middle4 \
                --epochs 1 \
                --val_every_steps 500 \
                --max_val_items 100 \
                --out_dir /data/raw_data/qa_full_runs_temporal
              # 2026-08-28: dropped --max_train_items -- the earlier
              # --max_train_items 2000 cap was only ever meant as a quick
              # first read, not a real limit, and step 200's healthy
              # near-chance start (0.4372, no shortcut available) already
              # confirmed the pipeline works on this split. Use the full
              # ~6690 same-video-hard train rows for a real run instead.
              # --val_every_steps raised to 500 and --max_val_items dropped
              # to 100 (50 anchors -> 50 easy + 50 hard rows) to bound
              # periodic-validation cost: the prior run's 400-item eval alone
              # took 7.5h on a slow node (see train_qa_full.py's new
              # I/O-bound early-warning check, added after that run went
              # unnoticed for 13+ hours). --out_dir points at a fresh
              # directory (not the smoke-test's
              # qa_full_runs_temporal_crossattn_test/) since this is meant as
              # the real run, not a disposable trend-check.
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            # Keep the Qwen3-VL-2B-Thinking download (~4-5GB) on the data
            # PVC, not the pod's bounded ephemeral-storage -- same reasoning
            # as job-03's checkpoint fetch and job-04's snapshot_download.
            - name: HF_HOME
              value: /data/hf_cache
            # Container stdout is fully-buffered (not line-buffered) when
            # piped, unlike a terminal -- without this, kubectl logs shows
            # nothing for long stretches even though the script is printing.
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "6"
              memory: "24Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "7.2"
              memory: "28800Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never
  backoffLimit: 1 # tolerate one retry for a bad-node ("GPU is lost") admission
                  # failure, seen in practice on this cluster; a real code
                  # error will still fail loudly on the 2nd attempt

# Apply with:
#   kubectl apply -f job-05-train-qa-injection.yaml -n williamli-scvl
# Watch it:
#   kubectl get pods -n williamli-scvl -w
#   kubectl logs -f job/ruixin-train-qa-injection -n williamli-scvl
# Clean up when done (Golden Rule #4):
#   kubectl delete job ruixin-train-qa-injection -n williamli-scvl
#
# Output: raw_data/qa_full_runs/<injection>/{train_log.jsonl,best.pt} under
# the data PVC (i.e. /data/raw_data/qa_full_runs/jepa/ for this Job's args).
