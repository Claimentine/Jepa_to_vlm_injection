# Step 55 smoke test: the one cell of the ablation grid that was never
# actually tried -- EMA loss normalization (job-34's fix for rev_loss's raw
# magnitude dominating the shared bridge's gradient) COMBINED with
# cycle_loss_weight=0 and bridge_hidden_dim=2048 (job-42's own winning
# combination, which currently holds the best forward results on both COIN
# full-test and TempCompass OOD).
#
# Re-reading job-36/job-42's actual --disable_norm flag while explaining the
# ablation matrix (2026-10-01) surfaced that job-42 == job-36's exact
# raw-sum/no-normalization setting, just with the bigger bridge -- job-42
# was NEVER run with normalization on. The two changes that are each known
# to help (job-22->job-34: EMA normalization, +13.7pp TempCompass;
# job-36->job-42: bigger bridge, +11.8pp TempCompass) have different
# mechanisms (fixing gradient-scale imbalance vs. fixing a representational
# bottleneck) and were never combined. This run is the single-variable step
# against job-42: same --cycle_loss_weight 0, same --bridge_hidden_dim 2048,
# just WITHOUT --disable_norm (so fwd/rev/cyc all go through
# LossNormalizer.normalize() before summing, same as job-34).
#
# Also notable: job-48 (bridge capacity + COIN mixing) showed a concerning
# downward trend and was stopped early -- but job-48 used job-34's
# normalized+cycle=0.1 setting, not job-42's raw-sum+cycle=0 setting, so
# that failure was never isolated from the normalization-on confound either.
# If THIS run (normalized + cycle=0 + bigger bridge, VANS-only) is healthy,
# the natural follow-up is job-48 redone with this exact recipe + COIN
# mixing, as a cleaner retry of what job-48 was trying to test.
#
# Smoke test (small --max_train_items cap) before a full run, same
# discipline as job-08/14/31/33/35/39 -- no new code here (just an existing
# flag combination that's never been exercised together), but cheap enough
# to verify the training loop doesn't error out on this specific combo
# before committing a full 2-GPU DDP run to it.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-smoke-norm-plus-bridge
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nrp-fiona-001.sdmz.amnh.org
                      - hcc-chase-shor-c4705.unl.edu
                      - ry-gpu-01.sdsc.optiputer.net
                      - ry-gpu-03.sdsc.optiputer.net
                      - k8s-gen4-05.calit2.optiputer.net
                      - hcc-nrp-shor-c6017.unl.edu
                      - hcc-nrp-shor-c6009.unl.edu
                      - k8s-chase-ci-07.calit2.optiputer.net
                      - k8s-3090-01.usd.edu
                      - k8s-haosu-15.sdsc.optiputer.net
                      - hcc-nrp-shor-c5909.unl.edu
                      - hcc-nrp-shor-c5925.unl.edu
                      - hpc-nrp-g1.nmsu.edu
                      - nautilus-ext-gpu01.fullerton.edu
                      - k8s-chase-ci-02.calit2.optiputer.net
                      - ry-gpu-15.sdsc.optiputer.net
                      - hcc-nrp-shor-c5809.unl.edu
      containers:
        - name: smoke-norm-plus-bridge
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              "$PY" -m pip install --quiet h5py
              export PATH="$(dirname "$PY"):$PATH"

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              cd "$REPO"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              exec torchrun --standalone --nproc_per_node=2 \
                vans_qa/full_scale/train_joint_coupled_normalized.py \
                --qa_split /data/raw_data/qa_split_temporal.json \
                --cycle_loss_weight 0 \
                --bridge_hidden_dim 2048 \
                --epochs 1 \
                --max_train_items 40 \
                --val_every_steps 10 \
                --save_every_steps 20 \
                --max_val_items 20 \
                --out_dir /data/raw_data/joint_coupled_norm_bridge_smoke
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
            - name: PYTORCH_ALLOC_CONF
              value: expandable_segments:True
          resources:
            requests:
              cpu: "10"
              memory: "27Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "2"
            limits:
              cpu: "12"
              memory: "31500Mi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "2"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-ddp
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-55-smoke-norm-plus-bridge.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-smoke-norm-plus-bridge -n williamli-scvl
# Clean up when done:
#   kubectl delete job ruixin-smoke-norm-plus-bridge -n williamli-scvl
