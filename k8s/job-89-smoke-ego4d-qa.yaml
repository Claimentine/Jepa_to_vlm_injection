# Step 89 smoke test: extract_ego4d_qa.py (new file) -- Ego4D as a 5th/6th
# forward QA benchmark, egocentric/daily-life domain, built from job-50's
# already-downloaded GoalStep videos (no new Ego4D download -- credentials
# are currently expired). --limit_videos 10 smoke test before a full run,
# same discipline as job-59's own CrossTask smoke test.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-smoke-ego4d-qa
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
      containers:
        - name: smoke-ego4d-qa
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              cd "$REPO"

              GOALSTEP=$(find /data/raw_data/ego4d_annotations -iname "goalstep_train.json" | head -1)
              echo "using goalstep annotations: $GOALSTEP"

              mkdir -p /data/vans_work_ego4d_qa
              "$PY" vans_qa/full_scale/extract_ego4d_qa.py \
                --goalstep_json "$GOALSTEP" \
                --video_cache_dir /data/vans_work/ego4d_raw_videos \
                --limit_videos 10 \
                --output_qa_split /data/raw_data/qa_split_ego4d_smoke.json \
                --clips_root /data/vans_work_ego4d_qa/clips_smoke \
                --vjepa_cache_dir /data/vans_work_ego4d_qa/vjepa_cache_full_smoke
          env:
            - name: VANS_ROOT
              value: /data
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: VJEPA2_CKPT
              value: /data/checkpoints/vjepa2/vitl.pt
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "5"
              memory: "13Gi"
              ephemeral-storage: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: "15600Mi"
              ephemeral-storage: "4800Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-89-smoke-ego4d-qa.yaml -n williamli-scvl
