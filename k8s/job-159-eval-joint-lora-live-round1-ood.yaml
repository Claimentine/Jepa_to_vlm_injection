# Step 159: OOD forward-QA eval of job-155's checkpoint (the first real
# "freeze JEPA's own encoder, LoRA/live-VLM everything else, genuinely joint"
# training run -- 3000 steps, /data/raw_data/joint_lora_live_round1_runs).
# Evaluates BOTH step_3000.pt (final) and best_forward.pt (best val acc
# during training) across the same benchmark set this project has used for
# every prior OOD comparison: TempCompass, MVBench (both externally-authored,
# not built with this project's own easy/hard distractor scheme), CrossTask,
# Ego4D, and YouCook2 (both "easy"-scheme, cross-video distractors, per this
# session's own code read of their build scripts).
#
# This directly tests this session's own hypothesis from job-155's val-time
# results: "easy"-tagged items scored BELOW chance while "hard"-tagged items
# stayed ABOVE chance throughout training, the opposite of normal
# expectation -- hypothesized as VLM-LoRA trading the frozen VLM's zero-shot
# shortcut-solving ability (which easy items are vulnerable to) for genuine
# JEPA-injection-dependent understanding (which hard items require). If that
# hypothesis is right, CrossTask/Ego4D/YouCook2 (all easy-scheme, no
# same-video distractor pressure) should show degraded accuracy here, while
# TempCompass/MVBench should hold up or improve relative to this project's
# earlier (non-LoRA, non-joint) checkpoints.
#
# --lora_vlm (r=8 alpha=16) matches job-155's own training flags exactly --
# required so the checkpoint's vlm_lora_state loads into a correctly-shaped
# LoRA-wrapped model instead of being silently ignored.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-eval-joint-lora-live-round1-ood
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values:
                      - "16000"
      containers:
        - name: eval-joint-lora-live-round1-ood
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              RUN=/data/raw_data/joint_lora_live_round1_runs
              CKPT_FINAL="round1_step3000=${RUN}/step_3000.pt"
              CKPT_BESTFWD="round1_best_forward=${RUN}/best_forward.pt"

              cd "$REPO"

              echo "=== TempCompass OOD ==="
              export VANS_WORK_ROOT=/data/vans_work_tempcompass
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --checkpoint "$CKPT_FINAL" --checkpoint "$CKPT_BESTFWD" \
                --lora_vlm --lora_vlm_r 8 --lora_vlm_alpha 16 \
                --qa_split /data/raw_data/qa_split_tempcompass.json \
                --split_part test \
                --resume \
                --out_path /data/raw_data/round1_lora_live_eval_tempcompass.json

              echo "=== MVBench OOD ==="
              export VANS_WORK_ROOT=/data/vans_work_mvbench
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --checkpoint "$CKPT_FINAL" --checkpoint "$CKPT_BESTFWD" \
                --lora_vlm --lora_vlm_r 8 --lora_vlm_alpha 16 \
                --qa_split /data/raw_data/qa_split_mvbench.json \
                --split_part test \
                --resume \
                --out_path /data/raw_data/round1_lora_live_eval_mvbench.json

              echo "=== CrossTask OOD (live decode) ==="
              export VANS_WORK_ROOT=/data/vans_work_crosstask
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --checkpoint "$CKPT_FINAL" --checkpoint "$CKPT_BESTFWD" \
                --lora_vlm --lora_vlm_r 8 --lora_vlm_alpha 16 \
                --qa_split /data/raw_data/qa_split_crosstask.json \
                --split_part test \
                --resume \
                --out_path /data/raw_data/round1_lora_live_eval_crosstask.json

              echo "=== Ego4D GoalStep OOD (live decode) ==="
              export VANS_WORK_ROOT=/data/vans_work_ego4d_qa
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --checkpoint "$CKPT_FINAL" --checkpoint "$CKPT_BESTFWD" \
                --lora_vlm --lora_vlm_r 8 --lora_vlm_alpha 16 \
                --qa_split /data/raw_data/qa_split_ego4d.json \
                --split_part test \
                --resume \
                --out_path /data/raw_data/round1_lora_live_eval_ego4d.json

              echo "=== YouCook2 OOD (easy-scheme, live decode) ==="
              export VANS_WORK_ROOT=/data/vans_work_youcook
              "$PY" vans_qa/full_scale/eval_forward_checkpoint.py \
                --checkpoint "$CKPT_FINAL" --checkpoint "$CKPT_BESTFWD" \
                --lora_vlm --lora_vlm_r 8 --lora_vlm_alpha 16 \
                --qa_split /data/raw_data/qa_split_youcook2.json \
                --split_part test \
                --resume \
                --out_path /data/raw_data/round1_lora_live_eval_youcook2.json
              echo "SCRIPT_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "4"
              memory: "24Gi"
              ephemeral-storage: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4.8"
              memory: "28Gi"
              ephemeral-storage: "2400Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-youcook
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-159-eval-joint-lora-live-round1-ood.yaml -n williamli-scvl
