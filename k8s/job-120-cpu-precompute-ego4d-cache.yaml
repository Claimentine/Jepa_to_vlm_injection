# Step 120: CPU-ONLY precompute cache for the Ego4D GoalStep forward eval
# split (qa_split_ego4d.json's "test" key, 1829 items -- job-104). Same
# rationale as job-99/job-100: this cache is reusable across every
# checkpoint job-119 evaluates against Qwen3-VL-2B-Thinking, a one-time
# cost, and keeps the GPU eval job GPU-bound instead of paying live
# decode+processor cost per item (see build_eval_input_cache.py's own
# docstring).
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-cpu-precompute-ego4d-cache
spec:
  backoffLimit: 2
  template:
    spec:
      containers:
        - name: cpu-precompute-ego4d-cache
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              cd "$REPO"

              echo "=== Ego4D GoalStep precompute cache ==="
              export VANS_WORK_ROOT=/data/vans_work_ego4d_qa
              "$PY" vans_qa/full_scale/build_eval_input_cache.py \
                --qa_split /data/raw_data/qa_split_ego4d.json \
                --split_part test \
                --cache_dir /data/vans_work_ego4d_qa/eval_input_cache_ego4d \
                --num_shards 1 --shard_idx 0

              echo "CPU_PRECOMPUTE_EGO4D_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: HF_HOME
              value: /data/hf_cache
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "7"
              memory: "16Gi"
              ephemeral-storage: "4Gi"
            limits:
              cpu: "7"
              memory: "16Gi"
              ephemeral-storage: "4800Mi"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-precompute
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-120-cpu-precompute-ego4d-cache.yaml -n williamli-scvl
