# Step 155: first REAL (non-smoke) training run of the combined
# "freeze JEPA's own encoder, LoRA/train everything else, genuinely joint
# across both directions" recipe -- train_joint_coupled_normalized.py with
# --lora_vlm --lora_predictor --live_vlm together, validated end-to-end by
# job-154's smoke test (5/5 steps, 0 items skipped on either side, both
# losses moving, checkpoint saved with vlm_lora_state) and job-152's own
# gradient-flow confirmation (zero at step 1 by the guidance gate's own
# zero-init design, opening to 0.03-0.13 by step 2+).
#
# Budget: 3000 steps, NOT job-72's own step count -- this is a brand new,
# markedly heavier recipe (every step now does a full VLM forward+backward
# for the forward direction's A/B scoring AND a full live VLM forward for
# the reverse direction's own guidance extraction, through the SAME
# 2.14B-param model, plus live video decode on both sides instead of a
# cached-array read) -- real per-step wall-clock time at this scale is
# untested, so this is a deliberately conservative first real attempt, not
# a replication of any prior run's step count. --save_every_steps 250 (not
# the project's usual 1000) given this is the first time this recipe has
# run for real and a 46GB-class node is scarce/queue-prone -- cheap
# insurance against losing progress to a preemption or node failure.
#
# Keeps job-72's own --bridge_hidden_dim 2048 (bridge capacity, unrelated to
# LoRA -- the bridge itself is never LoRA-wrapped, always dense) for
# comparability to this project's existing "best" reference point.
# --cycle_loss_weight left at this script's own default (0.1, EMA-normalized)
# rather than job-72's raw-loss-era 0 -- this run uses the normalized loss
# path, which is what disable_norm=False (left unset here) means.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-joint-lora-live-round1
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values:
                      - "40000"
      containers:
        - name: joint-lora-live
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              cd "$REPO"

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/joint_lora_live_round1_runs
              "$PY" vans_qa/full_scale/train_joint_coupled_normalized.py \
                --qa_split /data/raw_data/qa_split_temporal.json \
                --cache_dir /data/vans_work/vlm_guidance_cache_paired \
                --rev_qa_split /data/raw_data/qa_split_full.json \
                --bridge_hidden_dim 2048 \
                --lora_vlm --lora_vlm_r 8 --lora_vlm_alpha 16 \
                --lora_predictor --lora_predictor_r 8 --lora_predictor_alpha 16 \
                --live_vlm \
                --epochs 1 \
                --max_steps 3000 \
                --val_every_steps 250 \
                --save_every_steps 250 \
                --max_val_items 100 \
                --max_test_items 100 \
                --out_dir /data/raw_data/joint_lora_live_round1_runs 2>&1 \
                | tee /data/raw_data/joint_lora_live_round1_runs/full_run.log
              echo "SCRIPT_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "4"
              memory: "28Gi"
              ephemeral-storage: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4.8"
              memory: "32Gi"
              ephemeral-storage: "6Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-155-joint-lora-live-round1.yaml -n williamli-scvl
