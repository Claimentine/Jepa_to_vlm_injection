# Step 59 smoke test: extract_crosstask_qa.py (new file) -- CrossTask as a
# 4th, domain-matched out-of-domain benchmark alongside TempCompass/MVBench.
# See that script's own module docstring for the full rationale (CrossTask's
# annotation schema is structurally identical to COIN's: 18 tasks, each
# video an ordered list of manually-timed steps -- a much closer domain
# match to VANS/COIN's own "predict what happens next in an instructional
# video" objective than TempCompass/MVBench's general-purpose temporal
# reasoning). New code, two real external dependencies (yt-dlp download,
# ffmpeg trim) plus V-JEPA2 encoding -- smoke test before a full run, same
# discipline as job-08/14/23/31/33/35/39/55.
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-smoke-crosstask-qa
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: NotIn
                    values:
                      - NVIDIA-TITAN-Xp
                      - NVIDIA-TITAN-X-Pascal
                      - NVIDIA-GeForce-GTX-1080
                      - NVIDIA-GeForce-GTX-1080-Ti
                      - Quadro-M4000
                      - Tesla-V100-PCIE-16GB
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-TITAN-RTX
      containers:
        - name: smoke-crosstask-qa
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection

              "$PY" -m pip install --quiet yt-dlp
              export PATH="$(dirname "$PY"):$PATH"
              which yt-dlp

              echo "=== installing deno (yt-dlp JS runtime) ==="
              cd /tmp
              curl -sL https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip -o deno.zip
              unzip -q deno.zip
              ./deno --version

              cd "$REPO"
              exec "$PY" vans_qa/full_scale/extract_crosstask_qa.py \
                --limit_videos 10 \
                --output_qa_split /data/raw_data/qa_split_crosstask_smoke.json \
                --annotations_cache_dir /data/vans_work_crosstask/crosstask_annotations \
                --video_cache_dir /data/vans_work_crosstask/crosstask_raw_videos_smoke \
                --clips_root /data/vans_work_crosstask/clips_smoke \
                --vjepa_cache_dir /data/vans_work_crosstask/vjepa_cache_full_smoke
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work_crosstask
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: VJEPA2_CKPT
              value: /data/checkpoints/vjepa2/vitl.pt
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "5"
              memory: "13Gi"
              ephemeral-storage: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: "15600Mi"
              ephemeral-storage: "4800Mi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              ephemeral-storage: "1200Mi"
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-vlm
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-59-smoke-crosstask-qa.yaml -n williamli-scvl
# Watch it:
#   kubectl logs -f job/ruixin-smoke-crosstask-qa -n williamli-scvl
# Clean up when done:
#   kubectl delete job ruixin-smoke-crosstask-qa -n williamli-scvl
