# Step 177: LoRA model, EASY+HARD train (each hard row plus its easy twin).
#
# The LoRA model (VLM LoRA + predictor LoRA, live VLM guidance, job-169b's
# optimizer settings) trained on the DATA recipe of the best frozen-VLM run,
# job-72 (val easy 0.94 / hard 0.78): qa_split_temporal.json's COIN/VANS rows
# (no YouCook2), 13,380 forward samples (job-72's 2 epochs over 6,690 rows).
# The LoRA runs so far (job-169b, job-172/173) trained on the merged
# COIN/VANS+YouCook2 hard split and stayed at chance, with easy val collapsing
# below chance (0.22) -- the shortcut job-72 also showed once (step 4500).
# job-176/177/178 differ ONLY in the train side of --qa_split (hard /
# easy+hard / easy; easy twins from build_easy_train_split.py, distractor =
# another video's correct caption); val/test identical, 500 val items every
# 1000 steps. --max_steps 13380 also ends the cosine schedule there, so all
# three get the same lr curve. One L40/L40S each (us-west A100/A6000s full).
apiVersion: batch/v1
kind: Job
metadata:
  name: ruixin-lora-temporal-mixed
spec:
  backoffLimit: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - us-west
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L40
                      - NVIDIA-L40S
      containers:
        - name: lora-temporal-mixed
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command:
            - "bash"
          args:
            - "-c"
            - |
              set -euo pipefail
              PY=/home/jovyan/conda-envs/qwen3vl/bin/python
              REPO=/code/Jepa_to_vlm_injection
              cd "$REPO"

              mkdir -p "$VANS_WORK_ROOT"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/clips"
              ln -sfn /data/hf_data/vans_injection_backup "$VANS_WORK_ROOT/vjepa_cache_full"

              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              mkdir -p /data/raw_data/lora_temporal_mixed_runs
              "$PY" vans_qa/full_scale/train_joint_coupled_normalized.py \
                --qa_split /data/raw_data/qa_split_temporal_mixed.json \
                --cache_dir /data/vans_work/vlm_guidance_cache_paired \
                --rev_qa_split /data/raw_data/qa_split_full.json \
                --bridge_hidden_dim 2048 \
                --lora_vlm --lora_vlm_r 8 --lora_vlm_alpha 16 \
                --lora_predictor --lora_predictor_r 8 --lora_predictor_alpha 16 \
                --live_vlm \
                --lr 1e-4 --vlm_lr 3e-5 \
                --lr_schedule warmup_cosine --warmup_steps 1300 \
                --grad_clip_norm 1.0 \
                --epochs 2 \
                --max_steps 13380 \
                --val_every_steps 1000 \
                --save_every_steps 1000 \
                --max_val_items 500 \
                --max_test_items 500 \
                --out_dir /data/raw_data/lora_temporal_mixed_runs 2>&1 \
                | tee /data/raw_data/lora_temporal_mixed_runs/full_run.log
              echo "SCRIPT_DONE"
          env:
            - name: VANS_ROOT
              value: /data
            - name: VANS_WORK_ROOT
              value: /data/vans_work
            - name: THINKJEPA_ROOT
              value: /home/jovyan/ThinkJEPA
            - name: HF_HOME
              value: /data/hf_cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FORCE_QWENVL_VIDEO_READER
              value: decord
          resources:
            requests:
              cpu: "4"
              memory: "28Gi"
              ephemeral-storage: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4.8"
              memory: "32Gi"
              ephemeral-storage: "6Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /home/jovyan
            - name: data-storage
              mountPath: /data
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "1Gi"}
            limits: {cpu: "1", memory: "2Gi", ephemeral-storage: "1200Mi"}
          args:
            - clone
            - --single-branch
            - https://github.com/Claimentine/Jepa_to_vlm_injection.git
            - /opt/repo/Jepa_to_vlm_injection
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo
      volumes:
        - name: git-repo-code
          emptyDir: {}
        - name: conda-storage
          persistentVolumeClaim:
            claimName: ruixin-conda-vol-ddp
        - name: data-storage
          persistentVolumeClaim:
            claimName: jepa-vlm-injection-data-vol
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never

# Apply with:
#   kubectl apply -f job-177-lora-temporal-mixed.yaml -n williamli-scvl
